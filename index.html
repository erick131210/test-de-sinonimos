{n:752,p:"¿Qué diferencia hay entre TCP y UDP?",o:["A) UDP es orientado a conexión; TCP no","B) TCP es orientado a conexión; UDP no garantiza la entrega","C) Ambos garantizan la entrega","D) Ambos son de la capa Internet","E) TCP no usa puertos"],r:1,a:"UDP deja la entrega de los paquetes a la responsabilidad de la aplicación."},
{n:753,p:"¿Cuál NO es característica de un protocolo orientado a conexión?",o:["A) El camino de los paquetes se establece por adelantado","B) Los recursos se establecen por adelantado","C) Se envía cada paquete por un camino independiente sin reservas","D) Se asegura la reserva de recursos durante toda la conexión","E) Al terminar la transferencia se libera la conexión y los recursos"],r:2,a:"Las cuatro características incluyen camino, recursos, reserva y liberación al finalizar."},
{n:754,p:"¿Qué es un daemon?",o:["A) Un virus informático","B) Un tipo de puerto","C) Un protocolo de transporte","D) El programa servidor de una aplicación (en la mitología griega, «espíritu guardián»)","E) Una dirección reservada"],r:3,a:"Las aplicaciones suelen incluir un cliente y un programa servidor llamado daemon."},
{n:755,p:"¿Cuál es el rango de los números de puerto TCP/UDP?",o:["A) 0 a 255","B) 1 a 1023","C) 0 a 1,000,000","D) 1024 a 65,535","E) 0 a 65,535"],r:4,a:"Cada puerto se etiqueta con un número entero de 0 a 65,535."},
{n:756,p:"¿Qué puertos se reservan para uso del sistema?",o:["A) Del 0 al 1023","B) Del 1024 al 65 535","C) Del 1 al 255","D) Del 256 al 1023","E) Del 0 al 100"],r:0,a:"Por convención, los puertos de origen asignados por el SO son mayores a 1024."},
{n:757,p:"¿Qué cuatro datos identifican de forma única una conexión entre dos máquinas?",o:["A) MAC origen, MAC destino, IP origen e IP destino","B) IP origen, IP destino, puerto origen y puerto destino","C) Puerto origen, puerto destino, TTL y checksum","D) IP origen, máscara, puerto y MTU","E) Número de secuencia, ACK, IP y puerto"],r:1,a:"La combinación de estos cuatro valores es única."},
{n:758,p:"¿Qué servicio utiliza por defecto el puerto 80?",o:["A) FTP","B) Telnet","C) HTTP","D) DNS","E) SMTP"],r:2,a:"El puerto 80 es un puerto de servicio bien conocido para HTTP."},
{n:759,p:"¿El puerto TCP 513 es igual al puerto UDP 513?",o:["A) Sí, son el mismo puerto","B) Sí, pero solo en Linux","C) No, UDP no usa puertos","D) No, son puertos distintos que sirven a servicios diferentes (rlogin y rwho)","E) Solo son distintos en Windows"],r:3,a:"Aunque TCP y UDP se basan en puertos, sus números no entran en conflicto."},
{n:760,p:"¿Qué organismo publica el RFC «Assigned Numbers» con los puertos asignados?",o:["A) ISO","B) ANSI","C) IEEE","D) DARPA","E) IETF"],r:4,a:"El IETF administra centralmente los números de puertos bien conocidos."},
{n:761,p:"¿Cuál es la interfaz de programación más común en el mundo UNIX para TCP/IP?",o:["A) La Librería de Sockets de Berkeley","B) La librería POSIX de hilos","C) La librería X Windows","D) La librería de ARP","E) La librería de Winsock"],r:0,a:"Se llama así por la analogía de ver los puertos como enchufes."},
{n:762,p:"¿Qué clase de sockets maneja TCP/IP en la librería de Berkeley?",o:["A) AF_UNIX","B) AF_INET","C) AF_XNS","D) AF_X25","E) AF_LOCAL"],r:1,a:"AF_UNIX maneja conexiones locales a la máquina."},
{n:763,p:"¿Qué significan las siglas OSI?",o:["A) Open Software Internet","B) Operating System Interface","C) Open System Interconnect","D) Open Standard Interchange","E) Optimal System Integration"],r:2,a:"El modelo fue introducido en 1978 por la ISO."},
{n:764,p:"¿Cuántas capas tiene el modelo OSI?",o:["A) Cuatro","B) Cinco","C) Seis","D) Siete","E) Ocho"],r:3,a:"El modelo OSI divide la comunicación de datos en siete capas."},
{n:765,p:"¿Cuál es la principal desventaja de la arquitectura de siete capas?",o:["A) El costo del hardware","B) La falta de estándares","C) La dependencia de un fabricante","D) La imposibilidad de usar redes","E) La sobrecarga por agregar encabezados a la información"],r:4,a:"El documento señala la tremenda cantidad de sobrecarga por los encabezados."},
{n:766,p:"¿Qué capas OSI equivalen a la capa Aplicación del modelo DoD?",o:["A) Aplicación, Presentación y Sesión","B) Transporte y Red","C) Enlace de Datos y Física","D) Red y Enlace","E) Sesión y Transporte"],r:0,a:"El modelo DoD agrupa esas tres capas OSI en su capa de Aplicación."},
{n:767,p:"¿A qué capa OSI corresponde la capa Internet del modelo DoD?",o:["A) Transporte","B) Red","C) Enlace de datos","D) Sesión","E) Física"],r:1,a:"Se encarga del ruteo entre redes."},
{n:768,p:"¿A qué capas OSI corresponde la capa de Acceso a Redes del modelo DoD?",o:["A) Red y Transporte","B) Sesión y Presentación","C) Enlace de Datos y Física","D) Aplicación y Presentación","E) Transporte y Sesión"],r:2,a:"Es la interconexión física entre los dos puntos."},
{n:769,p:"¿Qué son los estándares «de jure»?",o:["A) Los que existen por costumbre de uso","B) Los creados por un fabricante","C) Los que no están documentados","D) Los respaldados por un organismo como ISO, ANSI o IEEE","E) Los temporales"],r:3,a:"Ejemplos: código ASCII, POSIX y modelo OSI. Los «de facto» cubren huecos dejados por los de jure."},
{n:770,p:"¿Cómo se llama la unidad de transmisión de TCP?",o:["A) Datagrama","B) Frame","C) Mensaje","D) Bit","E) Segmento"],r:4,a:"Un segmento contiene un encabezado y datos de aplicación."},
{n:771,p:"¿Cómo se llama la unidad de transmisión de IP?",o:["A) Datagrama","B) Segmento","C) Frame","D) Mensaje","E) Trama TCP"],r:0,a:"Contiene un encabezado IP acompañado de datos de la capa de transporte."},
{n:772,p:"¿Cómo se llama la unidad de transmisión en la capa de interfaz de redes?",o:["A) Segmento","B) Frame","C) Datagrama","D) Mensaje","E) Paquete UDP"],r:1,a:"Consiste de un encabezado de red acompañado de datos de la capa IP."},
{n:773,p:"¿Qué protocolos usan «mensajes» como unidad de transmisión?",o:["A) Solo TCP","B) Solo IP","C) Los no fiables como ICMP, UDP e IGMP","D) FTP y Telnet","E) ARP y RARP"],r:2,a:"Un mensaje contiene el encabezado del protocolo y datos de aplicación o de protocolo."},
{n:774,p:"¿Qué tamaño tiene el encabezado Ethernet en un frame TCP/IP típico?",o:["A) 20 bytes","B) 4 bytes","C) 46 bytes","D) 14 bytes","E) 1500 bytes"],r:3,a:"El frame lleva Ethernet (14), IP (20), TCP (20), datos y final Ethernet (4)."},
{n:775,p:"¿Qué tamaño tienen los encabezados IP y TCP sin opciones?",o:["A) 14 bytes cada uno","B) 40 bytes cada uno","C) 4 bytes cada uno","D) 8 bytes cada uno","E) 20 bytes cada uno"],r:4,a:"Según el documento, 20 bytes cada uno."},
{n:776,p:"¿Qué tamaño tiene el final (trailer) Ethernet en el frame?",o:["A) 4 bytes","B) 14 bytes","C) 20 bytes","D) 46 bytes","E) 1500 bytes"],r:0,a:"Contiene el CRC."},
{n:777,p:"¿Cuál es el rango de datos de aplicación de un frame Ethernet?",o:["A) 1 a 46 bytes","B) 46 a 1500 bytes","C) 1500 a 4500 bytes","D) 0 a 255 bytes","E) 512 a 1024 bytes"],r:1,a:"Depende de la cantidad de datos de aplicación."},
{n:778,p:"¿Qué tres componentes principales tiene un frame?",o:["A) Encabezado, checksum y puerto","B) Preamble, IP y MAC","C) Encabezado, datos y trailer","D) Segmento, datagrama y mensaje","E) Origen, destino y TTL"],r:2,a:"El trailer contiene el CRC."},
{n:779,p:"¿Cómo obtiene ARP la dirección física de un host local?",o:["A) Consultando un servidor DNS","B) Enviando un mensaje al gateway siempre","C) Usando el puerto 80","D) Enviando un broadcast a todos los hosts de la red local","E) Calculando un checksum"],r:3,a:"Una vez obtenido el mapeo, se guarda una entrada en la caché."},
{n:780,p:"¿Cuáles son las dos fases del proceso ARP?",o:["A) ARP query y ARP drop","B) ARP open y ARP close","C) ARP send y ARP ack","D) ARP syn y ARP fin","E) ARP request y ARP reply"],r:4,a:"Se genera un paquete de petición (broadcast) y uno de respuesta."},
{n:781,p:"¿Cómo responde el host destino a una petición ARP?",o:["A) Envía un reply directamente al origen con su dirección MAC","B) Envía un broadcast a toda la red","C) Ignora la petición","D) Envía su dirección IP al router","E) Responde con un paquete UDP"],r:0,a:"Además actualiza su caché con la información del host origen."},
{n:782,p:"Si el host destino está en otra red, ¿a quién se dirige el broadcast de ARP?",o:["A) A todos los hosts remotos","B) Al router","C) Al servidor DNS","D) Al servidor de correo","E) A la dirección 127.0.0.1"],r:1,a:"El router utiliza ARP para obtener la dirección física del próximo destino."},
{n:783,p:"¿Cuánto tiempo de vida tienen las entradas dinámicas de la caché ARP?",o:["A) 1 minuto","B) 1 hora","C) 10 minutos","D) 24 horas","E) Hasta reiniciar"],r:2,a:"Las dinámicas se crean y se borran automáticamente."},
{n:784,p:"¿Hasta cuándo se conservan las entradas estáticas de la caché ARP?",o:["A) 10 minutos","B) Una hora","C) Para siempre, sin poder borrarse","D) Hasta que la máquina se reinicia o se borran manualmente","E) Hasta el siguiente ping"],r:3,a:"Si ARP recibe una dirección diferente, la entrada se convierte en dinámica."},
{n:785,p:"¿Qué campo de un paquete ARP indica la operación realizada?",o:["A) Hardware Type","B) Protocol Type","C) Hardware Address Length","D) Target's Hardware Address","E) Operation (Opcode)"],r:4,a:"Opcode distingue petición de respuesta."},
{n:786,p:"¿Cuál de estos usos NO corresponde a ICMP?",o:["A) Transferir archivos entre hosts","B) Diagnosticar problemas (ping y tracert)","C) Construir y mantener tablas de ruteo","D) Descubrir la PMTU","E) Ajustar el control de flujo en routers"],r:0,a:"ICMP es protocolo de mantenimiento y diagnóstico; los mensajes se encapsulan dentro de datagramas IP."},
{n:787,p:"¿En qué RFC se define ICMP?",o:["A) RFC 791","B) RFC 792","C) RFC 793","D) RFC 768","E) RFC 950"],r:1,a:"ICMP está en el RFC 792."},
{n:788,p:"¿Qué campo del paquete ICMP indica si es echo request o echo reply?",o:["A) Code","B) Checksum","C) Type","D) Type-specific Data","E) Length"],r:2,a:"Type indica el tipo de paquete."},
{n:789,p:"¿Qué característica tiene el protocolo IP?",o:["A) Es orientado a conexión y fiable","B) Garantiza la entrega en orden","C) Usa números de secuencia y ACK","D) No está orientado a la conexión y ofrece entrega de mínimo esfuerzo","E) Establece una sesión antes del intercambio"],r:3,a:"Un paquete IP puede extraviarse, llegar fuera de secuencia o duplicarse."},
{n:790,p:"¿Cuántos bits tiene el campo Version del encabezado IP?",o:["A) 8 bits","B) 16 bits","C) 32 bits","D) 3 bits","E) 4 bits"],r:4,a:"Version: 4 bits; Header Length: 4 bits."},
{n:791,p:"¿Cuántos bits tiene el campo TTL?",o:["A) 8 bits","B) 4 bits","C) 16 bits","D) 32 bits","E) 13 bits"],r:0,a:"TTL indica los saltos antes de que el datagrama sea descartado."},
{n:792,p:"¿Cuántos bits tienen los campos Source Address y Destination Address de IP?",o:["A) 16 bits cada uno","B) 32 bits cada uno","C) 48 bits cada uno","D) 128 bits cada uno","E) 8 bits cada uno"],r:1,a:"Almacenan la IP del host origen y destino."},
{n:793,p:"¿Qué función tiene el campo Identification del encabezado IP?",o:["A) Indica la versión de IP","B) Indica los saltos máximos","C) Identifica el paquete; todos los fragmentos comparten el mismo identificador","D) Contiene el checksum","E) Contiene la dirección destino"],r:2,a:"Tiene 16 bits."},
{n:794,p:"¿Cuántos bits tiene el campo Fragmentation Offset?",o:["A) 3 bits","B) 8 bits","C) 16 bits","D) 13 bits","E) 4 bits"],r:3,a:"Es un contador que indica la posición del fragmento."},
{n:795,p:"¿Cuántos bits tienen las banderas de fragmentación del encabezado IP?",o:["A) 4 bits","B) 8 bits","C) 13 bits","D) 16 bits","E) 3 bits"],r:4,a:"Flags: 3 bits."},
{n:796,p:"¿Qué protocolo ofrece un servicio orientado a conexión, fiable y de flujos de bytes?",o:["A) TCP","B) UDP","C) IP","D) ICMP","E) ARP"],r:0,a:"TCP se utiliza para comunicaciones de uno a uno."},
{n:797,p:"¿Para qué sirve el mensaje ACK en TCP?",o:["A) Para iniciar una conexión UDP","B) Para verificar que los datos fueron recibidos por el otro host","C) Para resolver direcciones MAC","D) Para fragmentar datos","E) Para asignar puertos"],r:1,a:"Si no se recibe el ACK, la información se retransmite."},
{n:798,p:"¿Cuál es el puerto TCP de FTP?",o:["A) 23","B) 53","C) 21","D) 139","E) 80"],r:2,a:"Ejemplos TCP: FTP 21, Telnet 23, DNS 53, NetBios 139."},
{n:799,p:"¿Cuál es el puerto TCP de Telnet?",o:["A) 21","B) 53","C) 139","D) 23","E) 25"],r:3,a:"Telnet usa el puerto 23."},
{n:800,p:"¿Qué puerto usa NetBios según el documento?",o:["A) 21","B) 23","C) 53","D) 69","E) 139"],r:4,a:"Es uno de los puertos TCP de uso común."},
{n:801,p:"¿Cuántos bits tiene el campo Sequence Number de TCP?",o:["A) 32 bits","B) 16 bits","C) 8 bits","D) 4 bits","E) 6 bits"],r:0,a:"El número de secuencia verifica que todos los bytes fueron recibidos."},
{n:802,p:"¿Qué indica el Acknowledgment Number de TCP?",o:["A) El puerto destino","B) El número de secuencia de los bytes que el host local espera recibir","C) El tamaño de la ventana","D) La longitud del encabezado","E) El checksum del segmento"],r:1,a:"Tiene 32 bits."},
{n:803,p:"¿Qué campo de TCP indica el espacio disponible en la ventana?",o:["A) Urgent Pointer","B) Reserved","C) Window","D) Flags","E) Data Length"],r:2,a:"El campo Window indica qué espacio está disponible."},
{n:804,p:"¿Cuántos bits tienen los campos de puerto de origen y destino en TCP?",o:["A) 8 bits cada uno","B) 32 bits cada uno","C) 4 bits cada uno","D) 16 bits cada uno","E) 6 bits cada uno"],r:3,a:"Los puertos van de 0 a 65,535."},
{n:805,p:"¿Qué tipo de servicio brinda UDP?",o:["A) Orientado a conexión y fiable","B) Orientado a conexión y no fiable","C) No orientado a conexión y fiable","D) De secuenciación de bytes","E) No orientado a conexión y no fiable"],r:4,a:"Los programas que lo usan deben crear sus propios mecanismos de fiabilidad."},
{n:806,p:"¿Cuál es el puerto UDP de TFTP?",o:["A) 69","B) 161","C) 53","D) 15","E) 21"],r:0,a:"UDP: Netstat 15, Domain 53, TFTP 69, SNMP 161."},
{n:807,p:"¿Cuál es el puerto UDP de SNMP?",o:["A) 69","B) 161","C) 53","D) 15","E) 23"],r:1,a:"SNMP usa el puerto UDP 161."},
{n:808,p:"¿Qué campos tiene el encabezado de un paquete UDP?",o:["A) Sequence Number, ACK, Window y Flags","B) Version, TTL, Protocol y Checksum","C) Source Port, Destination Port, Message Length y Checksum","D) Hardware Type y Opcode","E) Type, Code y Checksum"],r:2,a:"Es un encabezado simple de cuatro campos."},
{n:809,p:"¿Qué ocurre si el puerto de origen UDP no se usa?",o:["A) Se asigna 1024","B) Se usa el puerto 80","C) El paquete se descarta","D) Su valor es igual a cero","E) Se usa el puerto de destino"],r:3,a:"El puerto de origen UDP es un valor opcional."},
{n:810,p:"¿Cuántos bits tiene una dirección IP (IPv4) y cómo se divide?",o:["A) 32 bits divididos en tres octetos","B) 48 bits divididos en seis octetos","C) 64 bits divididos en ocho octetos","D) 128 bits divididos en ocho grupos","E) 32 bits divididos en cuatro octetos"],r:4,a:"Los octetos se separan por puntos."},
{n:811,p:"¿Qué identifica el Network ID?",o:["A) El segmento físico de red en el que están los hosts; es igual para todos ellos","B) Al host dentro de la red","C) La dirección MAC","D) El puerto de la aplicación","E) El nombre del dominio"],r:0,a:"Debe ser único en una internetwork."},
{n:812,p:"¿Qué identifica el Host ID?",o:["A) El segmento de red","B) La estación de trabajo, servidor, router u otro host dentro de un segmento","C) La máscara de red","D) El protocolo en uso","E) El tipo de cable"],r:1,a:"Debe ser único dentro del network ID."},
{n:813,p:"¿Cuántos bits componen un octeto?",o:["A) 4","B) 16","C) 8","D) 32","E) 6"],r:2,a:"Un octeto son 8 bits."},
{n:814,p:"¿Cuál es la suma de los valores de los 8 bits en 1 (1+2+4+8+16+32+64+128)?",o:["A) 256","B) 127","C) 254","D) 255","E) 128"],r:3,a:"11111111 en binario es 255 en decimal."},
{n:815,p:"¿Qué clases de red soporta TCP/IP para asignar a hosts?",o:["A) A, B, C y D","B) B, C y D","C) Solo C","D) A y B","E) A, B y C"],r:4,a:"D y E se reservan para multicast y uso experimental."},
{n:816,p:"¿Con qué bit(s) inicia el primer octeto de una dirección clase A?",o:["A) 0","B) 10","C) 110","D) 1110","E) 1111"],r:0,a:"Clase A: 0xxxxxxx."},
{n:817,p:"¿Con qué bits inicia el primer octeto de una dirección clase B?",o:["A) 0","B) 10","C) 110","D) 1110","E) 1111"],r:1,a:"Clase B: 10xxxxxx."},
{n:818,p:"¿Con qué bits inicia el primer octeto de una dirección clase C?",o:["A) 0","B) 10","C) 110","D) 1110","E) 1111"],r:2,a:"Clase C: 110xxxxx."},
{n:819,p:"¿Cuál es el rango del primer octeto de la clase A?",o:["A) 128 – 191","B) 192 – 223","C) 224 – 239","D) 1 – 126","E) 0 – 255"],r:3,a:"El 127 se reserva para loopback."},
{n:820,p:"¿Cuál es el rango del primer octeto de la clase B?",o:["A) 1 – 126","B) 192 – 223","C) 224 – 239","D) 240 – 255","E) 128 – 191"],r:4,a:"Máscara por defecto: 255.255.0.0."},
{n:821,p:"¿Cuál es el rango del primer octeto de la clase C?",o:["A) 192 – 223","B) 128 – 191","C) 1 – 126","D) 224 – 239","E) 240 – 255"],r:0,a:"Máscara por defecto: 255.255.255.0."},
{n:822,p:"¿Para qué se usa la clase D (224.0.0.0 – 239.255.255.255)?",o:["A) Hosts individuales","B) Paquetes multicast","C) Redes pequeñas","D) Direcciones privadas","E) Loopback"],r:1,a:"IGMP Router Discovery es un ejemplo de protocolo que usa multicast."},
{n:823,p:"¿Cuál es el rango de la clase E?",o:["A) 224.0.0.0 al 239.255.255.255","B) 192.0.0.0 al 223.255.255.255","C) 240.0.0.0 al 255.255.255.255, reservado para futuros usos","D) 128.0.0.0 al 191.255.255.255","E) 0.0.0.0 al 127.255.255.255"],r:2,a:"Las clases D y E no se asignan a hosts individuales."},
{n:824,p:"¿Cuántos octetos identifican la red y cuántos el host en una clase A?",o:["A) 2 para red y 2 para host","B) 3 para red y 1 para host","C) 4 para red y 0 para host","D) 1 para red y 3 para host","E) 0 para red y 4 para host"],r:3,a:"Estructura N.H.H.H."},
{n:825,p:"¿Cuántos octetos identifican la red y cuántos el host en una clase B?",o:["A) 1 para red y 3 para host","B) 3 para red y 1 para host","C) 4 para red y 0 para host","D) 2 para red y 1 para host","E) 2 para red y 2 para host"],r:4,a:"Estructura N.N.H.H."},
{n:826,p:"¿Cuántos octetos identifican la red y cuántos el host en una clase C?",o:["A) 3 para red y 1 para host","B) 2 para red y 2 para host","C) 1 para red y 3 para host","D) 4 para red y 0 para host","E) 1 para red y 1 para host"],r:0,a:"Estructura N.N.N.H."},
{n:827,p:"¿Cuántos hosts por red admite una clase A?",o:["A) 65,534","B) 16,777,214","C) 254","D) 2,097,152","E) 126"],r:1,a:"2^24 − 2 = 16,777,214."},
{n:828,p:"¿Cuántos hosts por red admite una clase B?",o:["A) 16,777,214","B) 254","C) 65,534","D) 16,384","E) 126"],r:2,a:"2^16 − 2 = 65,534."},
{n:829,p:"¿Cuántos hosts por red admite una clase C?",o:["A) 65,534","B) 16,777,214","C) 2,097,152","D) 254","E) 126"],r:3,a:"2^8 − 2 = 254."},
{n:830,p:"¿Cuántas redes de clase A existen?",o:["A) 16,384","B) 2,097,152","C) 254","D) 65,534","E) 126"],r:4,a:"Cada una con 16,777,214 hosts."},
{n:831,p:"¿Cuántas redes de clase B existen?",o:["A) 16,384","B) 126","C) 2,097,152","D) 65,534","E) 254"],r:0,a:"Cada una con 65,534 hosts."},
{n:832,p:"¿Cuántas redes de clase C existen?",o:["A) 16,384","B) 2,097,152","C) 126","D) 254","E) 65,534"],r:1,a:"Cada una con 254 hosts."},
{n:833,p:"¿Para qué se reserva la dirección 127.0.0.1?",o:["A) Broadcast general","B) Multicast","C) Loopback: la máquina se refiere a sí misma","D) Dirección privada","E) Red por defecto"],r:2,a:"Se configura en cada máquina que usa IP."},
{n:834,p:"¿Cuáles son los rangos de IP privadas mencionados en el documento?",o:["A) 10.0.0.0, 172.0 a 172.15 y 192.0","B) 127.0.0.0, 169.254 y 192.168","C) 224.0.0.0, 240.0.0.0 y 255.0.0.0","D) 10.0.0.0, 172.16 a 172.31 y 192.168","E) 1.0.0.0, 100.0.0.0 y 200.0.0.0"],r:3,a:"Estos rangos no se asignan a nadie en Internet y se usan en redes internas."},
{n:835,p:"¿Por qué el ID de una red no puede ser 127?",o:["A) Porque es privado","B) Porque es de clase D","C) Porque es broadcast","D) Porque es multicast","E) Porque está reservado para funciones de loopback"],r:4,a:"Es una regla del direccionamiento."},
{n:836,p:"¿Qué significa que un ID de red o de host sea todo ceros?",o:["A) Se considera «en esta red nada más»","B) Es un broadcast","C) Es multicast","D) Es la dirección de loopback","E) Es una dirección privada"],r:0,a:"Por eso no puede asignarse a un host."},
{n:837,p:"¿Qué significa que un ID de red o de host sea todo unos (255)?",o:["A) Es la dirección de loopback","B) Se considera un broadcast","C) Es una dirección privada","D) Es la red por defecto","E) Es multicast"],r:1,a:"Por eso no puede asignarse a un host."},
{n:838,p:"¿Cuál es el rango de hosts válidos de una red clase B (w.x.y.z)?",o:["A) w.0.0.1 a w.255.255.254","B) w.x.y.1 a w.x.y.254","C) w.x.0.1 a w.x.255.254","D) w.x.0.0 a w.x.255.255","E) w.x.1.0 a w.x.254.255"],r:2,a:"En clase A: w.0.0.1 a w.255.255.254; en clase C: w.x.y.1 a w.x.y.254."},
{n:839,p:"¿Qué recomendación se da para asignar las direcciones a los routers?",o:["A) Asignarles las últimas direcciones","B) Asignarles direcciones aleatorias","C) Asignarles la dirección de broadcast","D) Asignarles las primeras direcciones IP del segmento","E) Asignarles la dirección de red"],r:3,a:"Y asignar a los hosts sus ID de acuerdo al segmento."},
{n:840,p:"¿Qué es una máscara de red?",o:["A) Una dirección MAC","B) Un puerto reservado","C) Un tipo de protocolo","D) Un cable especial","E) Una dirección de 32 bits que indica qué bits son de red y cuáles de host"],r:4,a:"También sirve para saber si un host destino es local o remoto."},
{n:841,p:"¿Qué operación lógica usa TCP/IP entre la IP y la máscara para obtener el Network ID?",o:["A) AND","B) OR","C) XOR","D) NOT","E) NAND"],r:0,a:"Se realiza un AND bit a bit entre la dirección y la máscara."},
{n:842,p:"¿Cuál es el resultado de 1 AND 0?",o:["A) 1","B) 0","C) 2","D) 10","E) No definido"],r:1,a:"Solo 1 AND 1 da 1."},
{n:843,p:"¿Cuál es la máscara por defecto de una red clase A?",o:["A) 255.255.0.0","B) 255.255.255.0","C) 255.0.0.0","D) 255.255.255.255","E) 0.0.0.0"],r:2,a:"Clase B: 255.255.0.0; clase C: 255.255.255.0."},
{n:844,p:"¿Qué es una subred (subnet)?",o:["A) Una red independiente con su propio protocolo","B) Un tipo de cable","C) Una dirección de broadcast","D) Un segmento físico que usa direcciones IP derivadas de un solo network ID","E) Un conjunto de varios network ID de clase C"],r:3,a:"El Subnet ID se crea dividiendo los bits del host en dos partes."},
{n:845,p:"¿Cuál es una ventaja del subneteo?",o:["A) Aumentar el número de hosts por segmento","B) Eliminar la máscara de red","C) Evitar el uso de routers","D) Reemplazar el DNS","E) Reducir la congestión de la red y los broadcast"],r:4,a:"También permite mezclar tecnologías (Ethernet y Token Ring) y administrar mejor las direcciones IP."},
{n:846,p:"¿En qué RFC está definido el subnetting?",o:["A) RFC 950","B) RFC 791","C) RFC 793","D) RFC 1117","E) RFC 792"],r:0,a:"El subnetting está definido en el RFC 950."},
{n:847,p:"¿Qué se debe determinar antes de crear un esquema de subredes?",o:["A) El tipo de cable y la marca de routers","B) El número de segmentos físicos y de hosts por segmento, considerando el crecimiento","C) El número de usuarios del SO","D) El precio de las direcciones IP","E) El puerto de cada aplicación"],r:1,a:"Con base en eso se define una máscara, un ID único por segmento y un rango de hosts."},
{n:848,p:"Si se requieren 6 segmentos, ¿cuántos bits hay que tomar prestados del host ID?",o:["A) 2 bits","B) 4 bits","C) 3 bits","D) 6 bits","E) 8 bits"],r:2,a:"2^3 − 2 = 6."},
{n:849,p:"En un subneteo, ¿por qué se restan 2 combinaciones?",o:["A) Porque están reservadas para IPv6","B) Porque son direcciones privadas","C) Porque se usan para ARP","D) Porque todos ceros y todos unos no son válidos","E) Porque pertenecen a la clase D"],r:3,a:"Según el método del documento."},
{n:850,p:"¿Qué es el supernetting?",o:["A) Dividir una red grande en subredes","B) Cambiar la clase de una red","C) Convertir IPv4 a IPv6","D) Agregar bits de host","E) Lo contrario del subnetting: agrupar varias redes clase C con una máscara que las haga ver como una sola red"],r:4,a:"Reduce las entradas de las tablas de ruteo."},
{n:851,p:"Siete redes clase C de 220.78.168.0 a 220.78.174.0 se agrupan con la máscara:",o:["A) 255.255.248.0","B) 255.255.255.0","C) 255.255.252.0","D) 255.255.240.0","E) 255.255.224.0"],r:0,a:"Se toman 3 bits del tercer octeto: 11111000 = 248."},
{n:852,p:"¿Qué es CIDR?",o:["A) Control de Información de Dominios y Redes","B) Enrutamiento Inter-Dominio sin Clases (Classless Inter-Domain Routing)","C) Clasificación de IP por Dominios Reservados","D) Cifrado de Datos Inter-Redes","E) Conexión Directa de Redes"],r:1,a:"Se desarrolló para romper las limitaciones de las clases de red."},
{n:853,p:"¿Cómo se representa una máscara de 20 bits activados en notación CIDR?",o:["A) /12","B) /24","C) /20","D) /16","E) /8"],r:2,a:"Se escribe, por ejemplo, 10.217.123.7/20."},
{n:854,p:"¿Cómo también se conoce a la notación CIDR?",o:["A) Subnet mask notation","B) Dotted notation","C) Classful notation","D) Network prefix notation","E) Binary notation"],r:3,a:"Se representa como /x."},
{n:855,p:"¿Qué ocurre al configurar direcciones IP en Windows 2000?",o:["A) Se escribe en notación CIDR","B) Se escribe en binario","C) No se necesita máscara","D) Se escribe en hexadecimal","E) Hay que escribir la máscara en notación decimal; no acepta notación CIDR"],r:4,a:"El documento indica que Windows 2000 no acepta notación CIDR."},
{n:856,p:"¿De cuántos bits es una dirección IPv6, según el documento?",o:["A) 128 bits","B) 32 bits","C) 64 bits","D) 48 bits","E) 256 bits"],r:0,a:"Es cuatro veces más grande que IPv4."},
{n:857,p:"¿Cuál es el máximo de máquinas por segmento Ethernet que menciona el documento por las colisiones?",o:["A) 254","B) 1024","C) 65,534","D) 512","E) 4096"],r:1,a:"Por eso las redes enormes se dividen en subredes más pequeñas."},
{n:858,p:"¿Cómo se calcula el número de hosts disponibles con una máscara?",o:["A) 2 elevado al número de unos de la máscara","B) El número de ceros por 2","C) 2 elevado al número de ceros de la máscara, menos 2","D) 2 elevado al número de bits de red, menos 2","E) El número de unos menos 2"],r:2,a:"Se restan 2: todos ceros y todos unos."},
{n:859,p:"¿A qué número decimal equivale el octeto 10001011?",o:["A) 138","B) 137","C) 143","D) 139","E) 131"],r:3,a:"Se suman los valores de los bits en 1 (128, 64, 32, 16, 8, 4, 2, 1): 10001011 = 139."},
{n:860,p:"¿A qué número decimal equivale el octeto 10101010?",o:["A) 171","B) 168","C) 174","D) 162","E) 170"],r:4,a:"Se suman los valores de los bits en 1 (128, 64, 32, 16, 8, 4, 2, 1): 10101010 = 170."},
{n:861,p:"¿A qué número decimal equivale el octeto 10111111?",o:["A) 191","B) 190","C) 189","D) 187","E) 183"],r:0,a:"Se suman los valores de los bits en 1 (128, 64, 32, 16, 8, 4, 2, 1): 10111111 = 191."},
{n:862,p:"¿A qué número decimal equivale el octeto 11100000?",o:["A) 225","B) 224","C) 226","D) 228","E) 232"],r:1,a:"Se suman los valores de los bits en 1 (128, 64, 32, 16, 8, 4, 2, 1): 11100000 = 224."},
{n:863,p:"¿A qué número decimal equivale el octeto 00000111?",o:["A) 6","B) 5","C) 7","D) 3","E) 15"],r:2,a:"Se suman los valores de los bits en 1 (128, 64, 32, 16, 8, 4, 2, 1): 00000111 = 7."},
{n:864,p:"¿A qué número decimal equivale el octeto 10000001?",o:["A) 128","B) 131","C) 133","D) 129","E) 137"],r:3,a:"Se suman los valores de los bits en 1 (128, 64, 32, 16, 8, 4, 2, 1): 10000001 = 129."},
{n:865,p:"¿A qué número decimal equivale el octeto 01111111?",o:["A) 126","B) 125","C) 123","D) 119","E) 127"],r:4,a:"Se suman los valores de los bits en 1 (128, 64, 32, 16, 8, 4, 2, 1): 01111111 = 127."},
{n:866,p:"¿A qué número decimal equivale el octeto 11000000?",o:["A) 192","B) 193","C) 194","D) 196","E) 200"],r:0,a:"Se suman los valores de los bits en 1 (128, 64, 32, 16, 8, 4, 2, 1): 11000000 = 192."},
{n:867,p:"¿A qué número decimal equivale el octeto 11111110?",o:["A) 255","B) 254","C) 252","D) 250","E) 246"],r:1,a:"Se suman los valores de los bits en 1 (128, 64, 32, 16, 8, 4, 2, 1): 11111110 = 254."},
{n:868,p:"¿A qué número decimal equivale el octeto 00110011?",o:["A) 50","B) 49","C) 51","D) 55","E) 59"],r:2,a:"Se suman los valores de los bits en 1 (128, 64, 32, 16, 8, 4, 2, 1): 00110011 = 51."},
{n:869,p:"¿Cuál es la representación binaria de 8 bits del número decimal 250?",o:["A) 11111011","B) 11111000","C) 11111110","D) 11111010","E) 11110010"],r:3,a:"250 se descompone en potencias de 2 y se escribe como 11111010."},
{n:870,p:"¿Cuál es la representación binaria de 8 bits del número decimal 19?",o:["A) 00010010","B) 00010001","C) 00010111","D) 00011011","E) 00010011"],r:4,a:"19 se descompone en potencias de 2 y se escribe como 00010011."},
{n:871,p:"¿Cuál es la representación binaria de 8 bits del número decimal 109?",o:["A) 01101101","B) 01101100","C) 01101111","D) 01101001","E) 01100101"],r:0,a:"109 se descompone en potencias de 2 y se escribe como 01101101."},
{n:872,p:"¿Cuál es la representación binaria de 8 bits del número decimal 254?",o:["A) 11111111","B) 11111110","C) 11111100","D) 11111010","E) 11110110"],r:1,a:"254 se descompone en potencias de 2 y se escribe como 11111110."},
{n:873,p:"¿Cuál es la representación binaria de 8 bits del número decimal 131?",o:["A) 10000010","B) 10000001","C) 10000011","D) 10000111","E) 10001011"],r:2,a:"131 se descompone en potencias de 2 y se escribe como 10000011."},
{n:874,p:"¿Cuál es la representación binaria de 8 bits del número decimal 107?",o:["A) 01101010","B) 01101001","C) 01101111","D) 01101011","E) 01100011"],r:3,a:"107 se descompone en potencias de 2 y se escribe como 01101011."},
{n:875,p:"¿Cuál es la representación binaria de 8 bits del número decimal 2?",o:["A) 00000011","B) 00000000","C) 00000110","D) 00001010","E) 00000010"],r:4,a:"2 se descompone en potencias de 2 y se escribe como 00000010."},
{n:876,p:"¿Cuál es la representación binaria de 8 bits del número decimal 89?",o:["A) 01011001","B) 01011000","C) 01011011","D) 01011101","E) 01010001"],r:0,a:"89 se descompone en potencias de 2 y se escribe como 01011001."},
{n:877,p:"¿Cuál es la representación binaria de 8 bits del número decimal 172?",o:["A) 10101101","B) 10101100","C) 10101110","D) 10101000","E) 10100100"],r:1,a:"172 se descompone en potencias de 2 y se escribe como 10101100."},
{n:878,p:"¿Cuál es la representación binaria de 8 bits del número decimal 200?",o:["A) 11001001","B) 11001010","C) 11001000","D) 11001100","E) 11000000"],r:2,a:"200 se descompone en potencias de 2 y se escribe como 11001000."},
{n:879,p:"¿Cuál es la notación decimal de la dirección 10000011.01101011.00000011.00011000?",o:["A) 131.107.3.25","B) 131.106.3.24","C) 130.107.3.24","D) 131.107.3.24","E) 131.107.2.24"],r:3,a:"10000011=131, 01101011=107, 00000011=3, 00011000=24."},
{n:880,p:"¿Cuál es la notación binaria de la IP 131.107.2.89?",o:["A) 10000011.01101011.00000011.01011001","B) 10000011.01101011.00000010.01011101","C) 10000001.01101011.00000010.01011001","D) 10000011.01101001.00000010.01011001","E) 10000011.01101011.00000010.01011001"],r:4,a:"131=10000011, 107=01101011, 2=00000010, 89=01011001."},
{n:881,p:"¿Cuál es la IP decimal de 10111111.11100000.00000111.10000001?",o:["A) 191.224.7.129","B) 191.224.7.128","C) 191.192.7.129","D) 190.224.7.129","E) 191.224.6.129"],r:0,a:"10111111=191, 11100000=224, 00000111=7, 10000001=129."},
{n:882,p:"¿Cuál es la IP decimal de 01111111.00000000.00000000.00000001?",o:["A) 127.0.0.0","B) 127.0.0.1","C) 126.0.0.1","D) 127.0.0.2","E) 128.0.0.1"],r:1,a:"Es la dirección de loopback."},
{n:883,p:"¿A qué clase de red pertenece la dirección 131.107.2.1?",o:["A) Clase A","B) Clase C","C) Clase B","D) Clase D","E) Clase E"],r:2,a:"El primer octeto es 131, que está en el rango 128–191: Clase B."},
{n:884,p:"¿A qué clase de red pertenece la dirección 199.32.123.54?",o:["A) Clase A","B) Clase B","C) Clase D","D) Clase C","E) Clase E"],r:3,a:"El primer octeto es 199, que está en el rango 192–223: Clase C."},
{n:885,p:"¿A qué clase de red pertenece la dirección 32.12.54.23?",o:["A) Clase B","B) Clase C","C) Clase D","D) Clase E","E) Clase A"],r:4,a:"El primer octeto es 32, que está en el rango 1–126: Clase A."},
{n:886,p:"¿A qué clase de red pertenece la dirección 1.1.1.1?",o:["A) Clase A","B) Clase B","C) Clase C","D) Clase D","E) Clase E"],r:0,a:"El primer octeto es 1, que está en el rango 1–126: Clase A."},
{n:887,p:"¿A qué clase de red pertenece la dirección 221.22.64.7?",o:["A) Clase A","B) Clase C","C) Clase B","D) Clase D","E) Clase E"],r:1,a:"El primer octeto es 221, que está en el rango 192–223: Clase C."},
{n:888,p:"¿A qué clase de red pertenece la dirección 93.44.127.235?",o:["A) Clase B","B) Clase C","C) Clase A","D) Clase D","E) Clase E"],r:2,a:"El primer octeto es 93, que está en el rango 1–126: Clase A."},
{n:889,p:"¿A qué clase de red pertenece la dirección 152.79.234.12?",o:["A) Clase A","B) Clase C","C) Clase D","D) Clase B","E) Clase E"],r:3,a:"El primer octeto es 152, que está en el rango 128–191: Clase B."},
{n:890,p:"¿A qué clase de red pertenece la dirección 192.168.2.200?",o:["A) Clase A","B) Clase B","C) Clase D","D) Clase E","E) Clase C"],r:4,a:"El primer octeto es 192, que está en el rango 192–223: Clase C."},
{n:891,p:"¿A qué clase de red pertenece la dirección 168.192.3.26?",o:["A) Clase B","B) Clase A","C) Clase C","D) Clase D","E) Clase E"],r:0,a:"El primer octeto es 168, que está en el rango 128–191: Clase B."},

let idxActual = 0;
let puntaje = 0;
let racha = 0;
let bloqueado = false;
let iniciado = false;
let mejorRacha = 0;
let errores = [];
let historial = [];
let inicioTiempo = 0;
const txtProgreso = document.getElementById("txt-progreso");
const txtPuntaje = document.getElementById("txt-puntaje");
const txtRacha = document.getElementById("txt-racha");
const preguntaTexto = document.getElementById("pregunta-texto");
const listaOpciones = document.getElementById("lista-opciones");
const feedbackTexto = document.getElementById("feedback-texto");
const contenedorAnalisis = document.getElementById("contenedor-analisis");
const alertaRespuestaCorrecta = document.getElementById("alerta-respuesta-correcta");
const analisisTexto = document.getElementById("analisis-texto");
const btnSiguiente = document.getElementById("btn-siguiente");
const btnIniciar = document.getElementById("btn-iniciar");
const selectorModo = document.getElementById("selector-modo");
const panelExamen = document.getElementById("panel-examen");
const tituloPrincipal = document.getElementById("titulo-principal");
const modoActualTexto = document.getElementById("modo-actual");
const btnCambiarModo = document.getElementById("btn-cambiar-modo");
const barraProgreso = document.getElementById("barra-progreso");

function mezclar(array) {
  const copia = [...array];
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}

function actualizarBarra(hechas, total) { barraProgreso.style.width = total ? `${Math.round((hechas / total) * 100)}%` : "0%"; }

function obtenerSignificado(item) { return item.a || "Significado no disponible en el banco."; }

function prepararOpciones(item) {
  const opciones = item.o.map((texto, indiceOriginal) => ({ texto: texto.replace(/^[A-E]\)\s*/i, ""), indiceOriginal }));
  const mezcladas = mezclar(opciones);
  item._opciones = mezcladas.map((x, i) => ({ etiqueta: String.fromCharCode(65 + i), texto: x.texto, indiceOriginal: x.indiceOriginal }));
  item._respuesta = item._opciones.findIndex(x => x.indiceOriginal === item.r);
}

function cargarPregunta() {
  if (!iniciado) return;
  if (idxActual >= preguntas.length) { mostrarResultado(); return; }
  bloqueado = false;
  const item = preguntas[idxActual];
  prepararOpciones(item);
  feedbackTexto.className = "feedback";
  feedbackTexto.innerHTML = "";
  alertaRespuestaCorrecta.style.display = "none";
  contenedorAnalisis.style.display = "none";
  btnSiguiente.style.display = "none";
  listaOpciones.innerHTML = "";
  txtProgreso.textContent = `Pregunta: ${idxActual + 1}/${preguntas.length}`;
  actualizarBarra(idxActual, preguntas.length);
  preguntaTexto.textContent = item.p;
  item._opciones.forEach((opcion, index) => {
    const boton = document.createElement("button");
    boton.className = "option-btn";
    boton.innerHTML = `<strong>${opcion.etiqueta})</strong> ${opcion.texto}`;
    boton.onclick = () => verificarRespuesta(index, boton);
    listaOpciones.appendChild(boton);
  });
}

function mostrarResultado() {
  const total = preguntas.length;
  const buenas = Math.round(puntaje / 10);
  const malas = total - buenas;
  const pb = Math.round((buenas / total) * 100);
  const pm = 100 - pb;
  const nota = (buenas / total * 20).toFixed(1);
  const seg = Math.round((Date.now() - inicioTiempo) / 1000);
  const tiempo = `${Math.floor(seg / 60)}:${String(seg % 60).padStart(2, "0")}`;
  const nivel = pb >= 90 ? ["🏆 ¡Excelente!", "#3ddc97"] : pb >= 75 ? ["👏 Muy bien", "#7bdc5f"] : pb >= 60 ? ["👍 Aprobado, sigue practicando", "#ffb454"] : ["📚 A repasar", "#ff5c7a"];
  const RADIO = 54, CIRC = 2 * Math.PI * RADIO;
  const arcoBien = (buenas / total) * CIRC, arcoMal = (malas / total) * CIRC;
  const lineaAciertos = historial.map((ok, i) => `<div class="res-punto ${ok ? "ok" : "ko"}" title="Pregunta ${i + 1}">${i + 1}</div>`).join("");
  const nombre = MODOS[modoActual].nombre;
  txtProgreso.textContent = `🏁 Ronda terminada: ${total}/${total}`;
  actualizarBarra(total, total);
  preguntaTexto.innerHTML = `🎉 ¡Terminaste el examen de ${nombre}!`;
  listaOpciones.innerHTML = "";
  feedbackTexto.className = "feedback";
  const listaErrores = errores.length
    ? `<div class="res-errores"><div class="res-errores-titulo">❌ Para repasar (${errores.length})</div>${errores.map(e => `<div class="res-error-item"><div class="res-error-p">${e.p}</div><div class="res-error-l"><span class="mal">Tu respuesta:</span> ${e.elegida}</div><div class="res-error-l"><span class="bien">Correcta:</span> ${e.correcta}</div></div>`).join("")}</div>`
    : `<div class="res-perfecto">🌟 ¡Sin errores en esta ronda!</div>`;
  feedbackTexto.innerHTML = `
    <div class="resultado-final">
      <div class="res-titulo">📊 Resultado final</div>
      <div class="res-donut">
        <svg viewBox="0 0 140 140" role="img" aria-label="${buenas} buenas y ${malas} malas">
          <circle class="donut-fondo" cx="70" cy="70" r="${RADIO}"></circle>
          <circle class="donut-mal" cx="70" cy="70" r="${RADIO}" stroke-dasharray="${arcoMal} ${CIRC}" stroke-dashoffset="${-arcoBien}"></circle>
          <circle class="donut-bien" cx="70" cy="70" r="${RADIO}" stroke="${nivel[1]}" stroke-dasharray="${Math.max(arcoBien - (buenas && malas ? 4 : 0), 0)} ${CIRC}"></circle>
        </svg>
        <div class="res-donut-centro">
          <div class="res-nota" style="color:${nivel[1]}">${nota}<small>/20</small></div>
          <div class="res-pct">${pb}% de aciertos</div>
        </div>
      </div>
      <div class="res-nivel" style="color:${nivel[1]}">${nivel[0]}</div>
      <div class="res-sub">Respuestas pregunta por pregunta</div>
      <div class="res-linea">${lineaAciertos}</div>
      <div class="res-grid">
        <div class="res-card bien-card"><b>${buenas}</b><span>✅ Buenas · ${pb}%</span></div>
        <div class="res-card mal-card"><b>${malas}</b><span>❌ Malas · ${pm}%</span></div>
        <div class="res-card"><b>${puntaje}</b><span>🎯 Puntos</span></div>
        <div class="res-card"><b>${mejorRacha}</b><span>🔥 Mejor racha</span></div>
        <div class="res-card"><b>${tiempo}</b><span>⏱️ Tiempo</span></div>
        <div class="res-card"><b>${total}</b><span>📝 Preguntas</span></div>
      </div>
      ${listaErrores}
    </div>`;
  contenedorAnalisis.style.display = "none";
  btnSiguiente.style.display = "block";
  btnSiguiente.textContent = `🔄 Nuevo examen de ${nombre}`;
  btnSiguiente.onclick = iniciarTest;
}
function verificarRespuesta(indiceSeleccionado, botonPresionado) {
  if (bloqueado) return;
  bloqueado = true;
  const item = preguntas[idxActual];
  const botones = Array.from(listaOpciones.getElementsByClassName("option-btn"));
  botones.forEach(b => b.disabled = true);
  const esCorrecta = indiceSeleccionado === item._respuesta;
  if (esCorrecta) {
    botonPresionado.classList.add("correct");
    feedbackTexto.innerHTML = "✨ ¡Correcto!";
    feedbackTexto.className = "feedback success";
    puntaje += 10;
    racha += 1;
    mejorRacha = Math.max(mejorRacha, racha);
    historial.push(true);
    alertaRespuestaCorrecta.style.display = "none";
  } else {
    botonPresionado.classList.add("incorrect");
    botones[item._respuesta].classList.add("correct");
    feedbackTexto.innerHTML = "❌ Respuesta incorrecta.";
    feedbackTexto.className = "feedback error";
    racha = 0;
    historial.push(false);
    errores.push({ p: item.p, elegida: item._opciones[indiceSeleccionado].texto, correcta: item._opciones[item._respuesta].texto });
    alertaRespuestaCorrecta.style.display = "inline-block";
    alertaRespuestaCorrecta.innerHTML = `Respuesta correcta: <strong>${item._opciones[item._respuesta].etiqueta}) ${item._opciones[item._respuesta].texto}</strong>`;
  }
  txtPuntaje.textContent = `✨ Puntos: ${puntaje}`;
  txtRacha.textContent = `🔥 Racha: ${racha}`;
  const significadoRespuesta = obtenerSignificado(item);
  const esSinonimo = modoActual === 'sinonimos';
  const conceptoPregunta = esSinonimo
    ? (item.c || `La palabra ${item.p} expresa el concepto relacionado con su sinónimo correcto.`)
    : "";
  analisisTexto.innerHTML = esSinonimo
    ? `<div><strong>🧠 Sinónimo (${item.p}):</strong> ${conceptoPregunta}</div><div style="margin-top:8px"><strong>📖 Respuesta:</strong> ${significadoRespuesta}</div>`
    : `<div><strong>📖 Respuesta:</strong> ${significadoRespuesta}</div>`;
  contenedorAnalisis.style.display = "block";
  btnSiguiente.style.display = "block";
  btnSiguiente.textContent = idxActual === preguntas.length - 1 ? "📊 Ver resultado" : "➡️ Siguiente pregunta";
  btnSiguiente.onclick = avanzarPregunta;
}

function avanzarPregunta() {
  if (!bloqueado) return;
  idxActual++;
  cargarPregunta();
}

function seleccionarModo(modo) {
  modoActual = modo;
  bancoActual = MODOS[modo].banco;
  preguntasRestantes = mezclar([...bancoActual]);
  selectorModo.style.display = "none";
  panelExamen.style.display = "block";
  tituloPrincipal.textContent = MODOS[modo].titulo;
  modoActualTexto.textContent = MODOS[modo].etiqueta;
  const cantidad = Math.min(20, bancoActual.length);
  btnIniciar.textContent = `▶️ Iniciar ${cantidad} preguntas de ${MODOS[modo].nombre}`;
  txtProgreso.textContent = `Pregunta: 0/${cantidad}`;
  preguntaTexto.textContent = `Presiona «Iniciar» para comenzar el examen de ${MODOS[modo].nombre}.`;
  listaOpciones.innerHTML = "";
  feedbackTexto.innerHTML = "";
  contenedorAnalisis.style.display = "none";
  btnSiguiente.style.display = "none";
  btnIniciar.style.display = "block";
  iniciado = false;
  historial = [];
  actualizarBarra(0, 1);
}

function cambiarModo() {
  iniciado = false;
  modoActual = null;
  bancoActual = [];
  preguntas = [];
  preguntasRestantes = [];
  selectorModo.style.display = "block";
  panelExamen.style.display = "none";
  tituloPrincipal.textContent = "📚 Banco de Preguntas";
}

function iniciarTest() {
  if (!modoActual || bancoActual.length === 0) return;
  const cantidadRonda = Math.min(20, bancoActual.length);
  if (preguntasRestantes.length < cantidadRonda) {
    const ya = new Set(preguntasRestantes.map(p => p.n));
    preguntasRestantes = [...preguntasRestantes, ...mezclar(bancoActual.filter(p => !ya.has(p.n)))];
  }
  preguntas = mezclar([...preguntasRestantes]).slice(0, cantidadRonda);
  const usadas = new Set(preguntas.map(p => p.n));
  preguntasRestantes = preguntasRestantes.filter(p => !usadas.has(p.n));

  idxActual = 0; puntaje = 0; racha = 0; mejorRacha = 0; errores = []; historial = []; inicioTiempo = Date.now(); bloqueado = false; iniciado = true;
  btnIniciar.style.display = "none";
  txtPuntaje.textContent = "✨ Puntos: 0";
  txtRacha.textContent = "🔥 Racha: 0";
  btnSiguiente.style.display = "none";
  actualizarBarra(0, cantidadRonda);
  cargarPregunta();
}
</script>
</body>
</html>
