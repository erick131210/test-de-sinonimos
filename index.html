{"n": 276, "p": "NESCIENTE", "o": ["A) remoto", "B) actual", "C) filial", "D) yerto", "E) ignorante"], "r": 4, "a": "Ignorante. Que carece de conocimiento, instrucción o que ignora una materia o asunto específico.", "c": "Que no sabe o ignora lo que debería saber."},

{"n": 278, "p": "PÚTRIDO", "o": ["A) fétido", "B) descompuesto", "C) inmundo", "D) hediondo", "E) putrefacto"], "r": 4, "a": "Putrefacto. Que está podrido o se encuentra en un estado completo de descomposición orgánica.", "c": "Podrido; en descomposición."},
{"n": 279, "p": "INTRINSIQUEZA", "o": ["A) malignidad", "B) familiaridad", "C) sumisión", "D) absolución", "E) oscuridad"], "r": 1, "a": "Familiaridad. Íntima amistad, confianza estrecha o trato afectuoso propio de los amigos íntimos.", "c": "Intimidad o trato muy estrecho entre amigos."},

{"n": 282, "p": "ORONDO", "o": ["A) engolado", "B) terne", "C) nimio", "D) fútil", "E) inútil"], "r": 0, "a": "Engolado. Persona engreída, presuntuosa, altanera o llena de vanidad que actúa con superioridad.", "c": "Hinchado y presumido; lleno de vanidad."},

{"n": 285, "p": "FEÉRICO", "o": ["A) encantador", "B) límpido", "C) gemebundo", "D) rígido", "E) alevoso"], "r": 0, "a": "Encantador. Perteneciente o relativo a las hadas o a la magia; maravilloso o de una belleza fascinante.", "c": "Relativo a las hadas o a lo mágico y encantador."},

{"n": 287, "p": "DESIDIOSO", "o": ["A) taciturno", "B) vesánico", "C) portentoso", "D) disidente", "E) incurioso"], "r": 4, "a": "Incurioso. Que carece de curiosidad, cuidado o interés; negligente, apático o dejado frente a sus deberes.", "c": "Que se descuida y no pone atención ni interés."},
{"n": 288, "p": "ABSTRUSO", "o": ["A) diáfano", "B) compuesto", "C) intrincado", "D) embarazoso", "E) rotundo"], "r": 2, "a": "Intrincado. Que es de difícil comprensión por ser muy complejo, enredado, complicado o confuso.", "c": "Difícil de entender; oscuro o complejo."},
{"n": 289, "p": "ZAFIO", "o": ["A) esbelto", "B) sandio", "C) ineducado", "D) sagaz", "E) probable"], "r": 2, "a": "Ineducado. Persona grosera, tosca, ruda o que muestra una total falta de buenos modales y cortesía.", "c": "Persona grosera, tosca y sin modales."},
{"n": 290, "p": "ANODINO", "o": ["A) inicuo", "B) ineficaz", "C) precoz", "D) propincuo", "E) inocuo"], "r": 1, "a": "Ineficaz. Que es insignificante, insustancial o que no tiene la capacidad para alcanzar el efecto deseado.", "c": "Insignificante, sin sustancia ni efecto."},
{"n": 291, "p": "POSE", "o": ["A) modo", "B) método", "C) actitud", "D) silueta", "E) afectación"], "r": 4, "a": "Afectación. Falta de naturalidad; postura o manera artificial de comportarse para aparentar algo que no se es.", "c": "Postura que se adopta; actitud afectada o artificial."},
{"n": 292, "p": "SAGAZ", "o": ["A) audaz", "B) mendaz", "C) perspicaz", "D) mordaz", "E) rapaz"], "r": 2, "a": "Perspicaz. Que tiene una inteligencia rápida y aguda que le permite percatarse de cosas de forma rápida.", "c": "Que se da cuenta de las cosas con rapidez y agudeza."},
{"n": 293, "p": "TUPIDO", "o": ["A) tejido", "B) indispuesto", "C) lleno", "D) obstruido", "E) detenido"], "r": 3, "a": "Obstruido. Que tiene un conducto, paso o abertura cerrado, tapado o bloqueado por un obstáculo.", "c": "Muy apretado o espeso; que no deja pasar nada."},

{"n": 295, "p": "INSINUANTE", "o": ["A) artero", "B) persuasivo", "C) codicioso", "D) melodioso", "E) ruidoso"], "r": 1, "a": "Persuasivo. Que tiene la fuerza, eficacia o habilidad sutil para convencer o inducir a alguien a creer o hacer algo.", "c": "Que con sutileza da a entender algo sin decirlo claramente."},
{"n": 296, "p": "QUEBRAJA", "o": ["A) modestia", "B) anuencia", "C) suspenso", "D) fealdad", "E) rendija"], "r": 4, "a": "Rendija. Grieta, abertura o hendidura larga y estrecha que se produce en un cuerpo sólido.", "c": "Abertura o hendidura estrecha en un cuerpo sólido."},
{"n": 297, "p": "DISCRIMEN", "o": ["A) inocencia", "B) peligro", "C) humildad", "D) vanidad", "E) barbaridad"], "r": 1, "a": "Peligro. Situación crítica, límite o riesgo inminente en la que existe la posibilidad de que suceda un mal.", "c": "Diferencia o separación; también, riesgo o peligro."},
{"n": 298, "p": "REMISO", "o": ["A) temido", "B) ardido", "C) necio", "D) acidioso", "E) venal"], "r": 3, "a": "Acidioso. Que muestra falta de voluntad, desgana, pereza, desidia o flojera para realizar las cosas (variante de acedioso).", "c": "Perezoso o reacio; que se muestra con poca voluntad."},
{"n": 299, "p": "EXIMIO", "o": ["A) exangüe", "B) exento", "C) excelente", "D) experto", "E) estulto"], "r": 2, "a": "Excelente. Muy ilustre, excelso, eminente o que sobresale por sus extraordinarias cualidades.", "c": "Muy ilustre y sobresaliente."},
{"n": 300, "p": "SUTILEZA", "o": ["A) amabilidad", "B) imperturbabilidad", "C) intrascendencia", "D) inalterabilidad", "E) ingeniosidad"], "r": 4, "a": "Ingeniosidad. Agudeza, perspicacia, finura o ingenio mental para discurrir o notar detalles difíciles.", "c": "Agudeza e ingenio para notar detalles sutiles."},
{"n": 301, "p": "VIÁTICO", "o": ["A) alcurnia", "B) provisión", "C) carril", "D) vianda", "E) permiso"], "r": 1, "a": "Provisión. Conjunto de provisiones, dinero o alimentos para el sustento durante un viaje.", "c": "Provisión o recursos necesarios para el sustento durante un viaje."},
{"n": 302, "p": "IDÓNEO", "o": ["A) doloso", "B) frustrante", "C) loable", "D) apto", "E) ausente"], "r": 3, "a": "Apto. Que reúne las condiciones necesarias o ideales para una función o fin.", "c": "Adecuado o apropiado para cumplir una función o alcanzar un fin."},

{"n": 304, "p": "REDIMIR", "o": ["A) oprimir", "B) liberar", "C) sublimar", "D) incentivar", "E) calma"], "r": 1, "a": "Liberar. Significa librar a alguien de una obligación, esclavitud o situación difícil.", "c": "Liberar a alguien de una obligación, culpa, esclavitud o situación penosa."},
{"n": 305, "p": "ARCANO", "o": ["A) hermético", "B) impropio", "C) latente", "D) problema", "E) enigma"], "r": 4, "a": "Enigma. Hace referencia a un secreto muy reservado o un misterio indescifrable.", "c": "Secreto, misterio o conocimiento difícil de comprender."},
{"n": 306, "p": "PERITO", "o": ["A) novato", "B) bisoño", "C) experto", "D) docto", "E) mañoso"], "r": 2, "a": "Experto. Persona sabia, experimentada o hábil en una ciencia, arte u oficio técnico.", "c": "Persona experta y especializada en una materia, ciencia, arte u oficio."},
{"n": 307, "p": "AUSPICIO", "o": ["A) ayuda", "B) apoyo", "C) socorro", "D) ofrecimiento", "E) subvención"], "r": 4, "a": "Subvención. Patrocinio, amparo o aporte económico oficial concedido para un fin.", "c": "Protección, apoyo o patrocinio que favorece una actividad o proyecto."},
{"n": 308, "p": "INEQUÍVOCO", "o": ["A) alterno", "B) indudable", "C) estupendo", "D) mentecato", "E) concebible"], "r": 1, "a": "Indudable. Que es completamente seguro y claro, sin admitir margen de duda.", "c": "Claro y preciso, sin posibilidad de interpretaciones distintas."},
{"n": 309, "p": "LACERIOSO", "o": ["A) atroz", "B) indulgente", "C) borrascoso", "D) cándido", "E) pobre"], "r": 4, "a": "Pobre. Término de nivel culto que define a quien vive en la indigencia o miseria.", "c": "Muy pobre, miserable o digno de compasión por su estado."},
{"n": 310, "p": "CEBO", "o": ["A) grasa", "B) carnada", "C) adulo", "D) conozco", "E) sobo"], "r": 1, "a": "Carnada. Alimento o sustancia que se utiliza en el anzuelo para atraer a las presas.", "c": "Alimento o señuelo utilizado para atraer a un animal o persona."},
{"n": 311, "p": "CARMESÍ", "o": ["A) nombre", "B) floripondio", "C) foros", "D) flor", "E) rojo"], "r": 4, "a": "Rojo. Color correspondiente a la gama o tonalidad del rojo intenso o grana.", "c": "Color rojo intenso semejante al de la grana o el carmín."},
{"n": 312, "p": "HECATOMBE", "o": ["A) carnicería", "B) catástrofe", "C) centena", "D) estruendo", "E) explosión"], "r": 0, "a": "Carnicería. En este balotario se prioriza la acepción clásica de gran matanza o mortandad masiva.", "c": "Gran matanza o catástrofe con numerosas víctimas o grandes pérdidas."},
{"n": 313, "p": "HELENO", "o": ["A) calvo", "B) pelón", "C) griego", "D) guerrero", "E) autor"], "r": 2, "a": "Griego. Gentilicio oficial perteneciente o relativo a la antigua o moderna Grecia.", "c": "Relativo a Grecia o, especialmente, a los antiguos griegos."},

{"n": 315, "p": "SEVERO", "o": ["A) dragar", "B) afirmativo", "C) inexorable", "D) claro", "E) evidente"], "r": 2, "a": "Inexorable. Que es riguroso, estricto o sumamente inflexible ante los ruegos.", "c": "Riguroso, estricto o duro en el trato, juicio o aplicación de normas."},
{"n": 316, "p": "TORCAZ", "o": ["A) torvo", "B) procaz", "C) indecente", "D) paloma", "E) anudado"], "r": 3, "a": "Paloma. Variedad o especie silvestre de ave caracterizada por manchas en el cuello.", "c": "Ave, especialmente una paloma silvestre de gran tamaño."},

{"n": 318, "p": "HINOJO", "o": ["A) rodilla", "B) cólera", "C) pena", "D) alegría", "E) serenidad"], "r": 0, "a": "Rodilla. Término literario derivado del latín geniculum (común en 'de hinojos').", "c": "Expresión que alude a las rodillas, especialmente en la locución «de hinojos»."},
{"n": 319, "p": "POTERNA", "o": ["A) cisterna", "B) puerta", "C) amparo", "D) utelaje", "E) poder"], "r": 1, "a": "Puerta. Abertura o puerta secreta menor construida en los muros de un castillo.", "c": "Puerta pequeña o secreta de una fortificación."},

{"n": 321, "p": "PROSAPIA", "o": ["A) versación", "B) actuación", "C) estirpe", "D) sabia", "E) asma"], "r": 2, "a": "Estirpe. Raíz, tronco, linaje o serie de antecesores familiares de un individuo.", "c": "Linaje, ascendencia o estirpe de una persona."},
{"n": 322, "p": "PROFICUO", "o": ["A) higiene", "B) largo", "C) útil", "D) lleno", "E) filantropía"], "r": 2, "a": "Útil. Adjetivo de nivel culto que significa ventajoso, provechoso o fructífero.", "c": "Útil, provechoso o beneficioso."},
{"n": 323, "p": "TUSAR", "o": ["A) trasquilar", "B) cruzar", "C) mezclar", "D) mestizar", "E) tutear"], "r": 0, "a": "Trasquilar. Cortar el pelo o crines de manera tosca, imperfecta o desigual.", "c": "Cortar o recortar el pelo, especialmente de animales."},
{"n": 324, "p": "CURATELA", "o": ["A) saneamiento", "B) limpieza", "C) cortadura", "D) amparo", "E) custodia"], "r": 4, "a": "Custodia. Institución jurídica destinada al cuidado, guardia y protección legal de bienes.", "c": "Institución o función de protección y cuidado jurídico de una persona o bienes."},

{"n": 327, "p": "CHALADO", "o": ["A) trillado", "B) talado", "C) sesgado", "D) enamorado", "E) desanimado"], "r": 3, "a": "Enamorado. Acepción coloquial que indica pasión intensa o locura de amor por alguien.", "c": "Loco, trastornado o muy enamorado, según el contexto coloquial."},
{"n": 328, "p": "TULLIDO", "o": ["A) paralítico", "B) macerado", "C) sosegado", "D) anegado", "E) ensuciado"], "r": 0, "a": "Paralítico. Persona lisiada que ha perdido la movilidad de sus miembros corporales.", "c": "Que tiene impedida o muy limitada la movilidad de alguna parte del cuerpo."},

const bancoMD = [
{n:301,p:"MD 1-0: ¿Cuál enunciado distingue mejor una capacidad fundamental de una capacidad operacional?",o:["A) La fundamental integra capacidades operacionales similares; la operacional reúne habilidades componentes de una fundamental.","B) La fundamental solo existe en el nivel táctico; la operacional solo en el estratégico.","C) La fundamental se limita a personal; la operacional exclusivamente a material.","D) Ambas expresiones son equivalentes y se usan indistintamente.","E) La operacional reemplaza a las funciones del Ejército."],r:0,a:"Las capacidades fundamentales agrupan capacidades operacionales similares y orientan el diseño de la estructura y magnitud de la fuerza; las operacionales son habilidades componentes de una fundamental."},
{n:302,p:"MD 1-0: Si una fuerza debe articular capacidades según su misión y amenaza específica dentro de una brigada de combate, ¿qué concepto de la visión institucional se está aplicando?",o:["A) Fuerza modular.","B) Fuerza únicamente territorial.","C) Acción cívica.","D) Cooperación internacional.","E) Control administrativo."],r:0,a:"Fuerza modular. La visión describe una fuerza modular capaz de articular diversas capacidades fundamentales según misión y amenaza específica."},
{n:303,p:"MD 1-0: Una actividad orientada a vigilar fronteras y producir información para garantizar la seguridad se relaciona directamente con qué acción estratégica?",o:["A) Investigación histórica del patrimonio.","B) Actividades de inteligencia y vigilancia de fronteras.","C) Cooperación cultural internacional.","D) Gestión presupuestal institucional.","E) Formación de colegios militares."],r:1,a:"El rol de garantizar la independencia, soberanía e integridad territorial incluye desarrollar actividades de inteligencia y operaciones de vigilancia de fronteras."},
{n:304,p:"MD 1-0: ¿Qué combinación corresponde a las seis capacidades fundamentales señaladas en el manual?",o:["A) Comando y control, inteligencia, movimiento y maniobra, fuegos, protección y sostenimiento.","B) Logística, personal, educación, sanidad, ingeniería y comunicaciones.","C) Ofensiva, defensiva, estabilidad, apoyo, reserva y movilización.","D) Planeamiento, presupuesto, doctrina, educación, salud y relaciones internacionales.","E) Ciberdefensa, telemática, aviación, ingeniería, artillería y caballería."],r:0,a:"Las seis capacidades fundamentales son comando y control, inteligencia, movimiento y maniobra, fuegos, protección y sostenimiento."},
{n:305,p:"MD 1-0: Si una actividad comprende colección, procesamiento, difusión, reconocimiento y vigilancia y contrainteligencia, ¿a qué capacidad operacional pertenece?",o:["A) Fuegos.","B) Protección.","C) Inteligencia.","D) Sostenimiento.","E) Movimiento y maniobra."],r:2,a:"Inteligencia. El manual enumera esas actividades dentro de la capacidad operacional de inteligencia."},
{n:306,p:"MD 1-0: ¿Cuál es la finalidad central de la misión institucional descrita en el capítulo 2?",o:["A) Contribuir a garantizar independencia, soberanía, integridad territorial y bienestar general de la población.","B) Concentrar todas las funciones estatales en el Ejército.","C) Sustituir permanentemente a las autoridades civiles.","D) Limitar la acción militar al ámbito internacional.","E) Priorizar exclusivamente el desarrollo económico."],r:0,a:"La misión busca contribuir a garantizar la independencia, soberanía, integridad territorial y bienestar general, además de participar en desarrollo, orden interno, defensa civil y política exterior conforme a ley."},
{n:307,p:"MD 1-0: ¿Cuál de los siguientes NO forma parte de la visión institucional?",o:["A) Disuasivo.","B) Reconocido.","C) Respetado.","D) Integrado a la sociedad.","E) Autosuficiente económicamente."],r:4,a:"La visión señala: ser un Ejército disuasivo, reconocido, respetado e integrado a la sociedad. La autosuficiencia económica no forma parte de esa formulación."},
{n:308,p:"MD 1-0: ¿Qué órgano realiza el planeamiento estratégico institucional y asesora al Comandante General?",o:["A) Inspectoría General del Ejército.","B) Estado Mayor General del Ejército.","C) Procuraduría Pública del Ejército.","D) Órgano de Control Institucional.","E) Consejo Consultivo del Ejército."],r:1,a:"El Estado Mayor General del Ejército es el órgano de planeamiento y asesoramiento del más alto nivel."},
{n:309,p:"MD 1-0: ¿Qué diferencia establece el manual entre interoperatividad e interoperabilidad?",o:["A) La interoperatividad se refiere a operar coordinadamente con otras fuerzas; la interoperabilidad a proporcionar o recibir servicios entre fuerzas o sistemas según la misión.","B) Son términos idénticos sin distinción conceptual.","C) La primera es administrativa y la segunda presupuestal.","D) La primera corresponde solo al ciberespacio y la segunda solo al dominio terrestre.","E) La primera es una capacidad fundamental y la segunda un rol estratégico."],r:0,a:"El glosario distingue la interoperatividad como capacidad de operar coordinada y simultáneamente con otras fuerzas, y la interoperabilidad como capacidad de proporcionar o recibir servicios entre fuerzas o sistemas."},
{n:310,p:"MD 1-0: Si dos o más Fuerzas Armadas emplean sus medios para cumplir una misión conjunta, ¿qué concepto corresponde?",o:["A) Operación integrada.","B) Operación conjunta.","C) Acción cívica.","D) Acción multisectorial.","E) Gestión del riesgo."],r:1,a:"Operación conjunta. El manual la describe como aquella que involucra el empleo de dos o más fuerzas: Ejército, Marina o Fuerza Aérea."},
{n:311,p:"MD 1-0: ¿Qué institución conduce políticamente el Sector Defensa?",o:["A) Comando Conjunto de las Fuerzas Armadas.","B) Ejército del Perú.","C) Ministerio de Defensa.","D) Estado Mayor General del Ejército.","E) Policía Nacional del Perú."],r:2,a:"El Ministerio de Defensa es el órgano rector y responsable de la conducción política del Sector Defensa."},
{n:312,p:"MD 1-0: ¿Cuál es la función del Comando Conjunto destacada en el capítulo 1?",o:["A) Conducir exclusivamente operaciones del Ejército.","B) Realizar el planeamiento, preparación, coordinación y conducción de operaciones militares conjuntas.","C) Administrar el presupuesto de cada instituto armado.","D) Ejercer la defensa jurídica de las Fuerzas Armadas.","E) Dirigir los colegios militares."],r:1,a:"El CCFFAA realiza el planeamiento, preparación, coordinación y conducción de las operaciones militares conjuntas."},
{n:313,p:"MD 1-0: ¿Cuál afirmación refleja mejor el concepto de ambiente operacional?",o:["A) Solo comprende el terreno físico donde opera una unidad.","B) Es la combinación de condiciones, circunstancias e influencias que afectan el empleo de capacidades y las decisiones del comandante.","C) Se limita a amenazas externas convencionales.","D) Es equivalente al área administrativa de una unidad.","E) Excluye las dimensiones aérea, marítima y ciberespacial."],r:1,a:"Ambiente operacional: combinación de condiciones, circunstancias e influencias que afectan el empleo de capacidades militares y las decisiones del comandante; comprende dimensiones terrestre, aérea, marítima, espacial y ciberespacial."},
{n:314,p:"MD 1-0: ¿Cuál es el propósito de los roles estratégicos asignados por el Estado al Ejército?",o:["A) Convertirlos en normas presupuestales.","B) Concretar propósitos estatales en misiones mediante planeamiento y empleo de capacidades militares.","C) Sustituir la Constitución y las leyes.","D) Limitar las capacidades al tiempo de paz.","E) Regular únicamente la carrera militar."],r:1,a:"Los roles estratégicos son propósitos que el Estado asigna al Ejército y se concretan en misiones mediante planeamiento y empleo de capacidades militares."},
{n:315,p:"MD 1-0: ¿Qué caracteriza a un Ejército multimisión?",o:["A) Una fuerza diseñada para una única misión permanente.","B) Una estructura moderna, modular y polivalente sustentada en planeamiento basado en capacidades.","C) Una fuerza sin especialidades.","D) Una organización exclusivamente administrativa.","E) Una fuerza limitada al combate convencional."],r:1,a:"Ejército multimisión: estructura moderna, modular y polivalente, sustentada en planeamiento basado en capacidades militares."},
{n:316,p:"MD 1-0: ¿Cuál NO corresponde a la ética militar descrita en el manual?",o:["A) Orientar las acciones mediante principios, valores y deberes.","B) Crear conciencia de responsabilidad asociada al ejercicio profesional.","C) Sustituir la preparación técnica y física del militar.","D) Formar parte transversal de la educación ética-moral.","E) Orientar la conducta de los integrantes de la institución."],r:2,a:"La ética militar orienta mediante principios, valores y deberes y crea conciencia de responsabilidad; no sustituye la preparación técnica y física."},
{n:317,p:"MD 1-0: ¿Cuál conjunto corresponde a los principios militares enumerados en la sección 3.6?",o:["A) Respeto por la Constitución y leyes; respeto por DDHH y DIH; honor militar; ética en el actuar; compromiso y fe institucional; perseverancia y abnegación.","B) Disciplina, logística, inteligencia, maniobra, fuegos y protección.","C) Lealtad, presupuesto, educación, salud, movilidad y ciberdefensa.","D) Honor, ofensiva, defensiva, estabilidad, reserva y sostenimiento.","E) Vocación, carrera, ascenso, sanción, presupuesto y mando."],r:0,a:"Es el conjunto de seis principios militares expresamente enumerados en la sección 3.6."},
{n:318,p:"MD 1-0: ¿Por qué el liderazgo se considera permanente y progresivo?",o:["A) Porque solo se desarrolla al alcanzar los grados superiores.","B) Porque la formación del líder militar continúa a lo largo de la carrera en dimensiones individual y organizacional.","C) Porque depende exclusivamente del mando formal.","D) Porque reemplaza la formación académica.","E) Porque solo se aplica durante operaciones."],r:1,a:"La formación del líder militar es permanente y progresiva a lo largo de la carrera, en dimensiones individual y organizacional."},
{n:319,p:"MD 1-0: ¿Qué órgano realiza funciones de control, supervisión e investigación de asuntos militares, operacionales y disciplinarios?",o:["A) Inspectoría General del Ejército.","B) Estado Mayor General del Ejército.","C) Comandancia General del Ejército.","D) Procuraduría Pública del Ejército.","E) Consejo Superior del Ejército."],r:0,a:"La Inspectoría General del Ejército realiza funciones de control, supervisión e investigación en el ámbito de su competencia."},
{n:320,p:"MD 1-0: ¿Cuál es la finalidad del desarrollo nacional según el glosario?",o:["A) Aumentar exclusivamente el poder militar.","B) Lograr la plena satisfacción de las necesidades de la población mediante crecimiento sostenido y sustentable del Poder Nacional.","C) Sustituir el sistema de defensa nacional.","D) Concentrar la economía en el sector Defensa.","E) Limitar la participación del Estado al ámbito regional."],r:1,a:"Desarrollo nacional: proceso de crecimiento sostenido y sustentable del Poder Nacional para alcanzar el bienestar general y satisfacer las necesidades de la población."},
{n:321,p:"MD 1-0: ¿Qué principio describe mejor la acción multisectorial?",o:["A) Integración, cooperación y sincronización de actividades de dos o más sectores bajo coordinación o regulación de una autoridad designada.","B) Empleo exclusivo de medios militares.","C) Coordinación únicamente entre unidades del Ejército.","D) Acción limitada al ámbito internacional.","E) Sustitución de organismos civiles por unidades militares."],r:0,a:"Acción multisectorial: integración, cooperación y sincronización de actividades de dos o más sectores para alcanzar unidad de esfuerzos."},
{n:322,p:"MD 1-0: ¿Cuál opción define mejor defensa nacional según el glosario?",o:["A) Conjunto de previsiones y acciones del Gobierno para permitir la supervivencia, permanencia y desarrollo del Estado frente a antagonismos o presiones.","B) Empleo de las Fuerzas Armadas únicamente en combate.","C) Protección exclusiva de fronteras frente a amenazas externas.","D) Actividad reservada al Ministerio de Defensa.","E) Medida temporal aplicable solo durante conflictos."],r:0,a:"Defensa nacional: conjunto de previsiones y acciones que adopta el Gobierno para permitir la supervivencia, permanencia y desarrollo del Estado frente a antagonismos o presiones."},
{n:323,p:"MD 1-0: En la visión institucional, ¿qué atributo se vincula con una gestión moderna, eficiente y transparente y una cultura innovadora basada en valores?",o:["A) Disuasivo.","B) Reconocido.","C) Respetado.","D) Integrado a la sociedad.","E) Modular."],r:2,a:"Respetado. El manual relaciona este atributo con gestión institucional moderna, eficiente y transparente, cultura innovadora basada en valores, liderazgo y profesionalismo."},
{n:324,p:"MD 1-0: ¿Cuál actividad pertenece a la capacidad operacional de protección y no a inteligencia?",o:["A) Colección.","B) Procesamiento.","C) Contrainteligencia.","D) Ciberdefensa y seguridad de la información.","E) Difusión."],r:3,a:"Ciberdefensa y seguridad de la información figura entre las capacidades operacionales de protección."},
{n:325,p:"MD 1-0: ¿Qué relación establece el manual entre desarrollo nacional y defensa nacional?",o:["A) Son objetivos incompatibles.","B) Un mayor grado de desarrollo nacional incrementa las posibilidades de la defensa nacional.","C) El desarrollo nacional elimina la necesidad de defensa.","D) La defensa nacional depende solo del desarrollo militar.","E) El desarrollo nacional se limita a infraestructura vial."],r:1,a:"El glosario establece que cuanto mayor sea el grado de desarrollo nacional, mayores serán las posibilidades de la defensa nacional."},
{n:326,p:"MD 1-0: ¿Qué describe mejor movimiento y maniobra como capacidad fundamental?",o:["A) Procesar información para producir inteligencia.","B) Desplegar, cambiar, reagrupar o trasladar fuerzas para obtener una posición de ventaja relativa.","C) Administrar exclusivamente recursos financieros.","D) Ejecutar únicamente fuegos indirectos.","E) Proteger solo instalaciones administrativas."],r:1,a:"Movimiento y maniobra permite desplegar, cambiar, reagrupar o trasladar fuerzas para obtener una posición de ventaja relativa."},
{n:327,p:"MD 1-0: ¿Qué caracteriza al ambiente operacional VICA?",o:["A) Volátil, incierto, complejo y ambiguo.","B) Variable, integrado, convencional y administrativo.","C) Vigilado, interno, coordinado y armado.","D) Visible, inmediato, centralizado y adaptable.","E) Virtual, industrial, convencional y aéreo."],r:0,a:"VICA significa volátil, incierto, complejo y ambiguo, características señaladas para el ambiente operacional."},
{n:328,p:"MD 1-0: Si una acción busca mejorar condiciones sociales y económicas mediante cooperación entre FFAA y órganos civiles responsables, ¿qué concepto corresponde?",o:["A) Acción cívica.","B) Fuegos.","C) Geoestrategia.","D) Contrainteligencia.","E) Fuerza modular."],r:0,a:"Acción cívica: conjunto de actividades de las FFAA en apoyo de la población y en cooperación con órganos civiles responsables."},
{n:329,p:"MD 1-0: ¿Cuál enunciado corresponde al concepto de fuerza modular?",o:["A) Fuerza que articula diversas capacidades operacionales según misionamiento, amenaza y ambiente operacional.","B) Fuerza integrada únicamente por unidades de una misma especialidad.","C) Fuerza diseñada sin considerar la amenaza.","D) Fuerza empleada solo en operaciones ofensivas.","E) Fuerza que reemplaza las capacidades fundamentales por medios administrativos."],r:0,a:"Fuerza modular: articula diversas capacidades operacionales de acuerdo con el misionamiento, amenaza específica y ambiente operacional."},
{n:330,p:"MD 1-0: ¿Qué idea central del capítulo 6 justifica la transformación institucional?",o:["A) La necesidad de adaptarse al ambiente operacional futuro y a los retos de la seguridad multidimensional.","B) La reducción permanente de capacidades.","C) El abandono de la doctrina Wiracocha.","D) La eliminación de la planificación institucional.","E) La concentración exclusiva en amenazas tradicionales."],r:0,a:"El capítulo 6 aborda la necesidad de adaptarse al ambiente operacional del futuro, los retos de la seguridad multidimensional y el Plan de Transformación Institucional."}

function mezclar(array) {
  const copia = [...array];
  for (let i = copia.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copia[i], copia[j]] = [copia[j], copia[i]];
  }
  return copia;
}

function obtenerSignificado(item) { return item.a || "Significado no disponible en el banco."; }

function prepararOpciones(item) {
  const opciones = item.o.map((texto, indiceOriginal) => ({ texto: texto.replace(/^[A-E]\)\s*/i, ""), indiceOriginal }));
  const mezcladas = mezclar(opciones);
  item._opciones = mezcladas.map((x, i) => ({ etiqueta: String.fromCharCode(65 + i), texto: x.texto, indiceOriginal: x.indiceOriginal }));
  item._respuesta = item._opciones.findIndex(x => x.indiceOriginal === item.r);
}

function cargarPregunta() {
  if (!iniciado) return;
  if (idxActual >= preguntas.length) { mostrarResultado(); return; }
  bloqueado = false;
  const item = preguntas[idxActual];
  prepararOpciones(item);
  feedbackTexto.className = "feedback";
  feedbackTexto.innerHTML = "";
  alertaRespuestaCorrecta.style.display = "none";
  contenedorAnalisis.style.display = "none";
  btnSiguiente.style.display = "none";
  listaOpciones.innerHTML = "";
  txtProgreso.textContent = `Pregunta: ${idxActual + 1}/${preguntas.length}`;
  preguntaTexto.textContent = item.p;
  item._opciones.forEach((opcion, index) => {
    const boton = document.createElement("button");
    boton.className = "option-btn";
    boton.innerHTML = `<strong>${opcion.etiqueta})</strong> ${opcion.texto}`;
    boton.onclick = () => verificarRespuesta(index, boton);
    listaOpciones.appendChild(boton);
  });
}

function mostrarResultado() {
  const total = preguntas.length;
  const buenas = Math.round(puntaje / 10);
  const malas = total - buenas;
  const pb = Math.round((buenas / total) * 100);
  const pm = 100 - pb;
  const nota = (buenas / total * 20).toFixed(1);
  const seg = Math.round((Date.now() - inicioTiempo) / 1000);
  const tiempo = `${Math.floor(seg / 60)}:${String(seg % 60).padStart(2, "0")}`;
  const nivel = pb >= 90 ? ["🏆 ¡Excelente!", "#10b981"] : pb >= 75 ? ["👏 Muy bien", "#22c55e"] : pb >= 60 ? ["👍 Aprobado, sigue practicando", "#f59e0b"] : ["📚 A repasar", "#ef4444"];
  const nombre = modoActual === 'sinonimos' ? 'Sinónimos' : 'Manual MD 1-0';
  txtProgreso.textContent = `🏁 Ronda terminada: ${total}/${total}`;
  preguntaTexto.innerHTML = `🎉 ¡Terminaste el examen de ${nombre}!`;
  listaOpciones.innerHTML = "";
  feedbackTexto.className = "feedback";
  const listaErrores = errores.length
    ? `<div class="res-errores"><div class="res-errores-titulo">❌ Para repasar (${errores.length})</div>${errores.map(e => `<div class="res-error-item"><div class="res-error-p">${e.p}</div><div class="res-error-l"><span class="mal">Tu respuesta:</span> ${e.elegida}</div><div class="res-error-l"><span class="bien">Correcta:</span> ${e.correcta}</div></div>`).join("")}</div>`
    : `<div class="res-perfecto">🌟 ¡Sin errores en esta ronda!</div>`;
  feedbackTexto.innerHTML = `
    <div class="resultado-final">
      <div class="res-titulo">📊 Resultado final</div>
      <div class="res-nota" style="color:${nivel[1]}">${nota}<small>/20</small></div>
      <div class="res-nivel" style="color:${nivel[1]}">${nivel[0]}</div>
      <div class="res-barra"><div class="res-barra-b" style="width:${pb}%"></div><div class="res-barra-m" style="width:${pm}%"></div></div>
      <div class="res-grid">
        <div class="res-card bien-card"><b>${buenas}</b><span>✅ Buenas · ${pb}%</span></div>
        <div class="res-card mal-card"><b>${malas}</b><span>❌ Malas · ${pm}%</span></div>
        <div class="res-card"><b>${puntaje}</b><span>🎯 Puntos</span></div>
        <div class="res-card"><b>${mejorRacha}</b><span>🔥 Mejor racha</span></div>
        <div class="res-card"><b>${tiempo}</b><span>⏱️ Tiempo</span></div>
        <div class="res-card"><b>${total}</b><span>📝 Preguntas</span></div>
      </div>
      ${listaErrores}
    </div>`;
  contenedorAnalisis.style.display = "none";
  btnSiguiente.style.display = "block";
  btnSiguiente.textContent = modoActual === 'sinonimos' ? "🔄 Otras 20 preguntas de Sinónimos" : "🔄 Nuevo examen MD 1-0";
  btnSiguiente.onclick = iniciarTest;
}
function verificarRespuesta(indiceSeleccionado, botonPresionado) {
  if (bloqueado) return;
  bloqueado = true;
  const item = preguntas[idxActual];
  const botones = Array.from(listaOpciones.getElementsByClassName("option-btn"));
  botones.forEach(b => b.disabled = true);
  const esCorrecta = indiceSeleccionado === item._respuesta;
  if (esCorrecta) {
    botonPresionado.classList.add("correct");
    feedbackTexto.innerHTML = "✨ ¡Correcto!";
    feedbackTexto.className = "feedback success";
    puntaje += 10;
    racha += 1;
    mejorRacha = Math.max(mejorRacha, racha);
    alertaRespuestaCorrecta.style.display = "none";
  } else {
    botonPresionado.classList.add("incorrect");
    botones[item._respuesta].classList.add("correct");
    feedbackTexto.innerHTML = "❌ Respuesta incorrecta.";
    feedbackTexto.className = "feedback error";
    racha = 0;
    errores.push({ p: item.p, elegida: item._opciones[indiceSeleccionado].texto, correcta: item._opciones[item._respuesta].texto });
    alertaRespuestaCorrecta.style.display = "inline-block";
    alertaRespuestaCorrecta.innerHTML = `Respuesta correcta: <strong>${item._opciones[item._respuesta].etiqueta}) ${item._opciones[item._respuesta].texto}</strong>`;
  }
  txtPuntaje.textContent = `✨ Puntos: ${puntaje}`;
  txtRacha.textContent = `🔥 Racha: ${racha}`;
  const significadoRespuesta = obtenerSignificado(item);
  const esSinonimo = modoActual === 'sinonimos';
  const conceptoPregunta = esSinonimo
    ? (item.c || `La palabra ${item.p} expresa el concepto relacionado con su sinónimo correcto.`)
    : "";
  analisisTexto.innerHTML = esSinonimo
    ? `<div><strong>🧠 Sinónimo (${item.p}):</strong> ${conceptoPregunta}</div><div style="margin-top:8px"><strong>📖 Respuesta:</strong> ${significadoRespuesta}</div>`
    : `<div><strong>📖 Respuesta:</strong> ${significadoRespuesta}</div>`;
  contenedorAnalisis.style.display = "block";
  btnSiguiente.style.display = "block";
  btnSiguiente.textContent = idxActual === preguntas.length - 1 ? "📊 Ver resultado" : "➡️ Siguiente pregunta";
  btnSiguiente.onclick = avanzarPregunta;
}

function avanzarPregunta() {
  if (!bloqueado) return;
  idxActual++;
  cargarPregunta();
}

function seleccionarModo(modo) {
  modoActual = modo;
  bancoActual = modo === 'sinonimos' ? bancoPreguntas : bancoMD;
  preguntasRestantes = mezclar([...bancoActual]);
  selectorModo.style.display = "none";
  panelExamen.style.display = "block";
  tituloPrincipal.textContent = modo === 'sinonimos' ? "📖 Test de Sinónimos" : "🎖️ Test del Manual MD 1-0";
  modoActualTexto.textContent = modo === 'sinonimos' ? "📖 Sinónimos" : "🎖️ Manual MD 1-0";
  const cantidad = modo === 'sinonimos' ? 20 : Math.min(20, bancoMD.length);
  btnIniciar.textContent = modo === 'sinonimos' ? "▶️ Iniciar 20 preguntas de Sinónimos" : `▶️ Iniciar ${cantidad} preguntas del MD 1-0`;
  txtProgreso.textContent = `Pregunta: 0/${cantidad}`;
  preguntaTexto.textContent = modo === 'sinonimos' ? "Presiona «Iniciar» para comenzar el examen de Sinónimos." : "Presiona «Iniciar» para comenzar el examen exclusivo del Manual MD 1-0.";
  listaOpciones.innerHTML = "";
  feedbackTexto.innerHTML = "";
  contenedorAnalisis.style.display = "none";
  btnSiguiente.style.display = "none";
  btnIniciar.style.display = "block";
  iniciado = false;
}

function cambiarModo() {
  modoActual = null;
  bancoActual = [];
  preguntas = [];
  preguntasRestantes = [];
  selectorModo.style.display = "block";
  panelExamen.style.display = "none";
  tituloPrincipal.textContent = "📚 Banco de Preguntas";
}

function iniciarTest() {
  if (!modoActual || bancoActual.length === 0) return;
  const cantidadRonda = Math.min(20, bancoActual.length);
  // Rondas de 20 al azar, sin repetir hasta agotar el banco; si faltan, se completa con un nuevo barajado.
  if (preguntasRestantes.length < cantidadRonda) {
    const ya = new Set(preguntasRestantes.map(p => p.n));
    preguntasRestantes = [...preguntasRestantes, ...mezclar(bancoActual.filter(p => !ya.has(p.n)))];
  }
  preguntas = mezclar([...preguntasRestantes]).slice(0, cantidadRonda);
  const usadas = new Set(preguntas.map(p => p.n));
  preguntasRestantes = preguntasRestantes.filter(p => !usadas.has(p.n));

  idxActual = 0; puntaje = 0; racha = 0; mejorRacha = 0; errores = []; inicioTiempo = Date.now(); bloqueado = false; iniciado = true;
  btnIniciar.style.display = "none";
  txtPuntaje.textContent = "✨ Puntos: 0";
  txtRacha.textContent = "🔥 Racha: 0";
  btnSiguiente.style.display = "none";
  cargarPregunta();
}
</script>
</body>
