{"n": 78, "p": "MISÁNTROPO", "o": ["A) sociable", "B) huraño", "C) filántropo", "D) sabio", "E) enfermo"], "r": 1, "a": "Huraño. Muestra aversión al trato humano y se aísla."},
{"n": 79, "p": "RECALCITRANTE", "o": ["A) flexible", "B) obedient", "C) obstinado", "D) tibio", "E) moderno"], "r": 2, "a": "Obstinado. Terco, aferrado con terquedad a una postura."},
{"n": 80, "p": "TÁCITO", "o": ["A) explícito", "B) implícito", "C) ruidoso", "D) prohibido", "E) escrito"], "r": 1, "a": "Implícito. Que no se expresa pero se deduce de los hechos."},
{"n": 81, "p": "UBICUIDAD", "o": ["A) ausencia", "B) omnipresencia", "C) destierro", "D) velocidad", "E) sabiduría"], "r": 1, "a": "Omnipresencia. Facultad de estar en todas partes a la vez."},
{"n": 82, "p": "VÁSTAGO", "o": ["A) ancestro", "B) tronco", "C) descendant", "D) amigo", "E) protector"], "r": 2, "a": "Descendiente. Persona que desciende de otra; hijo o retoño."},
{"n": 83, "p": "ABYECTO", "o": ["A) noble", "B) despreciable", "C) lejano", "D) inteligente", "E) generoso"], "r": 1, "a": "Despreciable. Persona ruin, vil o baja en su moral."},
{"n": 84, "p": "COADYUVAR", "o": ["A) estorbar", "B) oponer", "C) contribuir", "D) iniciar", "E) terminar"], "r": 2, "a": "Contribuir. Prestar ayuda o cooperar para un objetivo común."},
{"n": 85, "p": "DECREPITUD", "o": ["A) juventud", "B) health", "C) vejez", "D) locura", "E) pobreza"], "r": 2, "a": "Vejez. Decadencia física provocada por la avanzada edad."},
{"n": 86, "p": "EFÍMERO", "o": ["A) eterno", "B) duradero", "C) pasajero", "D) valioso", "E) histórico"], "r": 2, "a": "Pasajero. Que tiene una duración sumamente corta o fugaz."},
{"n": 87, "p": "FACUNDIA", "o": ["A) silencio", "B) elocuencia", "C) mentira", "D) riqueza", "E) timidez"], "r": 1, "a": "Elocuencia. Facilidad y soltura notable al hablar."},
{"n": 88, "p": "GÉNESIS", "o": ["A) final", "B) origen", "C) evolución", "D) muerte", "E) destrucción"], "r": 1, "a": "Origen. Principio, raíz o surgimiento de un proceso."},
{"n": 89, "p": "HARAGÁN", "o": ["A) activo", "B) vago", "C) trabajador", "D) ladrón", "E) sumiso"], "r": 1, "a": "Vago. Enemigo del trabajo, perezoso u holgazán."},
{"n": 90, "p": "INCOAR", "o": ["A) terminar", "B) pausar", "C) iniciar", "D) juzgar", "E) registrar"], "r": 2, "a": "Iniciar. Dar comienzo a un proceso, trámite o acción oficial."},
{"n": 91, "p": "CHASCO", "o": ["A) acierto", "B) broma", "C) triunfo", "D) fiasco", "E) encuentro"], "r": 3, "a": "Fiasco. Desilusión o revés inesperado que causa frustración."},
{"n": 92, "p": "PÓSITO", "o": ["A) depósito", "B) posición", "C) apostura", "D) excremento", "E) oquedad"], "r": 0, "a": "Depósito. Almacén de granos; depósito general."},
{"n": 93, "p": "LOCATARIO", "o": ["A) manicomio", "B) vesanía", "C) ciudadano", "D) arrendatario", "E) degustador"], "r": 3, "a": "Arrendatario. Persona que toma un bien en alquiler (inquilino)."},
{"n": 94, "p": "NECROPSIA", "o": ["A) autopsia", "B) excremento", "C) investigación", "D) resumen", "E) cementerio"], "r": 0, "a": "Autopsia. Examen anatómico de un cadáver para saber la causa de muerte."},
{"n": 95, "p": "VETO", "o": ["A) mina", "B) censura", "C) prohibición", "D) sufragio", "E) cédula"], "r": 2, "a": "Prohibición. Facultad para impedir la ejecución de una norma o ley."},
{"n": 96, "p": "LIBAR", "o": ["A) lamer", "B) marear", "C) tomar", "D) soltar", "E) emancipar"], "r": 2, "a": "Tomar. Beber un líquido a pequeños sorbos, equivalente a tomar."},
{"n": 97, "p": "LAYA", "o": ["A) línea", "B) tiberio", "C) calidad", "D) evasiva", "E) alaba"], "r": 2, "a": "Calidad. Define la clase, condición, naturaleza o calidad de algo."},
{"n": 98, "p": "CEPA", "o": ["A) aprenda", "B) conozca", "C) isla", "D) higiene", "E) raza"], "r": 4, "a": "Raza. Sustantivo que define el origen o tronco familiar de una especie."},
{"n": 99, "p": "CAPITULAR", "o": ["A) cercenar", "B) cadalso", "C) claudicar", "D) ahorcar", "E) título"], "r": 2, "a": "Claudicar. Significa rendirse bajo condiciones o dejar de oponer resistencia."},
{"n": 100, "p": "PANFLETO", "o": ["A) totalidad", "B) sátira", "C) acto", "D) boceto", "E) soltura"], "r": 1, "a": "Sátira. Escrito de corte agresivo diseñado para criticar con dureza."},
{"n": 101, "p": "INEPTO", "o": ["A) limitado", "B) incapaz", "C) impotente", "D) inapto", "E) tozudo"], "r": 1, "a": "Incapaz. Define a quien carece por completo de la aptitud, capacidad o competencia natural o intelectual para resolver problemas generales."},
{"n": 102, "p": "AVERIGUAR", "o": ["A) buscar", "B) encuestar", "C) entrevistar", "D) inquirir", "E) chismear"], "r": 3, "a": "Inquirir. Significa indagar, examinar o averiguar cuidadosamente y de manera profunda la verdad sobre un asunto."},
{"n": 103, "p": "CAMBIANTE", "o": ["A) impuntual", "B) belicoso", "C) movible", "D) veleidoso", "E) descortés"], "r": 3, "a": "Veleidoso. Califica a las personas inconstantes o volubles que mudan con extrema facilidad de gustos, opiniones o caprichos."},
{"n": 104, "p": "REPUTADO", "o": ["A) lañado", "B) impoluto", "C) indocto", "D) tunante", "E) putativo"], "r": 4, "a": "Putativo. Comparten la raíz etimológica latente de ser 'considerado, reputado o tenido por tal' en base a una suposición o creencia formal."},
{"n": 105, "p": "ALCOR", "o": ["A) elevación", "B) colina", "C) cordillera", "D) montaña", "E) ladera"], "r": 1, "a": "Colina. Define con precisión a una eminencia natural de tierra que se caracteriza por ser de poca altura, menor que una montaña."},
{"n": 106, "p": "ESTOLIDEZ", "o": ["A) idiocia", "B) retraso", "C) abulia", "D) atraso", "E) estulticia"], "r": 4, "a": "Estulticia. Significa tontería, necedad profunda o una alarmante falta de razón y luces intelectuales en el obrar."},
{"n": 107, "p": "CARRILLOS", "o": ["A) mofletes", "B) rumores", "C) carrozas", "D) obesidad", "E) pómulos"], "r": 0, "a": "Mofletes. Designa formalmente a las mejillas carnosas o abultadas a ambos lados del rostro humano."},
{"n": 108, "p": "ACUCIOSO", "o": ["A) genial", "B) perpicaz", "C) laborioso", "D) intuitivo", "E) activo"], "r": 2, "a": "Laborioso. Describe a una persona muy aplicada, diligente y solicita que pone un gran esfuerzo, esmero y rapidez en sus tareas de trabajo o estudio."},
{"n": 109, "p": "MONJE", "o": ["A) santón", "B) ermitaño", "C) anacoreta", "D) monja", "E) monaguillo"], "r": 2, "a": "Anacoreta. Representa la forma originaria y pura del monacato eremítico: personas que se retiran del mundo para vivir en soledad y contemplación espiritual."},
{"n": 110, "p": "CHOCHEZ", "o": ["A) ternura", "B) arrumaco", "C) ancianidad", "D) aches", "E) decrepitud"], "r": 4, "a": "Decrepitud. Estado de decadencia física y mental extrema producida por la avanzada edad biológica, donde se debilitan marcadamente las facultades."},
{"n": 111, "p": "ANARQUISTA", "o": ["A) solerte", "B) libertario", "C) amotinado", "D) desigual", "E) cretino"], "r": 1, "a": "Libertario. Término ideológico e histórico que funciona como sinónimo directo del partidario del anarquismo y de la abolición del Estado."},
{"n": 112, "p": "POSMA", "o": ["A) pústula", "B) férula", "C) pasividad", "D) cachaza", "E) apatía"], "r": 3, "a": "Cachaza. Describe la lentitud, pesadez o flema excesiva y exasperante en el modo de actuar o de ejecutar las acciones físicas."},
{"n": 113, "p": "ABSORTO", "o": ["A) alerta", "B) admirado", "C) concentrado", "D) pensativo", "E) iluso"], "r": 1, "a": "Admirado. Significa pasmado, estupefacto o sobrecogido por el asombro ante un suceso extraordinario que suspende el pensamiento."},
{"n": 114, "p": "ESCOSOR", "o": ["A) antojo", "B) alivio", "C) picazón", "D) ardor", "E) curiosidad"], "r": 2, "a": "Picazón. Sensación incómoda en la piel que produce la necesidad e impulso inmediato de rascarse para aliviar la zona."},
{"n": 115, "p": "INCINERAR", "o": ["A) inhumar", "B) quemar", "C) crematorio", "D) calcinar", "E) incendiar"], "r": 3, "a": "Calcinar. Someter un cuerpo a la acción del fuego intenso hasta reducirlo por completo a cenizas o provocar su descomposición total."},
{"n": 116, "p": "ENGENDRO", "o": ["A) fenómeno", "B) bestial", "C) craso", "D) criatura", "E) neonato"], "r": 0, "a": "Fenómeno. Criatura viva que presenta graves anomalías orgánicas, malformaciones marcadas o una fealdad que rompe el orden natural."},
{"n": 117, "p": "ANTIGUO", "o": ["A) secular", "B) colonial", "C) feudal", "D) monacal", "E) gastado"], "r": 0, "a": "Secular. Califica a aquello que dura un siglo o que se extiende majestuosamente a lo largo de varias centurias del tiempo."},
{"n": 118, "p": "GENEROSO", "o": ["A) bondadoso", "B) pródigo", "C) benigno", "D) abundancia", "E) ostentoso"], "r": 1, "a": "Pródigo. Adjetivo que describe a la persona desprendida que gasta u otorga sus recursos materiales con gran largueza y sin restricciones."},
{"n": 119, "p": "PAUPÉRRIMO", "o": ["A) ingente", "B) miseria", "C) inane", "D) mentecato", "E) inope"], "r": 4, "a": "Inope. Adjetivo culto que designa formalmente al individuo indigente, pobre y completamente desprovisto de los recursos económicos necesarios."},
{"n": 120, "p": "ORCO", "o": ["A) paraíso", "B) fantasma", "C) suplicio", "D) báratro", "E) angustia"], "r": 3, "a": "Báratro. Voz clásica y poética utilizada para designar de forma exacta al infierno o a un abismo profundo y tenebroso de castigo."},
{"n": 121, "p": "ACARDENALADO", "o": ["A) consagrado", "B) espiritual", "C) encarnado", "D) santiguado", "E) violáceo"], "r": 2, "a": "Encarnado. Coloración roja viva o de color de carne congestionada que adoptan los tejidos inflamados por un golpe o contusión subcutánea."},
{"n": 122, "p": "RECELOSO", "o": ["A) tímido", "B) camastrón", "C) suspicaz", "D) celoso", "E) inseguro"], "r": 2, "a": "Suspicaz. Persona propensa a concebir sospechas o que desconfía con extrema facilidad de las intenciones de los demás."},
{"n": 123, "p": "LLANURA", "o": ["A) desierto", "B) plano", "C) sencillez", "D) valle", "E) sabana"], "r": 4, "a": "Sabana. Sustantivo que define geográficamente a una llanura de gran extensión en regiones tropicales o subtropicales que carece casi de árboles."},
{"n": 124, "p": "JAYÁN", "o": ["A) membrudo", "B) garrido", "C) agarrado", "D) deportista", "E) pesista"], "r": 0, "a": "Membrudo. Individuo robusto, corpulento, de gran estatura y dotado de miembros fuertemente desarrollados para el vigor físico."},
{"n": 125, "p": "SEQUEDAD", "o": ["A) infertilidad", "B) esterilidad", "C) extenuación", "D) inhóspito", "E) enjutez"], "r": 4, "a": "Enjutez. Sustantivo abstracto que define la delgadez extrema o la cualidad de estar seco, chupado y desprovisto de carnes o masas de grasa corporal."},
{"n": 126, "p": "IMPASIBLE", "o": ["A) chabacano", "B) cenobita", "C) astroso", "D) indolente", "E) obstinado"], "r": 3, "a": "Indolente. Califica a quien no se afecta, conmueve o perturba ante el dolor ajeno o las circunstancias externas intensas, mostrando total imperturbabilidad."},
{"n": 127, "p": "DUBITAR", "o": ["A) indefinir", "B) alternar", "C) hesitar", "D) equivocar", "E) capcioso"], "r": 2, "a": "Hesitar. Verbo en infinitivo de registro culto que significa exactamente dudar, vacilar o mostrar indecisión antes de emitir una resolución."},
{"n": 128, "p": "DILOGÍA", "o": ["A) falsedades", "B) ambigüedad", "C) falacia", "D) engaño", "E) falsedad"], "r": 1, "a": "Ambigüedad. Cualidad del lenguaje o enunciado que puede entenderse de varios modos o admitir distintas interpretaciones lingüísticas concurrentes."},
{"n": 129, "p": "INTERINO", "o": ["A) incluido", "B) endógeno", "C) provisional", "D) reemplazo", "E) interno"], "r": 2, "a": "Provisional. Adjetivo que describe aquello que se hace, tiene o ejerce de manera transitoria y temporal, a la espera de una resolución definitiva."},
{"n": 130, "p": "PLEGARIA", "o": ["A) implorar", "B) petición", "C) jaculatoria", "D) responso", "E) adoration"], "r": 2, "a": "Jaculatoria. Define formalmente a una oración o plegaria muy breve y fervorosa, dicha con profunda devoción religiosa a la divinidad."},
{"n": 131, "p": "DISOLUTO", "o": ["A) libertino", "B) libre", "C) autónomo", "D) absoluto", "E) candinga"], "r": 0, "a": "Libertino. Individuo entregado por completo a los vicios morales y a los placeres desenfrenados, viviendo sin moderación alguna."},
{"n": 132, "p": "ALBAÑAL", "o": ["A) estanque", "B) palestra", "C) desagüe", "D) letrina", "E) silo"], "r": 2, "a": "Desagüe. Conducto, canal o tubería subterránea construida específicamente para dar salida a las aguas sucias o pluviales de una edificación."},
{"n": 133, "p": "DESAPERCIBIDO", "o": ["A) inadvertido", "B) desprovisto", "C) ignorado", "D) ignoto", "E) indiferente"], "r": 0, "a": "Inadvertido. Califica a aquello que pasa completamente sin ser visto, que no es percibido o que no llama la atención del entorno."},
{"n": 134, "p": "LAXADO", "o": ["A) absuelto", "B) ablandado", "C) extendido", "D) cansado", "E) dilatado"], "r": 1, "a": "Ablandado. Participio que comparte el núcleo semántico de disminuir la tensión, firmeza o rigidez natural de los tejidos orgánicos o materiales."},
{"n": 135, "p": "PELOTILLERO", "o": ["A) cuentista", "B) suertero", "C) servil", "D) sortilegio", "E) sugestión"], "r": 2, "a": "Servil. Adjetivo que describe a la persona aduladora o lisonjera que muestra una sumisión baja exagerada ante sus superiores para obtener favores."},
{"n": 136, "p": "DENUESTO", "o": ["A) deprecación", "B) litigio", "C) agravio", "D) hollar", "E) humillar"], "r": 2, "a": "Agravio. Sustantivo masculino que significa ofensa, insulto o injuria dirigida a perjudicar la honra o la dignidad moral de un individuo."},
{"n": 137, "p": "POLISARCIA", "o": ["A) inapetencia", "B) hidropesía", "C) seboso", "D) obesidad", "E) gordura"], "r": 3, "a": "Obesidad. Término médico y científico equivalente que define la acumulación crónica y patológica de tejido graso en el organismo vivo."},
{"n": 138, "p": "INSANIA", "o": ["A) locura", "B) parolina", "C) neurosis", "D) psicopatía", "E) demencia"], "r": 4, "a": "Demencia. Estado patológico y forense caracterizado por la pérdida profunda de la razón, el juicio o el deterioro de las capacidades cognitivas."},
{"n": 139, "p": "INQUINA", "o": ["A) animosidad", "B) amargura", "C) enfado", "D) cólera", "E) despecho"], "r": 0, "a": "Animosidad. Sentimiento latente de mala voluntad, enemistad o aversión profunda y persistente manifestada hacia otra persona."},
{"n": 140, "p": "PRETERIR", "o": ["A) suplantar", "B) reparar", "C) posponer", "D) desubicar", "E) relegar"], "r": 2, "a": "Posponer. Acción de retrasar, postergar o dejar en un segundo plano la atención o el trámite de una cosa o persona en favor de otra."},
{"n": 141, "p": "ATÁVICO", "o": ["A) genético", "B) ancestral", "C) arcaico", "D) prosapia", "E) heredado"], "r": 1, "a": "Ancestral. Adjetivo que califica a todo rasgo, costumbre o comportamiento remoto que pertenece o se hereda de los antepasados familiares."},
{"n": 142, "p": "INEDIA", "o": ["A) cansancio", "B) indolencia", "C) pereza", "D) ensueño", "E) albinismo"], "r": 1, "a": "Indolencia. Estado conductual de desidia, apatía o inacción absoluta que caracteriza a quien carece voluntariamente de energía para obrar."},
{"n": 143, "p": "ARRAIGAR", "o": ["A) aclimatar", "B) afincar", "C) ramificar", "D) determinar", "E) mitigar"], "r": 1, "a": "Afincar. Verbo en infinitivo que significa establecer de manera firme y duradera una residencia fija, adquiriendo raíces patrimoniales en un lugar."},
{"n": 144, "p": "ESPELUZNO", "o": ["A) pavura", "B) escalofrío", "C) espanto", "D) pánico", "E) terciana"], "r": 2, "a": "Espanto. Sustantivo que designa un susto o terror de gran intensidad, procesado a partir de la raíz verbal de causar horror sobrecegedor."},
{"n": 145, "p": "REILAR", "o": ["A) enfocar", "B) brillar", "C) titilar", "D) refulgir", "E) sustentar"], "r": 2, "a": "Titilar. Centellear con un brillo trémulo, parpadeante o intermitente, equivaliendo a la acción física de la luz de moverse como temblando."},
{"n": 146, "p": "ABYECTO", "o": ["A) calculador", "B) rastrero", "C) excreta", "D) repulido", "E) trufa"], "r": 1, "a": "Rastrero. Adjetivo valorativo que define a un individuo moralmente degradado, vil, despreciable o ruin en el plano de su conducta."},
{"n": 147, "p": "EXPATRIADO", "o": ["A) proscrito", "B) prescrito", "C) suscrito", "D) expulsado", "E) aislado"], "r": 0, "a": "Proscrito. Persona exiliada o desterrada formalmente de su patria debido a motivos políticos o determinaciones de carácter legal judicial."},
{"n": 148, "p": "CÁFILA", "o": ["A) gorrino", "B) secuela", "C) caterva", "D) difunto", "E) extravio"], "r": 2, "a": "Caterva. Sustantivo colectivo indeterminado que denota a una multitud desordenada de personas o cosas consideradas en grupo con tono despectivo."},
{"n": 149, "p": "ESTRAGAR", "o": ["A) enfermar", "B) afectar", "C) deshacer", "D) desvastar", "E) devastar"], "r": 4, "a": "Devastar. Destruir un territorio o asolar y arruinar algo por completo, compartiendo el mismo grado máximo de daño estructural o moral."},
{"n": 150, "p": "LABILIDAD", "o": ["A) habilidad", "B) inconstancia", "C) movimiento", "D) cambiante", "E) emotividad"], "r": 1, "a": "Inconstancia. Sustantivo abstracto que define formalmente la falta de estabilidad, firmeza o la condición de ser mudable o variable."},
// --- NUEVAS 50 PREGUNTAS INTEGRADAS CON ÉXITO (151 - 200) ---
{"n": 151, "p": "ENHIESTO", "o": ["A) endurado", "B) penetrante", "C) erecto", "D) espinoso", "E) edificado"], "r": 2, "a": "Erecto. Adjetivo que significa levantado, derecho o vertical."},
{"n": 152, "p": "RENUENTE", "o": ["A) remiso", "B) precoz", "C) ilógico", "D) indocto", "E) renovado"], "r": 0, "a": "Remiso. Se refiere a la persona reacia o que muestra resistencia o falta de voluntad para cumplir una obligación."},
{"n": 153, "p": "LOCUACIDAD", "o": ["A) elocuencia", "B) oratoria", "C) labia", "D) verborrea", "E) facundia"], "r": 4, "a": "Facundia. Abundancia de palabras y gran soltura o facilidad para hablar de forma fluida."},
{"n": 154, "p": "TAJANTE", "o": ["A) divisorio", "B) concluyente", "C) arbitrario", "D) encendido", "E) esquemático"], "r": 1, "a": "Concluyente. Que es firme, categórico y definitivo, no dejando lugar a ninguna duda o discusión."},
{"n": 155, "p": "MANUFACTURA", "o": ["A) urdimbre", "B) obraje", "C) trabajo", "D) acabado", "E) fábrica"], "r": 1, "a": "Obraje. Obra hecha a mano o taller artesanal donde se elaboran y fabrican dichos productos."},
{"n": 156, "p": "SEÑORIAL", "o": ["A) imperioso", "B) majestuoso", "C) soberbio", "D) cortesano", "E) orgulloso"], "r": 1, "a": "Majestuoso. Que posee una gran dignidad, distinción, suntuosidad, elegancia y grandeza."},
{"n": 157, "p": "INCENSAR", "o": ["A) alabar", "B) destacar", "C) flamear", "D) humear", "E) ahumar"], "r": 0, "a": "Alabar. En sentido figurado, lisonjear, adular o elogiar exageradamente a alguien para ganar su favor."},
{"n": 158, "p": "COMPULSAR", "o": ["A) carear", "B) enfrentar", "C) afrontar", "D) comparar", "E) igualar"], "r": 3, "a": "Comparar. Cotejar o examinar dos o más documentos para comprobar su exacta fidelidad y autenticidad."},

let preguntas = [];
let idxActual = 0;
let puntaje = 0;
let racha = 0;
let bloqueado = false;
let iniciado = false;
const txtProgreso = document.getElementById("txt-progreso");
const txtPuntaje = document.getElementById("txt-puntaje");
const txtRacha = document.getElementById("txt-racha");
const preguntaTexto = document.getElementById("pregunta-texto");
const listaOpciones = document.getElementById("lista-opciones");
const feedbackTexto = document.getElementById("feedback-texto");
const contenedorAnalisis = document.getElementById("contenedor-analisis");
const alertaRespuestaCorrecta = document.getElementById("alerta-respuesta-correcta");
const analisisTexto = document.getElementById("analisis-texto");
const btnSiguiente = document.getElementById("btn-siguiente");
const btnIniciar = document.getElementById("btn-iniciar");
function mezclar(array) {
const copia = [...array];
for (let i = copia.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[copia[i], copia[j]] = [copia[j], copia[i]];
}
return copia;
}
let preguntasRestantes = [...bancoPreguntas];
function iniciarTest() {
if (preguntasRestantes.length === 0) {
preguntasRestantes = [...bancoPreguntas];
}
preguntas = mezclar([...preguntasRestantes]).slice(0, Math.min(50, preguntasRestantes.length));
const usadas = new Set(preguntas.map(p => p.n));
preguntasRestantes = preguntasRestantes.filter(p => !usadas.has(p.n));
idxActual = 0;
puntaje = 0;
racha = 0;
bloqueado = false;
iniciado = true;
btnIniciar.style.display = "none";
txtPuntaje.innerHTML = "✨ Puntos: 0";
txtRacha.innerHTML = "🔥 Racha: 0";
btnSiguiente.innerHTML = "➡️ Siguiente pregunta";
btnSiguiente.style.display = "none";
cargarPregunta();
}
function cargarPregunta() {
if (!iniciado) return;
if (idxActual >= preguntas.length) {
mostrarResultado();
return;
}
bloqueado = false;
feedbackTexto.className = "feedback";
feedbackTexto.innerHTML = "";
alertaRespuestaCorrecta.style.display = "none";
contenedorAnalisis.style.display = "none";
btnSiguiente.style.display = "none";
btnSiguiente.innerHTML = "➡️ Siguiente pregunta";
listaOpciones.innerHTML = "";
const item = preguntas[idxActual];
txtProgreso.innerHTML = `Pregunta: ${idxActual + 1}/${preguntas.length}`;
preguntaTexto.innerHTML = `${item.n}. ${item.p}`;
const letras = ["A)", "B)", "C)", "D)", "E)"];
const indicesOpciones = mezclar([0, 1, 2, 3, 4]);
indicesOpciones.forEach(originalIndex => {
const boton = document.createElement("button");
boton.className = "option-btn";
const textoOpcion = item.o[originalIndex].replace(/^[A-E]\)\s*/, "");
boton.innerHTML = `${letras[listaOpciones.children.length]} ${textoOpcion}`;
boton.dataset.originalIndex = originalIndex;
boton.onclick = () => verificarRespuesta(originalIndex, boton);
listaOpciones.appendChild(boton);
});
}
function mostrarResultado() {
const total = preguntas.length;
const buenas = puntaje / 10;
const malas = total - buenas;
const porcentajeBuenas = Math.round((buenas / total) * 100);
const porcentajeMalas = Math.round((malas / total) * 100);
const nota = (buenas / total * 20).toFixed(1);
txtProgreso.innerHTML = `🏁 Ronda terminada: ${total}/${total}`;
preguntaTexto.innerHTML = "🎉 ¡Terminaste las 50 preguntas!";
listaOpciones.innerHTML = "";
feedbackTexto.className = "feedback success";
feedbackTexto.innerHTML = `<div class="resultado-final"> <h2>📊 Resultado de tu ronda</h2> <p><strong>📝 Nota:</strong> ${nota} / 20</p> <p><strong>✅ Buenas:</strong> ${buenas} (${porcentajeBuenas}%)</p> <p><strong>❌ Malas:</strong> ${malas} (${porcentajeMalas}%)</p> </div>`;
contenedorAnalisis.style.display = "none";
btnSiguiente.style.display = "block";
btnSiguiente.innerHTML = "🔄 Volver a comenzar con otras 50";
btnSiguiente.onclick = () => {
btnSiguiente.onclick = avanzarPregunta;
iniciarTest();
};
btnIniciar.style.display = "none";
}
function verificarRespuesta(indiceSeleccionado, botonPresionado) {
if (bloqueado) return;
bloqueado = true;
const item = preguntas[idxActual];
const botones = listaOpciones.getElementsByClassName("option-btn");
Array.from(botones).forEach(boton => boton.disabled = true);
if (indiceSeleccionado === item.r) {
botonPresionado.classList.add("correct");
feedbackTexto.innerHTML = "✨ ¡Correcto! Buen análisis semántico.";
feedbackTexto.className = "feedback success";
puntaje += 10;
racha += 1;
alertaRespuestaCorrecta.style.display = "none";
} else {
botonPresionado.classList.add("incorrect");
const botonCorrecto = Array.from(botones).find(b => Number(b.dataset.originalIndex) === item.r);
if (botonCorrecto) botonCorrecto.classList.add("correct");
feedbackTexto.innerHTML = "❌ Respuesta incorrecta.";
feedbackTexto.className = "feedback error";
racha = 0;
alertaRespuestaCorrecta.style.display = "inline-block";
alertaRespuestaCorrecta.innerHTML = `La respuesta correcta era: ${item.o[item.r]}`;
}
txtPuntaje.innerHTML = `✨ Puntos: ${puntaje}`;
txtRacha.innerHTML = `🔥 Racha: ${racha}`;
analisisTexto.innerHTML = item.a;
contenedorAnalisis.style.display = "block";
btnSiguiente.style.display = "block";
if (idxActual === preguntas.length - 1) {
btnSiguiente.innerHTML = "📊 Ver resultado";
} else {
btnSiguiente.innerHTML = "➡️ Siguiente pregunta";
}
}
function avanzarPregunta() {
if (!bloqueado) return;
idxActual++;
btnSiguiente.onclick = avanzarPregunta;
cargarPregunta();
}
</script>
