    <style>
        /* ===== Paleta ===== */
        :root {
            --fondo: #0a0f1c;
            --panel: #121a2e;
            --panel-2: #0d1426;
            --borde: #25324f;
            --borde-suave: #1b2640;
            --texto: #eef2fb;
            --texto-2: #a9b6d3;
            --texto-3: #6f7f9f;
            --acento: #4cc9f0;
            --acento-fuerte: #3a86ff;
            --sinonimos: #14b8a6;
            --manual: #e0a93b;
            --ok: #3ddc97;
            --ok-fondo: #0e3b2c;
            --mal: #ff5c7a;
            --mal-fondo: #4a1523;
            --aviso: #ffb454;
        }

        /* ===== Base ===== */
        * { box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        body { background: radial-gradient(1100px 520px at 50% -10%, #16224a 0%, var(--fondo) 62%); margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: var(--texto); }
        .quiz-container { background: var(--panel); width: 100%; max-width: 450px; border-radius: 22px; padding: 22px 20px; border: 1px solid var(--borde); box-shadow: 0 20px 50px rgba(2, 6, 20, .55); display: flex; flex-direction: column; }
        h1 { font-size: 22px; text-align: center; color: var(--acento); margin: 0 0 16px 0; letter-spacing: .2px; }

        /* ===== Estadísticas y progreso ===== */
        .stats { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; margin-bottom: 8px; background: var(--panel-2); border: 1px solid var(--borde-suave); padding: 10px 12px; border-radius: 12px; color: var(--texto-2); }
        .progress { height: 6px; border-radius: 999px; background: var(--borde-suave); overflow: hidden; margin-bottom: 16px; }
        .progress-fill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, var(--acento-fuerte), var(--acento)); transition: width .35s ease; }

        /* ===== Pregunta y opciones ===== */
        .question-box { background: var(--panel-2); border-radius: 14px; padding: 20px; font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 20px; border: 1px solid var(--borde); line-height: 1.4; }
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: #1a2442; border: 1px solid var(--borde); border-radius: 12px; padding: 16px; font-size: 15px; color: var(--texto); text-align: left; cursor: pointer; font-weight: 600; -webkit-tap-highlight-color: transparent; width: 100%; transition: background .2s, border-color .2s; }
        .option-btn:hover:not(:disabled) { background: #222f56; border-color: var(--acento-fuerte); }
        .option-btn:focus-visible, .start-btn:focus-visible, .next-btn:focus-visible, .restart-btn:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
        .option-btn.correct { background: var(--ok-fondo) !important; border-color: var(--ok) !important; color: #d6fbe9; }
        .option-btn.incorrect { background: var(--mal-fondo) !important; border-color: var(--mal) !important; color: #ffd9e0; }
        .option-btn:disabled { cursor: default; opacity: 0.95; }

        /* ===== Feedback y análisis ===== */
        .feedback { text-align: center; font-weight: bold; margin-top: 15px; min-height: 20px; font-size: 16px; }
        .feedback.success { color: var(--ok); }
        .feedback.error { color: var(--mal); }
        .analysis-box { background: var(--panel-2); border: 1px solid var(--borde); border-radius: 14px; padding: 15px; margin-top: 15px; display: none; font-size: 14px; line-height: 1.5; color: var(--texto-2); }
        .analysis-title { color: var(--acento); font-weight: bold; margin-bottom: 6px; font-size: 15px; }
        .correct-answer-alert { color: #ffd9e0; font-weight: bold; margin-bottom: 8px; font-size: 14px; background: var(--mal-fondo); padding: 6px 10px; border-radius: 8px; border: 1px solid #7c2a3d; display: inline-block; }

        /* ===== Botones ===== */
        .next-btn { width: 100%; background: var(--acento-fuerte); color: white; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: bold; margin-top: 15px; cursor: pointer; display: none; text-align: center; transition: background .2s; }
        .next-btn:hover { background: #2f6fe0; }
        .start-btn { background: var(--sinonimos); color: #04211e; border: none; border-radius: 12px; padding: 15px; font-size: 16px; font-weight: bold; margin-bottom: 15px; cursor: pointer; width: 100%; transition: filter .2s; }
        .start-btn:hover { filter: brightness(1.1); }
        .restart-btn { background: var(--aviso); color: #1c1203; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: bold; margin-top: 15px; cursor: pointer; width: 100%; }

        /* ===== Selector de modo ===== */
        .modo-selector { text-align: center; padding: 10px 0 5px; }
        .selector-subtitulo { color: var(--texto-2); font-size: 15px; margin: 0 0 18px; line-height: 1.5; }
        .manual-btn { background: var(--manual); color: #261a02; }
        .modo-actual { text-align: center; font-size: 18px; font-weight: 800; margin-bottom: 12px; color: var(--acento); }
        #btn-cambiar-modo { display: block; background: #2a3658; color: var(--texto); }
        #btn-cambiar-modo:hover { background: #34426a; filter: none; }

        /* ===== Resultado final y gráficos ===== */
        .resultado-final { margin: 14px 0 0; padding: 18px 14px; border-radius: 18px; background: var(--panel-2); border: 1px solid var(--borde); text-align: center; color: var(--texto); }
        .res-titulo { font-size: 14px; font-weight: 700; color: var(--texto-2); letter-spacing: .4px; }
        .res-donut { position: relative; width: 176px; height: 176px; margin: 12px auto 6px; }
        .res-donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .donut-fondo { fill: none; stroke: var(--borde-suave); stroke-width: 12; }
        .donut-mal { fill: none; stroke: var(--mal); stroke-width: 12; opacity: .85; }
        .donut-bien { fill: none; stroke-width: 12; stroke-linecap: round; }
        .res-donut-centro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .res-nota { font-size: 34px; font-weight: 800; line-height: 1; }
        .res-nota small { font-size: 14px; font-weight: 600; color: var(--texto-3); }
        .res-pct { font-size: 12px; color: var(--texto-2); margin-top: 6px; font-weight: 600; }
        .res-nivel { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
        .res-sub { font-size: 12px; font-weight: 700; color: var(--texto-3); text-align: left; margin: 0 0 6px 2px; }
        .res-linea { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-bottom: 16px; }
        .res-punto { aspect-ratio: 1; border-radius: 7px; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
        .res-punto.ok { background: var(--ok-fondo); color: var(--ok); border: 1px solid #1f7a55; }
        .res-punto.ko { background: var(--mal-fondo); color: var(--mal); border: 1px solid #8a2c42; }
        .res-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .res-card { background: var(--panel); border: 1px solid var(--borde); border-radius: 12px; padding: 12px 8px; display: flex; flex-direction: column; gap: 4px; }
        .res-card b { font-size: 24px; color: var(--texto); }
        .res-card span { font-size: 12px; color: var(--texto-2); font-weight: 600; }
        .bien-card { border-color: #1f7a55; } .bien-card b { color: var(--ok); }
        .mal-card { border-color: #8a2c42; } .mal-card b { color: var(--mal); }
        .res-errores { margin-top: 16px; text-align: left; }
        .res-errores-titulo { font-size: 14px; font-weight: 700; color: var(--mal); margin-bottom: 8px; }
        .res-error-item { background: var(--panel); border-left: 3px solid var(--mal); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; font-size: 13px; line-height: 1.4; }
        .res-error-p { font-weight: 800; color: var(--texto); margin-bottom: 2px; }
        .res-error-l { color: var(--texto-2); }

        .res-error-l .bien { color: var(--ok); font-weight: 700; }
        .res-perfecto { margin-top: 16px; font-weight: 700; color: var(--ok); }
        .tcp-btn { background: #4ea8ff; color: #04162b; }
        .so-btn { background: #a78bfa; color: #170b3a; }
    </style>
</head>

</div>

const bancoMD = [
{n:301,p:"MD 1-0: ¿Qué enunciado distingue mejor una capacidad fundamental de una capacidad operacional?",o:["A) La fundamental agrupa capacidades operacionales similares; la operacional es una habilidad componente de una fundamental.","B) La fundamental es propia del nivel táctico; la operacional, del nivel estratégico.","C) La fundamental se refiere al personal; la operacional, al material.","D) Ambas expresiones son equivalentes y se usan indistintamente.","E) La operacional reemplaza a las funciones del Ejército en tiempo de paz."],r:0,a:"Las capacidades fundamentales agrupan capacidades operacionales similares y orientan el diseño de la estructura y magnitud de la fuerza; las operacionales son habilidades componentes de una fundamental."},
{n:302,p:"MD 1-0: Una fuerza articula distintas capacidades según la misión y la amenaza específica dentro de una brigada de combate. ¿Qué concepto de la visión institucional se aplica?",o:["A) Fuerza modular.","B) Fuerza territorial.","C) Acción cívica.","D) Cooperación internacional.","E) Control administrativo."],r:0,a:"Fuerza modular. La visión describe una fuerza modular capaz de articular diversas capacidades fundamentales según misión y amenaza específica."},
{n:303,p:"MD 1-0: ¿Qué acción estratégica se relaciona directamente con vigilar fronteras y producir información para garantizar la seguridad?",o:["A) Investigación histórica del patrimonio nacional.","B) Actividades de inteligencia y vigilancia de fronteras.","C) Cooperación cultural con ejércitos de otros países.","D) Gestión presupuestal institucional.","E) Formación de cadetes en colegios militares."],r:1,a:"El rol de garantizar la independencia, soberanía e integridad territorial incluye desarrollar actividades de inteligencia y operaciones de vigilancia de fronteras."},
{n:304,p:"MD 1-0: ¿Qué combinación corresponde a las seis capacidades fundamentales señaladas en el manual?",o:["A) Comando y control, inteligencia, movimiento y maniobra, fuegos, protección y sostenimiento.","B) Logística, personal, educación, sanidad, ingeniería y comunicaciones.","C) Ofensiva, defensiva, estabilidad, apoyo, reserva y movilización.","D) Planeamiento, presupuesto, doctrina, educación, salud y relaciones internacionales.","E) Ciberdefensa, telemática, aviación, ingeniería, artillería y caballería."],r:0,a:"Las seis capacidades fundamentales son comando y control, inteligencia, movimiento y maniobra, fuegos, protección y sostenimiento."},
{n:305,p:"MD 1-0: Si una actividad comprende colección, procesamiento, difusión, reconocimiento y vigilancia, y contrainteligencia, ¿a qué capacidad operacional pertenece?",o:["A) Fuegos.","B) Protección.","C) Inteligencia.","D) Sostenimiento.","E) Movimiento y maniobra."],r:2,a:"Inteligencia. El manual enumera esas actividades dentro de la capacidad operacional de inteligencia."},
{n:306,p:"MD 1-0: ¿Cuál es la finalidad central de la misión institucional descrita en el capítulo 2?",o:["A) Contribuir a garantizar la independencia, la soberanía, la integridad territorial y el bienestar general.","B) Concentrar en el Ejército las funciones del Estado en tiempo de crisis.","C) Sustituir de forma temporal a las autoridades civiles.","D) Limitar la acción militar al ámbito internacional.","E) Priorizar el desarrollo económico sobre la defensa."],r:0,a:"La misión busca contribuir a garantizar la independencia, soberanía, integridad territorial y bienestar general, además de participar en desarrollo, orden interno, defensa civil y política exterior conforme a ley."},
{n:307,p:"MD 1-0: ¿Cuál de los siguientes atributos NO forma parte de la visión institucional?",o:["A) Disuasivo.","B) Reconocido.","C) Respetado.","D) Integrado a la sociedad.","E) Autosuficiente económicamente."],r:4,a:"La visión señala: ser un Ejército disuasivo, reconocido, respetado e integrado a la sociedad. La autosuficiencia económica no forma parte de esa formulación."},
{n:308,p:"MD 1-0: ¿Qué órgano realiza el planeamiento estratégico institucional y asesora al Comandante General?",o:["A) Inspectoría General del Ejército.","B) Estado Mayor General del Ejército.","C) Procuraduría Pública del Ejército.","D) Órgano de Control Institucional.","E) Consejo Consultivo del Ejército."],r:1,a:"El Estado Mayor General del Ejército es el órgano de planeamiento y asesoramiento del más alto nivel."},
{n:309,p:"MD 1-0: ¿Qué diferencia establece el manual entre interoperatividad e interoperabilidad?",o:["A) La interoperatividad es operar coordinadamente con otras fuerzas; la interoperabilidad, proporcionar o recibir servicios entre fuerzas o sistemas.","B) Son términos equivalentes y no existe distinción conceptual.","C) La primera es de carácter administrativo; la segunda, presupuestal.","D) La primera corresponde al ciberespacio; la segunda, al dominio terrestre.","E) La primera es una capacidad fundamental; la segunda, un rol estratégico."],r:0,a:"El glosario distingue la interoperatividad como capacidad de operar coordinada y simultáneamente con otras fuerzas, y la interoperabilidad como capacidad de proporcionar o recibir servicios entre fuerzas o sistemas."},
{n:310,p:"MD 1-0: Si dos o más Fuerzas Armadas emplean sus medios para cumplir una misión, ¿qué concepto corresponde?",o:["A) Operación integrada.","B) Operación conjunta.","C) Acción cívica.","D) Acción multisectorial.","E) Gestión del riesgo."],r:1,a:"Operación conjunta. El manual la describe como aquella que involucra el empleo de dos o más fuerzas: Ejército, Marina o Fuerza Aérea."},
{n:311,p:"MD 1-0: ¿Qué institución conduce políticamente el Sector Defensa?",o:["A) Comando Conjunto de las Fuerzas Armadas.","B) Ejército del Perú.","C) Ministerio de Defensa.","D) Estado Mayor General del Ejército.","E) Policía Nacional del Perú."],r:2,a:"El Ministerio de Defensa es el órgano rector y responsable de la conducción política del Sector Defensa."},
{n:312,p:"MD 1-0: ¿Cuál es la función del Comando Conjunto destacada en el capítulo 1?",o:["A) Conducir las operaciones del Ejército en su territorio.","B) Planear, preparar, coordinar y conducir las operaciones militares conjuntas.","C) Administrar el presupuesto de cada instituto armado.","D) Ejercer la defensa jurídica de las Fuerzas Armadas.","E) Dirigir los colegios militares."],r:1,a:"El CCFFAA realiza el planeamiento, preparación, coordinación y conducción de las operaciones militares conjuntas."},
{n:313,p:"MD 1-0: ¿Qué afirmación refleja mejor el concepto de ambiente operacional?",o:["A) Comprende el terreno físico y el clima donde opera una unidad.","B) Es la combinación de condiciones, circunstancias e influencias que afectan el empleo de capacidades y las decisiones del comandante.","C) Se refiere a las amenazas externas de tipo convencional.","D) Equivale al área administrativa de una unidad.","E) Excluye las dimensiones aérea, marítima y ciberespacial."],r:1,a:"Ambiente operacional: combinación de condiciones, circunstancias e influencias que afectan el empleo de capacidades militares y las decisiones del comandante; comprende dimensiones terrestre, aérea, marítima, espacial y ciberespacial."},
{n:314,p:"MD 1-0: ¿Cuál es el propósito de los roles estratégicos asignados por el Estado al Ejército?",o:["A) Convertirlos en normas presupuestales del sector.","B) Concretar los propósitos del Estado en misiones, mediante el planeamiento y empleo de capacidades militares.","C) Sustituir a la Constitución y las leyes en materia de defensa.","D) Limitar las capacidades militares al tiempo de paz.","E) Regular la carrera militar y los ascensos."],r:1,a:"Los roles estratégicos son propósitos que el Estado asigna al Ejército y se concretan en misiones mediante planeamiento y empleo de capacidades militares."},
{n:315,p:"MD 1-0: ¿Qué caracteriza a un Ejército multimisión?",o:["A) Una fuerza diseñada para cumplir una misión permanente.","B) Una estructura moderna, modular y polivalente, sustentada en el planeamiento basado en capacidades.","C) Una fuerza que carece de especialidades.","D) Una organización de carácter administrativo.","E) Una fuerza orientada al combate convencional."],r:1,a:"Ejército multimisión: estructura moderna, modular y polivalente, sustentada en planeamiento basado en capacidades militares."},
{n:316,p:"MD 1-0: ¿Cuál NO corresponde a la ética militar descrita en el manual?",o:["A) Orientar las acciones mediante principios, valores y deberes.","B) Crear conciencia de la responsabilidad asociada al ejercicio profesional.","C) Sustituir la preparación técnica y física del militar.","D) Formar parte transversal de la educación ético-moral.","E) Orientar la conducta de los integrantes de la institución."],r:2,a:"La ética militar orienta mediante principios, valores y deberes y crea conciencia de responsabilidad; no sustituye la preparación técnica y física."},
{n:317,p:"MD 1-0: ¿Qué conjunto corresponde a los principios militares enumerados en la sección 3.6?",o:["A) Respeto por la Constitución y las leyes; respeto por los DDHH y el DIH; honor militar; ética en el actuar; compromiso y fe institucional; perseverancia y abnegación.","B) Disciplina, logística, inteligencia, maniobra, fuegos y protección.","C) Lealtad, presupuesto, educación, salud, movilidad y ciberdefensa.","D) Honor, ofensiva, defensiva, estabilidad, reserva y sostenimiento.","E) Vocación, carrera, ascenso, sanción, presupuesto y mando."],r:0,a:"Es el conjunto de seis principios militares expresamente enumerados en la sección 3.6."},
{n:318,p:"MD 1-0: ¿Por qué el liderazgo se considera permanente y progresivo?",o:["A) Porque se desarrolla recién al alcanzar los grados superiores.","B) Porque la formación del líder militar continúa a lo largo de la carrera, en las dimensiones individual y organizacional.","C) Porque depende del ejercicio del mando formal.","D) Porque reemplaza la formación académica del militar.","E) Porque se aplica durante las operaciones."],r:1,a:"La formación del líder militar es permanente y progresiva a lo largo de la carrera, en dimensiones individual y organizacional."},
{n:319,p:"MD 1-0: ¿Qué órgano realiza funciones de control, supervisión e investigación de asuntos militares, operacionales y disciplinarios?",o:["A) Inspectoría General del Ejército.","B) Estado Mayor General del Ejército.","C) Comandancia General del Ejército.","D) Procuraduría Pública del Ejército.","E) Consejo Superior del Ejército."],r:0,a:"La Inspectoría General del Ejército realiza funciones de control, supervisión e investigación en el ámbito de su competencia."},
{n:320,p:"MD 1-0: ¿Cuál es la finalidad del desarrollo nacional según el glosario?",o:["A) Aumentar el poder militar del Estado.","B) Lograr la satisfacción de las necesidades de la población mediante el crecimiento sostenido y sustentable del Poder Nacional.","C) Sustituir el sistema de defensa nacional.","D) Concentrar la economía en el sector Defensa.","E) Limitar la participación del Estado al ámbito regional."],r:1,a:"Desarrollo nacional: proceso de crecimiento sostenido y sustentable del Poder Nacional para alcanzar el bienestar general y satisfacer las necesidades de la población."},
{n:321,p:"MD 1-0: ¿Qué concepto describe mejor la acción multisectorial?",o:["A) Integración, cooperación y sincronización de actividades de dos o más sectores bajo la coordinación de una autoridad designada.","B) Empleo coordinado de los medios militares de las tres instituciones armadas.","C) Coordinación entre unidades del mismo instituto armado.","D) Acción desarrollada en el ámbito internacional.","E) Sustitución de organismos civiles por unidades militares."],r:0,a:"Acción multisectorial: integración, cooperación y sincronización de actividades de dos o más sectores para alcanzar unidad de esfuerzos."},
{n:322,p:"MD 1-0: ¿Qué opción define mejor la defensa nacional según el glosario?",o:["A) Conjunto de previsiones y acciones del Gobierno para permitir la supervivencia, permanencia y desarrollo del Estado frente a antagonismos o presiones.","B) Empleo de las Fuerzas Armadas en el combate contra una amenaza.","C) Protección de las fronteras frente a amenazas externas.","D) Actividad reservada al Ministerio de Defensa.","E) Medida temporal aplicable durante un conflicto."],r:0,a:"Defensa nacional: conjunto de previsiones y acciones que adopta el Gobierno para permitir la supervivencia, permanencia y desarrollo del Estado frente a antagonismos o presiones."},
{n:323,p:"MD 1-0: En la visión institucional, ¿qué atributo se vincula con una gestión moderna, eficiente y transparente y una cultura innovadora basada en valores?",o:["A) Disuasivo.","B) Reconocido.","C) Respetado.","D) Integrado a la sociedad.","E) Modular."],r:2,a:"Respetado. El manual relaciona este atributo con gestión institucional moderna, eficiente y transparente, cultura innovadora basada en valores, liderazgo y profesionalismo."},
{n:324,p:"MD 1-0: ¿Qué actividad pertenece a la capacidad operacional de protección y no a la de inteligencia?",o:["A) Colección.","B) Procesamiento.","C) Contrainteligencia.","D) Ciberdefensa y seguridad de la información.","E) Difusión."],r:3,a:"Ciberdefensa y seguridad de la información figura entre las capacidades operacionales de protección."},
{n:325,p:"MD 1-0: ¿Qué relación establece el manual entre desarrollo nacional y defensa nacional?",o:["A) Son objetivos incompatibles entre sí.","B) Un mayor grado de desarrollo nacional incrementa las posibilidades de la defensa nacional.","C) El desarrollo nacional elimina la necesidad de la defensa.","D) La defensa nacional depende del desarrollo militar.","E) El desarrollo nacional se limita a la infraestructura vial."],r:1,a:"El glosario establece que cuanto mayor sea el grado de desarrollo nacional, mayores serán las posibilidades de la defensa nacional."},
{n:326,p:"MD 1-0: ¿Qué describe mejor movimiento y maniobra como capacidad fundamental?",o:["A) Procesar información para producir inteligencia.","B) Desplegar, cambiar, reagrupar o trasladar fuerzas para obtener una posición de ventaja relativa.","C) Administrar los recursos financieros de la fuerza.","D) Ejecutar fuegos indirectos sobre el objetivo.","E) Proteger las instalaciones administrativas."],r:1,a:"Movimiento y maniobra permite desplegar, cambiar, reagrupar o trasladar fuerzas para obtener una posición de ventaja relativa."},
{n:327,p:"MD 1-0: ¿Qué caracteriza al ambiente operacional VICA?",o:["A) Volátil, incierto, complejo y ambiguo.","B) Variable, integrado, convencional y administrativo.","C) Vigilado, interno, coordinado y armado.","D) Visible, inmediato, centralizado y adaptable.","E) Virtual, industrial, convencional y aéreo."],r:0,a:"VICA significa volátil, incierto, complejo y ambiguo, características señaladas para el ambiente operacional."},
{n:328,p:"MD 1-0: Si una acción busca mejorar las condiciones sociales y económicas mediante la cooperación entre las FFAA y los órganos civiles responsables, ¿qué concepto corresponde?",o:["A) Acción cívica.","B) Fuegos.","C) Geoestrategia.","D) Contrainteligencia.","E) Fuerza modular."],r:0,a:"Acción cívica: conjunto de actividades de las FFAA en apoyo de la población y en cooperación con órganos civiles responsables."},
{n:329,p:"MD 1-0: ¿Qué enunciado corresponde al concepto de fuerza modular?",o:["A) Fuerza que articula diversas capacidades operacionales según el misionamiento, la amenaza y el ambiente operacional.","B) Fuerza integrada por unidades de una misma especialidad.","C) Fuerza diseñada sin considerar la amenaza específica.","D) Fuerza empleada en operaciones ofensivas.","E) Fuerza que reemplaza las capacidades fundamentales por medios administrativos."],r:0,a:"Fuerza modular: articula diversas capacidades operacionales de acuerdo con el misionamiento, amenaza específica y ambiente operacional."},
{n:330,p:"MD 1-0: ¿Qué idea central del capítulo 6 justifica la transformación institucional?",o:["A) La necesidad de adaptarse al ambiente operacional futuro y a los retos de la seguridad multidimensional.","B) La reducción permanente de las capacidades.","C) El abandono de la doctrina institucional vigente.","D) La eliminación del planeamiento institucional.","E) La concentración en las amenazas tradicionales."],r:0,a:"El capítulo 6 aborda la necesidad de adaptarse al ambiente operacional del futuro, los retos de la seguridad multidimensional y el Plan de Transformación Institucional."}
];
const bancoSO = [
{n:501,p:"¿Cuáles son los cuatro componentes de un sistema informático?",o:["A) Hardware, sistema operativo, aplicaciones y usuarios","B) Hardware, firmware, red y usuarios","C) CPU, memoria, disco y teclado","D) Kernel, shell, compilador y editor","E) Hardware, sistema operativo, redes y administradores"],r:0,a:"Un sistema informático se divide en hardware (CPU, memoria, dispositivos de E/S), sistema operativo, aplicaciones y usuarios."},
{n:502,p:"¿Qué componente del sistema informático proporciona los recursos de computación básicos?",o:["A) El sistema operativo","B) El hardware (CPU, memoria y dispositivos)","C) Los programas de aplicación","D) Los usuarios","E) El compilador"],r:1,a:"El hardware aporta los recursos básicos sobre los que se agregan las capas sucesivas."},
{n:503,p:"Los compiladores, los juegos y las aplicaciones de negocios son ejemplos de:",o:["A) Núcleo del sistema","B) Hardware","C) Programas de aplicación","D) Controladores de dispositivos","E) Intérpretes de comandos"],r:2,a:"Los programas de aplicación definen cómo se emplearán los recursos para solucionar los problemas del usuario."},
{n:504,p:"Según el documento, ¿qué clases de usuarios pueden usar el sistema?",o:["A) Programadores, diseñadores y analistas","B) Administradores y operadores de red","C) Clientes, servidores y routers","D) Personas, programas y otras computadoras","E) Alumnos, docentes y técnicos"],r:3,a:"Los usuarios pueden ser personas, programas y otras computadoras que tratan de resolver problemas."},
{n:505,p:"¿Qué determina el sistema operativo respecto de un recurso como la CPU o el disco?",o:["A) El fabricante del recurso","B) El precio de la licencia del programa","C) La velocidad de la red","D) El lenguaje en que fue escrito el programa","E) Los tiempos en que un programa lo utilizará"],r:4,a:"El SO controla y coordina el uso del hardware y determina los tiempos en que un programa utilizará un recurso dado."},
{n:506,p:"En la primera era informática, ¿cómo ejecutaban los programas las computadoras de hace unos 40 años?",o:["A) Un programa a la vez, cargado por un programador","B) Varios programas simultáneos en memoria","C) Mediante un sistema de tiempo compartido","D) A través de una red de terminales","E) Con un sistema operativo de red"],r:0,a:"Ejecutaban un programa a la vez, cargado por un programador, sin sistema operativo."},
{n:507,p:"Si un programa se detenía antes de lo esperado en esas primeras computadoras, ¿qué ocurría?",o:["A) El sistema lo reanudaba automáticamente","B) Había que comenzar de nuevo todo el proceso","C) Se pasaba al siguiente programa de la cinta","D) El programa se guardaba en el disco","E) El operador lo reiniciaba desde la última línea"],r:1,a:"Ante un error se tenía que comenzar de nuevo con todo el proceso y esperar varios días para volver a tener turno."},
{n:508,p:"¿Con qué medio se cargaban los programas en las primeras computadoras?",o:["A) Discos flexibles","B) Memorias USB","C) Tarjetas perforadas","D) Discos ópticos","E) Cintas de video"],r:2,a:"Todo se hacía a través de tarjetas perforadas que una persona cargaba en la computadora."},
{n:509,p:"¿Cuál es el objetivo fundamental de los sistemas informáticos según el documento?",o:["A) Reducir el tamaño de las computadoras","B) Aumentar el costo de los equipos","C) Sustituir a los programadores","D) Ejecutar los programas de los usuarios y facilitar la resolución de sus problemas","E) Conectar todas las computadoras a Internet"],r:3,a:"El objetivo fundamental es ejecutar los programas de los usuarios y facilitar la resolución de sus problemas."},
{n:510,p:"¿Cuál es el ancestro de los sistemas operativos de hoy?",o:["A) Las tarjetas perforadas","B) Los sistemas de tiempo compartido","C) Los sistemas distribuidos","D) Las máquinas virtuales","E) Un programa residente en memoria que cargaba y manipulaba los programas de una cinta"],r:4,a:"Muchos programas se cargaban en una sola cinta y otro programa residente en memoria los cargaba y manipulaba."},
{n:511,p:"¿En qué década avanzó la tecnología de SO hasta tener múltiples programas en memoria al mismo tiempo?",o:["A) Década del 60","B) Década del 40","C) Década del 50","D) Década del 70","E) Década del 80"],r:0,a:"En los años 60 surgió la multiprogramación."},
{n:512,p:"¿Cómo permite la multiprogramación aprovechar mejor la CPU?",o:["A) Ejecutando un solo programa a máxima velocidad","B) Mientras un programa espera un evento externo, otro usa la CPU","C) Duplicando la memoria del equipo","D) Eliminando los dispositivos de entrada","E) Reiniciando los programas detenidos"],r:1,a:"Si un programa esperaba, por ejemplo, que se rebobinara una cinta, otro tenía acceso a la CPU para usar el 100% de su capacidad."},
{n:513,p:"¿Por qué la multiprogramación ahorraba mucho dinero en esa época?",o:["A) Porque eliminaba a los operadores","B) Porque no requería memoria","C) Porque el cómputo (memoria, disco, etc.) costaba cientos de miles de dólares","D) Porque los programas eran gratuitos","E) Porque reducía el consumo eléctrico"],r:2,a:"En aquel entonces todo lo referente a cómputo costaba cientos de miles de dólares."},
{n:514,p:"¿En qué año nació UNIX?",o:["A) 1975","B) 1985","C) 1991","D) 1969","E) 1962"],r:3,a:"UNIX nació a finales de los 60, en 1969, y es base de muchos SO actuales."},
{n:515,p:"¿Quiénes fundaron Microsoft en 1975?",o:["A) Linus Torvalds y Richard Stallman","B) Steve Jobs y Steve Wozniak","C) Andy Tanenbaum y Dennis Ritchie","D) Bill Joy y Ken Thompson","E) William H. Gates III y Paul Allen"],r:4,a:"Microsoft fue fundada en 1975 por William H. Gates III y Paul Allen."},
{n:516,p:"¿Dónde fue fundada Microsoft, originalmente llamada Micro-soft?",o:["A) Albuquerque, Nuevo México","B) Redmond, Washington","C) Helsinki, Finlandia","D) San Francisco, California","E) Palo Alto, California"],r:0,a:"Fue fundada en Albuquerque, Nuevo México, en 1975."},
{n:517,p:"¿Qué computadora unió por su afición a programar a Gates y Allen durante su época de estudiantes?",o:["A) IBM 360","B) PDP-10 de Digital Equipment Corporation","C) Altair 8800","D) Commodore 64","E) Apple II"],r:1,a:"Ambos se conocieron por su afición a programar la PDP-10 de Digital Equipment Corporation."},
{n:518,p:"¿Qué incorporó por primera vez Windows, lanzado por Microsoft en 1985?",o:["A) Soporte de redes TCP/IP","B) Arquitectura de 64 bits","C) Una interfaz gráfica de usuario sobre MS-DOS","D) Un navegador web","E) Un sistema de archivos NTFS"],r:2,a:"Windows ampliaba las prestaciones de MS-DOS e incorporaba por primera vez una interfaz gráfica de usuario."},
{n:519,p:"¿En qué año salió a la venta Windows 2.0?",o:["A) 1985","B) 1990","C) 1991","D) 1987","E) 1995"],r:3,a:"Windows 2.0 salió a la venta en 1987; tres años después apareció Windows 3.0."},
{n:520,p:"¿Quién creó Linux, en qué año y en qué universidad estudiaba?",o:["A) Richard Stallman, 1983, MIT","B) Andy Tanenbaum, 1987, Vrije Universiteit","C) Linus Torvalds, 1975, Universidad de Oslo","D) Dennis Ritchie, 1969, Bell Labs","E) Linus Torvalds, 1991, Universidad de Helsinki"],r:4,a:"En 1991 el estudiante finlandés Linus Torvalds, de la Universidad de Helsinki, se propuso hacer un SO como UNIX para PC."},
{n:521,p:"¿Qué requisito mínimo de hardware debió fijar Linus Torvalds para su sistema?",o:["A) Un procesador i386","B) Un procesador Z80","C) Un procesador Pentium","D) Un procesador 8086","E) Un procesador Alpha"],r:0,a:"Los ordenadores con CPU más antiguas no facilitaban el desarrollo de un SO compatible con UNIX."},
{n:522,p:"¿Qué factor fue decisivo para el desarrollo y aceptación de Linux?",o:["A) La venta de licencias comerciales","B) La gran expansión de Internet","C) El apoyo de Microsoft","D) El uso de tarjetas perforadas","E) La desaparición de UNIX"],r:1,a:"Internet facilitó el trabajo en equipo de todos los que quisieron colaborar con Linus."},
{n:523,p:"¿Cuál era el objetivo fundamental de Linus Torvalds?",o:["A) Crear todos los programas que trae UNIX","B) Vender un sistema operativo propio","C) Crear un núcleo compatible con UNIX que ejecutara los programas libres GNU","D) Reemplazar el compilador de C","E) Desarrollar una interfaz gráfica"],r:2,a:"Quiso un núcleo totalmente compatible con UNIX para ejecutar los programas libres de la Free Software Foundation."},
{n:524,p:"¿Qué establece la licencia GNU?",o:["A) Permite cobrar por todo el código","B) Prohíbe modificar los programas","C) Obliga a pagar regalías a la FSF","D) Impide poner precio a los programas libres y obliga a que lo derivado también sea libre","E) Solo permite uso comercial"],r:3,a:"La licencia impide poner precio a los programas donados y obliga a que los nuevos programas basados en código libre sean también libres."},
{n:525,p:"¿Quién fundó la Free Software Foundation?",o:["A) Linus Torvalds","B) Andy Tanenbaum","C) Bill Gates","D) Paul Allen","E) Richard Stallman"],r:4,a:"La Free Software Foundation fue fundada por Richard Stallman."},
{n:526,p:"¿En qué se inspiró Linus Torvalds para crear su núcleo?",o:["A) Minix, versión reducida de UNIX de Andy Tanenbaum","B) MS-DOS","C) Windows NT","D) OS/360","E) Solaris"],r:0,a:"Minix fue desarrollado por el profesor Andy Tanenbaum para que sus alumnos experimentaran con el código de un SO real."},
{n:527,p:"¿Qué significa el nombre Linux?",o:["A) Linear UNIX","B) Linus UNIX","C) Lightweight UNIX","D) Linux Is Not UNIX","E) Library of UNIX"],r:1,a:"Es un acrónimo en inglés de «Linus UNIX», el UNIX de Linus."},
{n:528,p:"¿Qué podía hacer la versión 0,01 de Linux, de agosto de 1991?",o:["A) Ejecutar bash y gcc","B) Conectarse a Internet","C) Leer y escribir ficheros en un disquete","D) Mostrar una interfaz gráfica","E) Ejecutar varios usuarios"],r:2,a:"Tenía lo necesario para leer y escribir ficheros en un disquete; no hacía gran cosa y no se anunció."},
{n:529,p:"¿Qué herramientas de GNU ejecutaba la versión 0,02, anunciada el 5 de octubre de 1991?",o:["A) Un navegador y un editor","B) El servidor web y el correo","C) Un entorno gráfico y un reproductor","D) El intérprete de órdenes (bash) y el compilador de C (gcc)","E) Un ensamblador y un depurador"],r:3,a:"La 0,02 ya podía ejecutar bash y gcc."},
{n:530,p:"Según el documento, ¿qué es el SO que nos compete?",o:["A) El conjunto completo de herramientas del equipo","B) El navegador y el explorador de archivos","C) El programa que se instala una sola vez","D) El compilador del sistema","E) El programa que se ejecuta todo el tiempo (kernel o núcleo); el resto son aplicaciones"],r:4,a:"El SO es el kernel que ejecuta todo el tiempo; los programas de aplicación son todo lo demás."},
{n:531,p:"¿Qué relación suelen tener la comodidad y la eficiencia en un SO?",o:["A) Casi siempre resultan contradictorias","B) Siempre se logran a la vez","C) Son idénticas","D) Dependen del tamaño del disco","E) No tienen relación"],r:0,a:"El documento señala que casi siempre resulta contradictoria la comodidad y la eficiencia."},
{n:532,p:"¿Cuáles son los objetivos básicos de un sistema operativo?",o:["A) Velocidad de red y seguridad física","B) Eficiencia en la gestión de recursos y ocultación de los detalles de los dispositivos","C) Diseño gráfico y compatibilidad de archivos","D) Reducción de memoria y de costos","E) Programación y compilación"],r:1,a:"Busca eficiencia en la gestión de recursos y ocultar el funcionamiento de los dispositivos para comodidad del usuario."},
{n:533,p:"¿Cuál es un error común sobre el término «sistema operativo»?",o:["A) Llamar así al kernel","B) Llamarlo núcleo","C) Llamar así al conjunto completo de herramientas, como el explorador y el navegador","D) Llamarlo programa residente","E) Asociarlo con el hardware"],r:2,a:"El SO propiamente dicho es el núcleo o kernel, no el explorador de ficheros ni el navegador web."},
{n:534,p:"Desde el punto de vista del usuario común, ¿cuál es una función del SO?",o:["A) Creación y borrado de procesos","B) Asignación y liberación de memoria","C) Actividades de temporización","D) Comandos para entrar y abandonar el sistema","E) Comunicación y sincronización de procesos"],r:3,a:"Entrar y abandonar el sistema es una función de cara al usuario común; las otras corresponden al programador."},
{n:535,p:"Desde el punto de vista del programador de aplicaciones, ¿cuál es una función del SO?",o:["A) Órdenes para modificar la clave de entrada","B) Establecer las rutas de búsqueda","C) Información de estado del sistema","D) Comandos para definir un terminal","E) Creación y borrado de procesos"],r:4,a:"Creación y borrado de procesos es función de cara al programador de aplicaciones."},
{n:536,p:"¿Qué dos modos de operación se diferencian para la protección de E/S?",o:["A) Modo usuario y modo supervisor","B) Modo seguro y modo normal","C) Modo lectura y modo escritura","D) Modo local y modo remoto","E) Modo básico y modo avanzado"],r:0,a:"Para proteger la E/S se distinguen el modo usuario y el modo supervisor."},
{n:537,p:"¿Cómo se cambia de modo usuario a modo supervisor?",o:["A) Reiniciando el equipo","B) Mediante llamadas a funciones del sistema operativo","C) Con una instrucción cualquiera del programa","D) Cambiando la clave de entrada","E) Desconectando los periféricos"],r:1,a:"Solo es posible pasar a modo supervisor por medio de llamadas a funciones del S.O."},
{n:538,p:"Para que la protección de memoria sea eficiente, generalmente se necesita:",o:["A) Más discos duros","B) Un compilador especial","C) Recursos hardware que controlen el acceso a la memoria","D) Un navegador web","E) Mayor ancho de banda"],r:2,a:"Se requieren recursos hardware por los que se controla el acceso a la memoria."},
{n:539,p:"¿Qué hace la gestión de la CPU del sistema operativo?",o:["A) Organiza la información en carpetas","B) Interpreta las órdenes del usuario","C) Controla el acceso a periféricos","D) Inicia, finaliza, interrumpe y reanuda programas","E) Gestiona el espacio en disco"],r:3,a:"La gestión de CPU es responsable de iniciar, finalizar, interrumpir y reanudar programas."},
{n:540,p:"¿Qué tarea corresponde a la gestión de memoria?",o:["A) Organizar archivos y carpetas","B) Interpretar las órdenes del usuario","C) Iniciar y finalizar programas","D) Dar acceso sencillo a los periféricos","E) Controlar la memoria que necesita cada programa y permitir que varios procesos coexistan"],r:4,a:"Controla la cantidad de memoria de cada programa y permite la coexistencia de varios procesos en memoria central."},
{n:541,p:"¿Qué tarea realiza la gestión de dispositivos de almacenamiento?",o:["A) Organiza la información en archivos y carpetas con acceso rápido y eficiente","B) Controla la CPU","C) Interpreta comandos","D) Asigna prioridades a los procesos","E) Gestiona la memoria central"],r:0,a:"Organiza la información en archivos y carpetas y permite acceso rápido y eficiente."},
{n:542,p:"¿Qué función cumple el intérprete de comandos?",o:["A) Compilar programas","B) Interpretar y llevar a cabo las órdenes del usuario","C) Detectar virus","D) Imprimir documentos","E) Cargar tarjetas perforadas"],r:1,a:"Las órdenes del usuario son interpretadas y llevadas a cabo."},
{n:543,p:"¿Qué permite la gestión de E/S?",o:["A) Almacenar archivos en carpetas","B) Iniciar programas","C) Que los programas accedan a los periféricos de forma sencilla","D) Controlar la memoria central","E) Ejecutar el intérprete de comandos"],r:2,a:"La gestión de E/S facilita a los programas el acceso a los periféricos."},
{n:544,p:"¿Qué caracterizó a la primera generación de sistemas operativos (1945-1955)?",o:["A) Aparecieron los transistores y el assembler","B) Surgieron la multiprogramación y el spool","C) Aparecieron los microprocesadores","D) No existían SO; se usaban válvulas y el usuario programaba en binario","E) Surgieron los sistemas distribuidos"],r:3,a:"En esa época no había SO, se usaban tubos de vacío y los programas se hacían en código binario."},
{n:545,p:"¿Qué tecnología distingue a la segunda generación (1955-1965)?",o:["A) Las válvulas de vacío","B) Los circuitos VLSI","C) Los microprocesadores","D) Las redes de área local","E) Los transistores"],r:4,a:"Los transistores redujeron el tamaño de las máquinas y facilitaron los sistemas operativos."},
{n:546,p:"¿Qué lenguajes aparecen en la segunda generación?",o:["A) Lenguajes de bajo nivel (assembler) y JCL","B) Java y C++","C) Python y Ruby","D) SQL y HTML","E) Pascal y Basic"],r:0,a:"Aparecen los lenguajes de bajo nivel (assembler) y el lenguaje JCL."},
{n:547,p:"¿Qué significa IOCS?",o:["A) Sistema de control de interrupciones","B) Sistema de control de entrada/salida","C) Centro de operaciones del sistema","D) Control interno del sistema operativo","E) Interfaz de órdenes y comandos"],r:1,a:"Un «embrión» de programa dio lugar al IOCS, sistema de control de entrada/salida."},
{n:548,p:"¿Qué dos estados del S.O. se crean en la segunda generación?",o:["A) Activo y pasivo","B) Local y remoto","C) Superusuario y usuario","D) Seguro e inseguro","E) Lectura y escritura"],r:2,a:"Se crean el estado Superusuario y el estado Usuario."},
{n:549,p:"¿Cómo se llaman las instrucciones que solo se pueden ejecutar en modo superusuario?",o:["A) Interruptivas","B) Residentes","C) Virtuales","D) Privilegiadas","E) Diferidas"],r:3,a:"Las instrucciones que solo se ejecutan en estado superusuario se llaman privilegiadas."},
{n:550,p:"¿Qué tipos de interrupciones gestiona el gestor de interrupciones?",o:["A) Locales y remotas","B) Rápidas y lentas","C) Síncronas y asíncronas","D) Primarias y secundarias","E) Hardware y software"],r:4,a:"El documento menciona interrupciones de hardware e interrupciones de software."},
{n:551,p:"¿Qué es un buffer?",o:["A) Una memoria intermedia por donde pasa la información antes de llegar al dispositivo","B) Un disco duro externo","C) Un tipo de procesador","D) Un lenguaje de programación","E) Un protocolo de red"],r:0,a:"Los buffers son memorias intermedias; el dispositivo lee del buffer, eliminando el dispositivo off-line."},
{n:552,p:"¿Qué empresa creó la familia 360 de ordenadores en la tercera generación?",o:["A) Microsoft","B) IBM","C) Digital Equipment Corporation","D) Apple","E) Sun"],r:1,a:"IBM creó un software compatible para ordenadores de propósito general y las familias 360, 370, etc."},
{n:553,p:"¿Qué es la escalabilidad?",o:["A) La capacidad de reducir el tamaño del equipo","B) La velocidad del procesador","C) La posibilidad de ampliar en un momento dado las funciones de un sistema","D) La compatibilidad con otras marcas","E) El número de usuarios conectados"],r:2,a:"Aparece en la tercera generación como la posibilidad de ampliar las funciones de un sistema."},
{n:554,p:"¿Qué es el spool en la tercera generación?",o:["A) Un lenguaje de control de trabajos","B) Una cinta magnética","C) Un tipo de interrupción","D) Un disco que cumple la función del buffer y solo lo utiliza el sistema operativo","E) Un procesador auxiliar"],r:3,a:"Con las unidades de disco se utiliza el disco como buffer; se llama spool y solo lo usa el SO."},
{n:555,p:"¿Qué suponían los sistemas de tiempo compartido?",o:["A) Procesar trabajos por lotes","B) Ejecutar un solo programa","C) Eliminar los terminales","D) Usar tarjetas perforadas","E) Volver a interactuar con el sistema"],r:4,a:"Los sistemas de tiempo compartido permitieron volver a interactuar con el sistema."},
{n:556,p:"¿Cómo funcionan los sistemas de tiempo real de la tercera generación?",o:["A) Mediante sensores que dan una respuesta inmediata","B) Agrupando trabajos en lotes","C) Con tarjetas perforadas","D) Con un solo usuario","E) Con dispositivos off-line"],r:0,a:"Funcionan mediante una serie de sensores con respuesta inmediata."},
{n:557,p:"¿Qué circuitos caracterizan a la cuarta generación (1980-1990)?",o:["A) Válvulas de vacío","B) Circuitos integrados VLSI","C) Transistores discretos","D) Cintas magnéticas","E) Tarjetas perforadas"],r:1,a:"Se utilizan circuitos integrados VLSI (Very Large Scale Integration)."},
{n:558,p:"¿Qué problema trae la conectividad en la cuarta generación?",o:["A) Lentitud del procesador","B) Falta de memoria","C) Problemas de seguridad","D) Imposibilidad de comunicarse","E) Aumento del tamaño de los equipos"],r:2,a:"La conectividad permite gran libertad de comunicación pero hace que aparezcan problemas de seguridad."},
{n:559,p:"¿Cuál es la diferencia entre SO de Red y SO Distribuidos en la cuarta generación?",o:["A) Los de red son transparentes y los distribuidos no","B) Ambos son idénticos","C) Los de red no usan cables","D) En los de red el usuario elige qué quiere hacer; los distribuidos son transparentes","E) Los distribuidos solo funcionan con un usuario"],r:3,a:"En los de red se elige implícitamente qué hacer; los distribuidos son transparentes para el usuario."},
{n:560,p:"¿Qué conceptos aparecen en la cuarta generación además de la conectividad?",o:["A) Tarjetas perforadas y spool","B) Válvulas y código binario","C) JCL e IOCS","D) Cintas y buffers","E) Máquina virtual y sistemas de gestión de bases de datos"],r:4,a:"Aparecen el concepto de máquina virtual y el uso de sistemas de gestión de bases de datos."},
{n:561,p:"En un sistema operativo de red, ¿qué ocurre?",o:["A) Cada computador tiene su propia copia del SO y el usuario sabe que hay varias máquinas","B) Existe una sola copia del SO para toda la red","C) La red es transparente al usuario","D) Los procesos migran entre nodos","E) No se pueden transferir archivos"],r:0,a:"En los SO de red cada computador tiene su copia y los usuarios se conectan explícitamente a máquinas remotas."},
{n:562,p:"¿Qué caracteriza a un sistema operativo distribuido?",o:["A) Cada computador funciona de forma independiente","B) Integración real de recursos: la red es transparente y una tarea puede ejecutarse en varios nodos","C) El usuario elige a qué máquina conectarse","D) Solo funciona con un procesador","E) No admite tolerancia a fallas"],r:1,a:"Existe integración real de recursos, migración de procesos y mejor tolerancia a fallas."},
{n:563,p:"¿Qué organismo desarrolló el modelo OSI según el documento?",o:["A) IEEE","B) MIT","C) ISO","D) DARPA","E) IETF"],r:2,a:"El modelo OSI fue desarrollado por ISO."},
{n:564,p:"¿Qué estándar de sistemas operativos abiertos corresponde a IEEE 1003.1?",o:["A) SVID","B) X/Open","C) OSF","D) POSIX","E) X Windows"],r:3,a:"POSIX es el estándar IEEE 1003.1."},
{n:565,p:"¿Qué estándar de interfaces de usuario abiertos fue desarrollado por el MIT?",o:["A) POSIX","B) SVID","C) OSI","D) X/Open","E) X Windows"],r:4,a:"X Windows fue desarrollado por el MIT."},
{n:566,p:"¿Qué debe lograr cada manejador del sistema operativo?",o:["A) Controlar los recursos, hacer cumplir las políticas de asignación, asignar y recuperar el recurso","B) Solo asignar recursos","C) Compilar programas","D) Diseñar interfaces","E) Transferir archivos"],r:0,a:"El SO consiste en manejadores que controlan, hacen cumplir políticas, asignan y recuperan el recurso."},
{n:567,p:"¿Cuál es una tendencia futura de los sistemas operativos señalada en el documento?",o:["A) Eliminación de las interfaces gráficas","B) Explotación del proceso en paralelo y de forma concurrente","C) Regreso al procesamiento en serie","D) Abandono de la arquitectura cliente-servidor","E) Uso exclusivo de tarjetas perforadas"],r:1,a:"Se prevé potenciar el proceso en paralelo y concurrente y la arquitectura cliente-servidor."},
{n:568,p:"¿Cómo es el procesamiento en serie?",o:["A) Un procesamiento simultáneo de varios procesos","B) Un procesamiento en lotes","C) Un procesamiento secuencial de todos los procesos, lento y poco práctico","D) Un procesamiento interactivo","E) Un procesamiento en tiempo real"],r:2,a:"Es secuencial, lento y poco práctico."},
{n:569,p:"¿Cuál es la desventaja del procesamiento por lotes?",o:["A) Alto costo de los terminales","B) Ejecuta varios programas a la vez","C) Exige conexión a Internet","D) Pérdida de interactividad con el usuario","E) Requiere sensores"],r:3,a:"Los trabajos se agrupan por lotes y la máquina ejecuta el lote completo, perdiendo interactividad."},
{n:570,p:"¿Qué parte del SO permite la multiprogramación?",o:["A) El intérprete de comandos","B) El explorador de archivos","C) El compilador","D) El buffer","E) El kernel"],r:4,a:"La sección que permite la multiprogramación se denomina kernel."},
{n:571,p:"¿Para qué se desarrollaron los sistemas interactivos (hacia 1962)?",o:["A) Para que cada usuario operara con un terminal y la CPU estuviera menos ociosa","B) Para procesar trabajos por lotes","C) Para eliminar los terminales","D) Para trabajar solo con sensores","E) Para ejecutar un único programa"],r:0,a:"Permitieron que una misma máquina atendiera a más de un usuario, haciendo más eficiente el uso de la CPU."},
{n:572,p:"¿Qué es una interrupción?",o:["A) Un error del compilador","B) Un evento interno o externo del hardware que suspende la ejecución del programa","C) Un tipo de archivo","D) Un protocolo de red","E) Un comando del usuario"],r:1,a:"Una interrupción es un evento del hardware que causa que se suspenda la ejecución del programa."},
{n:573,p:"¿Qué significa ISR?",o:["A) Sistema de Respuesta Inmediata","B) Interfaz de Servicio Remoto","C) Rutina de Servicio de Interrupción","D) Registro de Servicio Integrado","E) Ruta de Salida de Información"],r:2,a:"Cuando ocurre una interrupción el procesador va a la ISR (Interrupt Service Routine)."},
{n:574,p:"En un sistema de tiempo real, ¿qué se ejecuta al frente (foreground)?",o:["A) El resto del programa","B) Las tareas de menor prioridad","C) El compilador","D) Las interrupciones","E) El buffer"],r:3,a:"Las interrupciones corren al frente y el resto del programa al fondo (background)."},
{n:575,p:"¿Qué es un cambio de contexto?",o:["A) El cambio de un usuario a otro","B) El cambio de sistema operativo","C) La instalación de un controlador","D) El paso de modo usuario a supervisor","E) Cuando una tarea es suspendida y otra comienza o continúa, guardando pila y registros"],r:4,a:"Se almacena el contexto de la tarea (pila y registros) para reanudarla después."},
{n:576,p:"¿Qué es un sistema distribuido según la clasificación del documento?",o:["A) Sistemas multiprocesador conectados por una red, formando un único sistema","B) Un sistema de un solo usuario","C) Un sistema por lotes","D) Un sistema de tarjeta inteligente","E) Un sistema monoproceso"],r:0,a:"Son sistemas multiprocesador conectados entre sí por una red, siendo el conjunto global un único sistema."},
{n:577,p:"¿Cómo se distinguen los mainframes de las PC?",o:["A) Por su pequeño tamaño","B) Por su gran capacidad de E/S","C) Por su bajo costo","D) Por usar un solo procesador","E) Por no tener sistema operativo"],r:1,a:"Los mainframes son computadoras gigantes con gran capacidad de E/S."},
{n:578,p:"¿Qué tres tipos de servicios ofrecen los sistemas operativos de mainframe?",o:["A) Interactivo, distribuido y de red","B) Monousuario, multiusuario y multiproceso","C) Por lotes, procesamiento de transacciones y tiempo compartido","D) Embebido, móvil y de tarjeta","E) Serie, paralelo y mixto"],r:2,a:"Los SO para mainframe ofrecen servicios por lotes, de transacciones y de tiempo compartido."},
{n:579,p:"¿Qué ejemplo corresponde al procesamiento por lotes en mainframes?",o:["A) Las reservas de pasajes aéreos","B) La consulta a una base de datos grande","C) Un videojuego","D) Los informes de ventas de una cadena de tiendas","E) Un robot de soldadura"],r:3,a:"Un sistema por lotes procesa trabajos rutinarios sin usuario interactivo presente."},
{n:580,p:"¿Qué ejemplo corresponde al procesamiento de transacciones?",o:["A) Informes de ventas","B) Cálculo de nóminas mensuales","C) Consulta de una base de datos grande","D) Control de una fábrica","E) Reservas de pasajes aéreos"],r:4,a:"Los procesadores de transacciones manejan numerosas solicitudes pequeñas, como reservas aéreas."},
{n:581,p:"¿Qué permiten los sistemas de tiempo compartido en un mainframe?",o:["A) Que múltiples usuarios remotos ejecuten trabajos simultáneamente","B) Procesar un solo trabajo a la vez","C) Trabajar sin conexión","D) Eliminar las bases de datos","E) Operar sin terminales"],r:0,a:"Permiten a múltiples usuarios remotos ejecutar trabajos de forma simultánea, por ejemplo una consulta a una base de datos grande."},
{n:582,p:"¿Cuáles son ejemplos de sistemas operativos de servidor?",o:["A) Windows 95, Windows 98 y Millenium","B) Windows Server, Linux y Unix","C) PalmOS y Windows CE","D) Android e iOS","E) MS-DOS y Symbian"],r:1,a:"El documento cita Windows Server, Linux y Unix."},
{n:583,p:"¿Cuál es la misión de los sistemas operativos de computadoras personales?",o:["A) Procesar trabajos por lotes","B) Atender a miles de usuarios remotos","C) Presentar una buena interfaz a un solo usuario","D) Controlar sensores industriales","E) Funcionar en tarjetas inteligentes"],r:2,a:"Su misión consiste en presentar una buena interfaz a un solo usuario."},
{n:584,p:"¿Cuál es el parámetro clave en los sistemas operativos de tiempo real?",o:["A) El costo","B) El tamaño de la memoria","C) La interfaz gráfica","D) El tiempo","E) El número de usuarios"],r:3,a:"Deben cumplirse plazos estrictos; por ejemplo, un robot que suelda demasiado pronto o tarde arruina el automóvil."},
{n:585,p:"¿Cuáles son ejemplos de sistemas operativos integrados (embebidos)?",o:["A) Windows XP y Windows Vista","B) Linux y Unix","C) Windows Server y Solaris","D) MS-DOS y Mac OS","E) PalmOS y Windows CE"],r:4,a:"El documento cita PalmOS y Windows CE."},
{n:586,p:"¿Qué limitaciones tienen los sistemas integrados?",o:["A) De tamaño, memoria y consumo de electricidad","B) De seguridad y red","C) De licencias","D) De número de usuarios","E) De lenguaje de programación"],r:0,a:"Suelen tener características de tiempo real pero con limitaciones de tamaño, memoria y consumo."},
{n:587,p:"¿Qué contiene la ROM de algunas tarjetas inteligentes orientadas a Java?",o:["A) Un navegador web","B) Un intérprete de la máquina virtual de Java","C) Un sistema de archivos NTFS","D) Un compilador de C","E) Un servidor de correo"],r:1,a:"Eso significa que la ROM contiene un intérprete de la máquina virtual de Java."},
{n:588,p:"¿Qué es un sistema monousuario?",o:["A) Aquel que atiende varios usuarios","B) Aquel con varios procesadores","C) Aquel en el que solo puede trabajar un usuario con el ordenador, como MS-DOS","D) Aquel que ejecuta varios procesos","E) Aquel en tiempo real"],r:2,a:"Todos los recursos del sistema están disponibles para él en exclusiva. Ej. MS-DOS."},
{n:589,p:"¿Qué es un sistema multiusuario?",o:["A) Aquel con un solo usuario","B) Aquel con una sola tarea","C) Aquel sin red","D) Aquel donde varios usuarios ejecutan procesos distintos sobre la misma CPU compartiendo recursos","E) Aquel sin procesador"],r:3,a:"Varios usuarios comparten los recursos del sistema de forma simultánea."},
{n:590,p:"¿Cómo se llama también la monoprogramación o monotarea?",o:["A) Explotación concurrente","B) Multiproceso","C) Tiempo compartido","D) Multiusuario","E) Explotación secuencial"],r:4,a:"Solo se ejecuta un proceso y hasta que no finalice no puede iniciarse el siguiente."},
{n:591,p:"¿Qué es el multiproceso?",o:["A) Varios procesadores instalados en un mismo ordenador y utilizados simultáneamente por el S.O.","B) Un único procesador","C) Varios usuarios en una CPU","D) Varias aplicaciones en disco","E) Un sistema de un solo proceso"],r:0,a:"Se clasifica en función del número de procesadores en uso simultáneo."},
{n:592,p:"¿Qué prima en los sistemas interactivos?",o:["A) Cumplir ligaduras de tiempo estrictas","B) La satisfacción del usuario","C) El ahorro de memoria","D) El procesamiento por lotes","E) La ausencia de interfaz"],r:1,a:"En ellos el usuario interactúa directamente con la máquina; se prima su satisfacción."},
{n:593,p:"¿Qué prima en los sistemas en tiempo real?",o:["A) La interfaz gráfica","B) El número de usuarios","C) Dar la respuesta en el tiempo correcto antes que la satisfacción del usuario","D) El precio del equipo","E) La compatibilidad con Windows"],r:2,a:"Se basan en cumplir ligaduras de tiempo muy estrictas."},
{n:594,p:"¿Qué sistema operativo móvil de Google está basado en Linux?",o:["A) iOS","B) Symbian","C) Bada","D) Android","E) BlackBerry OS"],r:3,a:"Android es el SO para dispositivos móviles basado en Linux de Google."},
{n:595,p:"¿Qué empresa desarrolló el sistema operativo móvil Symbian según el documento?",o:["A) Samsung","B) Apple","C) Palm","D) Microsoft","E) Nokia"],r:4,a:"Symbian es el SO para teléfonos móviles de Nokia."},
{n:596,p:"¿A qué empresa pertenece el sistema operativo móvil Bada?",o:["A) Samsung","B) Nokia","C) Apple","D) HP","E) Google"],r:0,a:"Bada es el SO de Samsung para teléfonos móviles."},
{n:597,p:"¿Qué sistema operativo móvil era antes denominado iPhone OS?",o:["A) Android","B) iOS","C) WebOS","D) Windows Mobile","E) Symbian"],r:1,a:"iOS (antes iPhone OS) es el sistema operativo móvil de Apple."},
{n:598,p:"¿Qué es WebOS según el documento?",o:["A) SO de Samsung","B) SO de Nokia","C) SO basado en Linux de Palm, ahora de HP","D) SO de Microsoft","E) SO de BlackBerry"],r:2,a:"WebOS es un SO basado en Linux, de Palm ahora de HP."},
{n:599,p:"¿Cuáles son ejemplos de sistemas operativos para PC?",o:["A) Android, iOS y Symbian","B) PalmOS y Windows CE","C) Bada y WebOS","D) Windows, GNU/Linux, Mac OS, Unix, Solaris y Chrome OS","E) BlackBerry OS y Windows Mobile"],r:3,a:"El documento los lista como SO para PC."},
{n:600,p:"¿Sobre qué sistema funcionaba Windows 3.x?",o:["A) Windows NT","B) UNIX","C) Linux","D) OS/2","E) MS-DOS"],r:4,a:"Windows 3.x funcionaba sobre DOS; la 3.11 incluyó trabajo en red con grupos de trabajo."},
{n:601,p:"¿Qué novedad incluyó Windows 3.11?",o:["A) Trabajo en redes con grupos de trabajo","B) Arquitectura de 32 bits","C) Plug&Play","D) FAT32","E) Directorio activo"],r:0,a:"En la versión 3.11 se incluyó el trabajo en redes con grupos de trabajo."},
{n:602,p:"¿Qué caracterizó a Windows NT 3.1-4?",o:["A) Funcionaba sobre DOS","B) Primeras versiones para trabajo cliente-servidor, con problemas de compatibilidad de hardware","C) Era la versión para consumo doméstico","D) Incluía Directorio activo","E) Era el sistema móvil de Microsoft"],r:1,a:"Fueron versiones para servidores y estaciones de trabajo en empresas con muchos equipos."},
{n:603,p:"¿Qué novedades trajo Windows 95?",o:["A) FAT32 y soporte USB","B) Directorio activo","C) Arquitectura de 32 bits, Win32, Plug&Play y modo protegido","D) Interfaz táctil","E) Soporte ARM"],r:2,a:"Windows 95 comienza a usar 32 bits, desarrolla Win32, incluye Plug&Play y modo protegido."},
{n:604,p:"¿Qué novedad de sistema de archivos trajo Windows 98?",o:["A) NTFS","B) ext3","C) NFS","D) FAT32 (particiones mayores de 2 GB)","E) Ninguna"],r:3,a:"Windows 98 incorporó FAT32, soporte para DVD, AGP, FireWire y USB."},
{n:605,p:"¿Qué versión de Windows 98 es la más estable?",o:["A) Windows 98 original","B) Millenium","C) Windows 3.11","D) Windows NT 4","E) Windows 98 SE"],r:4,a:"La versión SE es la más estable e incluye conexión compartida a Internet."},
{n:606,p:"¿Cómo se describe a Windows Millenium?",o:["A) Un proyecto rápido antes de XP, con poca estabilidad","B) El sistema más estable de Microsoft","C) La base de Windows 2000","D) El sucesor de Vista","E) Una versión para servidores"],r:0,a:"Millenium fue un proyecto rápido antes de XP que proporciona poca estabilidad."},
{n:607,p:"¿Qué es Windows 2000?",o:["A) Evolución de Windows 98","B) Evolución de NT con mejores servicios de red y Plug & Play; incluye Directorio activo","C) Un sistema solo para servidores móviles","D) Un sistema basado en DOS","E) Una versión de Linux"],r:1,a:"Windows 2000 evoluciona NT e incluye Fat32, NTFS, DFS, RAID, Directorio activo, RAS, etc."},
{n:608,p:"¿Qué une Windows XP?",o:["A) Windows 3.1 y DOS","B) Windows 95 y Linux","C) Windows NT/2000 y la línea 9x, con núcleo de NT","D) Windows Vista y 7","E) Windows CE y Mobile"],r:2,a:"XP es unión de NT/2000 y 9x, con núcleo de NT."},
{n:609,p:"¿En qué años aparecieron Windows Vista y Windows 7?",o:["A) Vista en 2005 y Windows 7 en 2007","B) Vista en 2009 y Windows 7 en 2012","C) Vista en 2003 y Windows 7 en 2006","D) Vista en 2007 y Windows 7 en 2009","E) Vista en 2007 y Windows 7 en 2011"],r:3,a:"Vista apareció en 2007 y Windows 7 en 2009."},
{n:610,p:"¿Cuántas ediciones para consumidor y para empresas tiene Windows Vista?",o:["A) Dos para consumidor y tres para empresas","B) Cuatro para consumidor y una para empresas","C) Una para consumidor y cuatro para empresas","D) Tres para consumidor y tres para empresas","E) Tres para consumidor y dos para empresas"],r:4,a:"Home Basic, Home Premium y Ultimate para consumidor; Business y Enterprise para empresas."},
{n:611,p:"¿Para qué dispositivos sirve Windows CE?",o:["A) Dispositivos móviles (PDA)","B) Servidores de bases de datos","C) Mainframes","D) Estaciones de trabajo","E) Supercomputadoras"],r:0,a:"Windows CE es el SO de Microsoft para dispositivos móviles; Windows Mobile se basa en él."},
{n:612,p:"¿Cuál es una ventaja de Windows señalada en el documento?",o:["A) Es gratuito","B) Es el sistema operativo más extendido","C) Es de código abierto","D) Funciona en máquinas con pocos recursos","E) Nunca necesita parches"],r:1,a:"La mayoría de fabricantes y desarrolladores ofrecen sus productos para Windows."},
{n:613,p:"¿Cuál es un inconveniente de Windows señalado en el documento?",o:["A) Está poco extendido","B) Es difícil de instalar en cualquier equipo","C) Hay que pagar por el SO y buena parte de las aplicaciones","D) No admite aplicaciones comerciales","E) Solo funciona en servidores"],r:2,a:"Otros inconvenientes: estabilidad, parches casi diarios y mucha demanda de recursos."},
{n:614,p:"¿Qué características tiene Linux?",o:["A) Monousuario y monotarea","B) Solo funciona en Intel","C) Propietario y de pago","D) Multitarea, multiusuario, multiplataforma y multiprocesador","E) Solo para servidores"],r:3,a:"Además soporta varios sistemas de ficheros y protocolos de red como TCP/IP."},
{n:615,p:"¿Con qué licencia se distribuyen las aplicaciones libres de Linux?",o:["A) Licencia comercial","B) Licencia propietaria","C) Shareware","D) Licencia de evaluación","E) GPL"],r:4,a:"Las aplicaciones son gratuitas y libres, con licencia GPL."},
{n:616,p:"¿Cuál es una ventaja de Linux?",o:["A) Es robusto: es difícil que un fallo en una aplicación provoque la caída del sistema","B) Es el más extendido","C) Todos los programas comerciales funcionan en él","D) Requiere muchos recursos","E) Es de pago"],r:0,a:"Es libre, gratuito, seguro, robusto y funciona en máquinas con pocos recursos."},
{n:617,p:"¿Cuál es un inconveniente de Linux?",o:["A) Es costoso","B) Está menos extendido y muchos programas comerciales, como Photoshop, solo existen para Windows","C) Es poco seguro","D) No soporta redes","E) No es multiusuario"],r:1,a:"Photoshop, Dreamweaver y Corel existen solo para Windows."},
{n:618,p:"¿Qué son las distribuciones de Linux?",o:["A) Versiones del kernel de Windows","B) Un tipo de licencia","C) Organizaciones que lo distribuyen con otras aplicaciones, gratis o con costo de soporte","D) Un protocolo de red","E) Un sistema de archivos"],r:2,a:"Ejemplos: Ubuntu, Red Hat, SUSE, Debian, Fedora y CentOS."},
{n:619,p:"¿Qué es una máquina virtual?",o:["A) Un servidor físico","B) Un tipo de procesador","C) Un protocolo de red","D) Un conjunto de programas que simulan la ejecución de otros programas, incluso de otros SO","E) Un lenguaje de programación"],r:3,a:"Permite que varios SO coexistan sobre el mismo ordenador en aislamiento."},
{n:620,p:"¿Cuáles son ejemplos de software de máquinas virtuales?",o:["A) Ubuntu, Debian y Fedora","B) Symbian, Bada y WebOS","C) Photoshop y Dreamweaver","D) Windows 95 y 98","E) VMware, VirtualBox y Microsoft Virtual Server"],r:4,a:"El documento cita VmWare, VirtualBox y Microsoft Virtual Server."},
{n:621,p:"En el diagrama de capas, ¿qué capa se ubica entre la aplicación y el hardware?",o:["A) El sistema operativo","B) El usuario","C) El compilador","D) Internet","E) El firmware"],r:0,a:"Las capas son Usuario, Aplicación, Sistema Operativo y Hardware."}
];
const bancoTCP = [
{n:701,p:"¿Qué es una Intranet?",o:["A) Una red privada dentro de una organización, también llamada LAN","B) La colección de redes mundiales que usa TCP/IP","C) Una red colaborativa con proveedores y clientes","D) Una conexión remota para trabajadores móviles","E) Un enlace persistente entre oficinas remotas"],r:0,a:"Una Intranet es la red privada interna de una organización y puede llamarse LAN."},
{n:702,p:"¿Qué es una Extranet?",o:["A) Una red privada de una sola organización","B) Una red colaborativa que usa tecnologías de Internet para relaciones de confianza entre empresas","C) La red mundial de routers","D) Una LAN de una oficina","E) Un servicio de acceso remoto para móviles"],r:1,a:"Está compuesta por la Intranet corporativa y las compañías que pueden accederla."},
{n:703,p:"Una LAN de una oficina remota conectada a una red corporativa forma una:",o:["A) Intranet","B) Extranet","C) WAN","D) Internet","E) Subred"],r:2,a:"La conexión de oficinas remotas a la red corporativa forma una WAN."},
{n:704,p:"¿Qué es Internet según el documento?",o:["A) Una red privada corporativa","B) Una red de una sola oficina","C) Un protocolo de transporte","D) La colección de redes mundiales y routers que utiliza la suite TCP/IP para comunicarse","E) Un servicio de correo"],r:3,a:"Internet comprende líneas de alta velocidad entre la mayoría de los nodos."},
{n:705,p:"¿Para qué sirve la resolución de nombres?",o:["A) Para fragmentar paquetes","B) Para calcular la máscara de red","C) Para cifrar los datos","D) Para asignar puertos","E) Para recordar nombres de servidores en lugar de direcciones numéricas"],r:4,a:"Ofrece a los usuarios una manera sencilla de identificar servidores por nombre."},
{n:706,p:"¿Qué agencia financió el proyecto del que surge TCP/IP en 1969?",o:["A) DARPA","B) ISO","C) IEEE","D) IETF","E) ANSI"],r:0,a:"DARPA (Agencia de Proyectos Avanzados de Investigación en Defensa) fundó el proyecto ARPANET."},
{n:707,p:"¿En qué año ARPANET fue operativa?",o:["A) 1969","B) 1975","C) 1983","D) 1990","E) 1984"],r:1,a:"El proyecto empezó en 1969 y ARPANET fue operativa en 1975."},
{n:708,p:"¿En qué año se adoptó TCP/IP como estándar de ARPANET?",o:["A) 1969","B) 1975","C) 1983","D) 1990","E) 1974"],r:2,a:"En 1983 se adoptó el nuevo conjunto de protocolos y todos los nodos empezaron a utilizarlo."},
{n:709,p:"¿Cómo se llaman las redes en que los datos se fragmentan en pequeñas unidades enviadas al nodo destino y reensambladas allí?",o:["A) Redes de circuitos dedicados","B) Redes de difusión","C) Redes de transferencia de archivos","D) Redes de intercambio de paquetes","E) Redes de tarjeta perforada"],r:3,a:"Los datos se fragmentan en paquetes y se reensamblan en el destino."},
{n:710,p:"En la analogía del Servicio Postal, ¿qué función cumple el protocolo IP?",o:["A) El camión que lleva el correo","B) La numeración de las hojas","C) El buzón","D) El cartero","E) El sobre con el domicilio"],r:4,a:"El protocolo IP tiene la función del sobre donde se envía una carta."},
{n:711,p:"En la analogía del Servicio Postal, ¿a qué equivalen los routers?",o:["A) A las sucursales postales","B) A los camiones y aviones","C) A los sobres","D) A los timbres postales","E) A los buzones"],r:0,a:"Los routers deciden cómo dirigir los paquetes, como una oficina postal con los sobres."},
{n:712,p:"¿Qué hace un router al recibir un paquete?",o:["A) Reserva un enlace exclusivo hasta el destino","B) Mira el destino y decide el enlace más apropiado (siguiente salto)","C) Descarta todos los paquetes largos","D) Convierte el paquete en un segmento TCP","E) Reenvía el paquete al origen"],r:1,a:"Cada router solo necesita conocer sus conexiones y el mejor «siguiente salto»."},
{n:713,p:"¿Cuántas cifras tiene una dirección IP en notación de puntos y cuál es su valor máximo por cifra?",o:["A) Seis números, cada uno menor que 256","B) Cuatro números, cada uno menor que 128","C) Cuatro números, cada uno menor que 256","D) Ocho números, cada uno menor que 16","E) Tres números, cada uno menor que 1000"],r:2,a:"Se escribe como 192.112.36.5, separadas por puntos."},
{n:714,p:"¿Qué indican los primeros números de la dirección IP a los ruteadores?",o:["A) El equipo que recibe la información","B) El tamaño del paquete","C) El protocolo de transporte","D) La red a la que pertenece el paquete","E) El puerto de la aplicación"],r:3,a:"Los primeros números indican la red y los últimos el equipo anfitrión."},
{n:715,p:"¿Entre qué valores se encuentra normalmente la cantidad de información de un paquete?",o:["A) Entre 1 y 64 caracteres","B) Entre 1500 y 65 535 caracteres","C) Entre 1 y 128 000 caracteres","D) Exactamente 512 caracteres","E) Entre 1 y aproximadamente 1500 caracteres"],r:4,a:"Esto evita que un usuario monopolice la red."},
{n:716,p:"¿Qué problemas resuelve el protocolo TCP?",o:["A) Transferencias grandes, pérdidas o daños de paquetes y llegada en desorden","B) El cálculo de la máscara de red","C) La asignación de direcciones MAC","D) La resolución de nombres","E) El enrutamiento de paquetes"],r:0,a:"TCP divide en segmentos, enumera, verifica y solicita retransmisión."},
{n:717,p:"¿Qué hace TCP con la información que se desea enviar?",o:["A) La envía completa en un solo paquete","B) La divide en segmentos y numera cada uno","C) La convierte en datagramas UDP","D) La cifra con un checksum","E) La guarda en una caché ARP"],r:1,a:"La numeración permite al receptor verificar y ordenar la información."},
{n:718,p:"¿Para qué sirve el número de verificación (checksum) de TCP?",o:["A) Para asignar puertos","B) Para numerar los segmentos","C) Para que el receptor detecte errores en el paquete transmitido","D) Para fragmentar el mensaje","E) Para obtener la dirección MAC"],r:2,a:"Si no coincide con el calculado, el receptor descarta el paquete y solicita retransmisión."},
{n:719,p:"¿Qué hace el receptor TCP si un sobre (segmento) se pierde?",o:["A) Lo ignora","B) Cierra la aplicación","C) Cambia de protocolo a UDP","D) Solicita su retransmisión al emisor","E) Envía un broadcast ARP"],r:3,a:"Si algún sobre se pierde, el receptor solicita su retransmisión."},
{n:720,p:"¿Por qué UDP es más sencillo que TCP?",o:["A) Garantiza la entrega y el orden","B) Establece una conexión previa","C) Numera los segmentos","D) Retransmite los paquetes perdidos","E) No se preocupa por pérdidas ni por el orden de la información"],r:4,a:"UDP es útil para mensajes cortos que se reenvían solo si no hay respuesta a tiempo."},
{n:721,p:"¿Cuáles son las tres aplicaciones «básicas» mencionadas?",o:["A) Sesión de trabajo remota, transferencia de archivos y correo electrónico","B) Navegación web, chat y video","C) Impresión, juegos y ofimática","D) DNS, DHCP y NAT","E) Telnet, ping y tracert"],r:0,a:"Se ejemplifican con Telnet, FTP y otros protocolos."},
{n:722,p:"¿Qué significan las siglas TCP/IP?",o:["A) Protocolo de Transferencia de Comunicaciones / Protocolo de Interconexión","B) Protocolo de Control de Transmisiones / Protocolo Internet","C) Protocolo de Control de Terminales / Protocolo Interno","D) Transmisión Central de Paquetes / Interred de Paquetes","E) Protocolo de Transporte Confiable / Protocolo Interactivo"],r:1,a:"TCP/IP son los dos protocolos más importantes de la suite, definidos en 1982."},
{n:723,p:"¿Qué es TCP/IP?",o:["A) Un sistema operativo de red","B) Un lenguaje de programación","C) Un conjunto de protocolos que comunica redes con diversas arquitecturas y sistemas operativos","D) Un tipo de cable","E) Una marca de hardware"],r:2,a:"Es un sistema abierto con estándares de comunicación y reglas para conectar redes y encaminar el tráfico."},
{n:724,p:"¿Qué evento de TCP/IP ocurrió en 1973?",o:["A) Se dieron a conocer las especificaciones de Telnet","B) Se introdujo el DNS","C) TCP se dio a luz como Programa de Control de Transmisiones","D) Se introdujo el Protocolo de Transferencia de Archivos (FTP)","E) ARPANET migró a TCP/IP"],r:3,a:"FTP en 1973; Telnet en 1972; TCP en 1974; DNS en 1984."},
{n:725,p:"¿Qué evento ocurrió en 1984?",o:["A) ARPANET migró a TCP/IP","B) Se publicó el estándar IP","C) Se introdujo FTP","D) Se definió Telnet","E) Se introdujo el Sistema de Nombres de Dominio (DNS)"],r:4,a:"El DNS fue introducido en 1984."},
{n:726,p:"¿Cuál es la organización más importante en la regulación de TCP/IP?",o:["A) ISOC (Internet Society)","B) IEEE","C) ANSI","D) DARPA","E) W3C"],r:0,a:"ISOC aprueba las tecnologías aplicadas a su desarrollo; la integran IAB, IANA, IRTF e IETF."},
{n:727,p:"¿Qué organismo de la ISOC aprueba los RFC?",o:["A) IANA","B) IAB (Internet Architecture Board)","C) IRTF","D) IETF","E) ISO"],r:1,a:"Al IAB le corresponde la aprobación de los RFC."},
{n:728,p:"¿Qué son los RFC?",o:["A) Protocolos de transporte","B) Tipos de cable","C) Documentos oficiales del IETF que definen los estándares de TCP/IP","D) Direcciones reservadas","E) Modelos de red"],r:2,a:"Request for Comments: medio para que la comunidad de Internet se comunique y concilie."},
{n:729,p:"Cuando un RFC se modifica, ¿qué ocurre?",o:["A) Se actualiza el mismo número","B) Se elimina de Internet","C) Se archiva sin sustituto","D) Se publica un nuevo RFC con un número nuevo","E) Cambia su categoría a recomendado"],r:3,a:"Un documento RFC nunca es actualizado."},
{n:730,p:"¿Cuáles son los tres niveles de maduración de un estándar RFC?",o:["A) Requerido, Recomendado y Electivo","B) Borrador, Prueba y Publicación","C) Local, Regional y Global","D) Experimental, Informativo e Histórico","E) Propuesta de Estándar, Borrador Estándar e Internet Estándar"],r:4,a:"Siguen un proceso de desarrollo, prueba y aceptación."},
{n:731,p:"¿Qué categorías tienen los RFC?",o:["A) Requeridos, Recomendados, Electivos, Uso limitado y No recomendados","B) Propuesta, Borrador e Internet Estándar","C) Tutorial, Técnico y Político","D) Alto, Medio y Bajo","E) Públicos y privados"],r:0,a:"Son las cinco categorías generales de clasificación."},
{n:732,p:"¿Qué protocolo define el RFC 791?",o:["A) ICMP","B) IP (Protocolo Internet)","C) TCP","D) UDP","E) FTP"],r:1,a:"RFC 791: IP."},
{n:733,p:"¿Qué protocolo define el RFC 792?",o:["A) IP","B) TCP","C) ICMP","D) UDP","E) SMTP"],r:2,a:"RFC 792: Protocolo de mensajes de control de Internet."},
{n:734,p:"¿Qué protocolo define el RFC 793?",o:["A) UDP","B) IP","C) ICMP","D) TCP","E) Telnet"],r:3,a:"RFC 793: Protocolo de control de transmisiones."},
{n:735,p:"¿Qué protocolo define el RFC 768?",o:["A) TCP","B) IP","C) FTP","D) DNS","E) UDP"],r:4,a:"RFC 768: Protocolo de datagrama de usuario."},
{n:736,p:"¿Qué protocolo define el RFC 959?",o:["A) FTP","B) Telnet","C) SMTP","D) DNS","E) UDP"],r:0,a:"RFC 959: Protocolo de transferencia de archivos."},
{n:737,p:"¿Qué protocolo define el RFC 821?",o:["A) FTP","B) SMTP","C) Telnet","D) DNS","E) ICMP"],r:1,a:"RFC 821: Protocolo simple de transferencia de correo."},
{n:738,p:"¿Qué protocolo define el RFC 854?",o:["A) FTP","B) SMTP","C) Telnet","D) IP","E) UDP"],r:2,a:"RFC 854: Protocolo de Telnet."},
{n:739,p:"¿Qué RFC tratan sobre el DNS?",o:["A) RFC 791 y RFC 792","B) RFC 821 y RFC 822","C) RFC 793 y RFC 768","D) RFC 1034 y RFC 1035","E) RFC 950 y RFC 1117"],r:3,a:"RFC 1034 (conceptos y facilidades) y RFC 1035 (implementación y especificaciones)."},
{n:740,p:"¿En cuántas capas se divide TCP/IP y qué modelo definen?",o:["A) Siete capas; Modelo OSI","B) Tres capas; Modelo ISO","C) Cinco capas; Modelo IEEE","D) Cuatro capas; Modelo OSI","E) Cuatro capas; Modelo DoD"],r:4,a:"TCP/IP tiene cuatro capas que definen el Modelo DoD."},
{n:741,p:"¿Cuál es la capa más baja del modelo DoD?",o:["A) Interfaz de Redes (Acceso a redes)","B) Internet","C) Transporte","D) Aplicación","E) Enlace de datos"],r:0,a:"Es la base del modelo."},
{n:742,p:"¿De qué es responsable la capa Interfaz de Redes?",o:["A) Del enrutamiento de paquetes","B) De poner los frames dentro y fuera de los cables y transmitir datagramas por la capa física","C) De la entrega confiable de datos","D) De la interfaz con el usuario","E) De la resolución de nombres"],r:1,a:"Agrega CRC y preamble al enviar; al recibir los descarta y revisa la dirección MAC."},
{n:743,p:"¿Qué es el CRC?",o:["A) Un identificador de red","B) Un protocolo de enrutamiento","C) Un cálculo matemático (Cyclic Redundancy Check) para verificar que el paquete no esté corrupto","D) Una dirección física","E) Un número de puerto"],r:2,a:"Se añade al paquete y se recalcula en el destino."},
{n:744,p:"¿Qué es el preamble?",o:["A) Una dirección MAC","B) Un tipo de cable","C) Un checksum","D) Una secuencia de bits que identifica el inicio del paquete","E) Un número de secuencia"],r:3,a:"Es la secuencia de bits que identifica el inicio del paquete."},
{n:745,p:"¿Qué es la MTU?",o:["A) La unidad mínima de transmisión","B) El número máximo de hosts","C) El tiempo de vida de un paquete","D) La máscara de transmisión universal","E) La unidad máxima de transferencia: tamaño máximo de trama de cada medio físico"],r:4,a:"Cada medio físico tiene un tamaño máximo de trama que no se puede superar."},
{n:746,p:"¿Cómo se calcula el MSS en una conexión TCP?",o:["A) MTU menos 40 bytes de encabezados IP y TCP, tomando el menor de los dos hosts","B) MTU más 40 bytes","C) MTU dividido entre 2","D) MTU menos 14 bytes de Ethernet","E) MTU multiplicado por 4"],r:0,a:"Los hosts intercambian su MSS y usan el menor."},
{n:747,p:"¿Qué hace la capa de Internet del modelo DoD?",o:["A) Entrega los datos a la aplicación","B) Provee comunicación host-to-host y encapsula en datagramas con algoritmos de ruteo","C) Transmite bits por el cable","D) Resuelve nombres de dominio","E) Proporciona la interfaz de usuario"],r:1,a:"Es la segunda capa; ahí se carga el ruteo estático o dinámico."},
{n:748,p:"¿Para qué se usa ARP?",o:["A) Para enviar mensajes de error","B) Para rutear paquetes entre redes","C) Para obtener la dirección física de hosts de la misma red física","D) Para establecer conexiones fiables","E) Para transferir archivos"],r:2,a:"ARP resuelve direcciones IP a direcciones físicas (MAC)."},
{n:749,p:"¿Qué protocolo envía mensajes y reportes de error de los paquetes?",o:["A) ARP","B) IP","C) UDP","D) ICMP","E) TCP"],r:3,a:"ICMP es el protocolo de mensajes de control de Internet."},
{n:750,p:"¿Qué protocolo es el principal responsable de la dirección y ruteo de paquetes entre hosts y redes?",o:["A) ARP","B) ICMP","C) TCP","D) UDP","E) IP"],r:4,a:"IP agrega su encabezado con las direcciones origen y destino, checksum y TTL."},
{n:751,p:"¿Qué ocurre si el host destino está en el mismo segmento de red?",o:["A) IP envía el paquete directamente al host","B) IP lo envía siempre al router","C) Se descarta el paquete","D) Se convierte en UDP","E) Se envía un ICMP"],r:0,a:"Si no está en el mismo segmento, el paquete se envía al router."},
