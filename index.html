        .option-btn.incorrect { background: #991b1b !important; border-color: #ef4444 !important; }
        .feedback { text-align: center; font-weight: bold; margin-top: 15px; min-height: 20px; font-size: 16px; }
        .feedback.success { color: #10b981; }
        .feedback.error { color: #f87171; }

        .analysis-title { color: #3b82f6; font-weight: bold; margin-bottom: 6px; font-size: 15px; }
        .correct-answer-alert { color: #f87171; font-weight: bold; margin-bottom: 8px; font-size: 14px; background: #451a03; padding: 6px 10px; border-radius: 6px; border: 1px solid #78350f; display: inline-block; }
        .next-btn { background: #3b82f6; color: white; border: none; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: bold; margin-top: 15px; cursor: pointer; display: none; text-align: center; }
        .next-btn:hover { background: #2563eb; }
        .start-btn {

        .restart-btn {

        .resultado-final {

            background: #f5f7ff;
            border: 2px solid #d9def7;
            text-align: center;

        .screen { width:100%; }

        .inicio-header { text-align:center; margin-bottom:24px; }
        .inicio-header h1 { font-size:30px; margin-bottom:8px; }

        .inicio-actions { max-width:680px; margin:0 auto; }

        .selection-status { min-height:22px; text-align:center; color:#cbd5e1; font-size:13px; margin-bottom:8px; }

        .back-btn { border:1px solid #475569; background:#0f172a; color:#e2e8f0; border-radius:10px; padding:9px 12px; cursor:pointer; font-weight:700; }

    </style>
</head>

</div>

Ética militar","Capacidades militares"],"r":0,"exp":""},{"p":"¿Qué tema corresponde al Capítulo 6?","o":["El Ejército del futuro","La defensa nacional","La profesión militar","El orden interno","El glosario"],"r":0,"exp":""},{"p":"¿Qué doctrina sustenta el Concepto Fundamental de Empleo mencionado en el prólogo?","o":["La doctrina Wiracocha.","La doctrina Ottawa.","La doctrina Ciber.","La doctrina Antártica.","La doctrina Multisectorial."],"r":0,"exp":""},{"p":"¿Qué publicación constituye la piedra angular de la doctrina Wiracocha según el prólogo?","o":["El Manual Directriz 1-0.","El Manual Directriz 2-0.","El Manual Directriz 3-0.","El reglamento disciplinario.","El manual de logística."],"r":0,"exp":""}];
let preguntas = [];
let idxActual = 0;
let puntaje = 0;
let racha = 0;
let mejorRacha = 0;
let correctas = 0;
let incorrectas = 0;
let bloqueado = false;
let iniciado = false;
let modoActual = "sinonimos";
let bancoActual = bancoPreguntas;

const txtProgreso = document.getElementById("txt-progreso");
const txtPuntaje = document.getElementById("txt-puntaje");
const txtRacha = document.getElementById("txt-racha");
const preguntaTexto = document.getElementById("pregunta-texto");
const listaOpciones = document.getElementById("lista-opciones");
const feedbackTexto = document.getElementById("feedback-texto");
const contenedorAnalisis = document.getElementById("contenedor-analisis");
const alertaRespuestaCorrecta = document.getElementById("alerta-respuesta-correcta");
const analisisTexto = document.getElementById("analisis-texto");
const btnSiguiente = document.getElementById("btn-siguiente");
const btnIniciar = document.getElementById("btn-iniciar");
const barraProgreso = document.getElementById("barra-progreso");
const tituloTest = document.getElementById("titulo-test");
const sourceNote = document.getElementById("source-note");
const modoSinonimos = document.getElementById("modo-sinonimos");
const modoManual = document.getElementById("modo-manual");
const inicioScreen = document.getElementById("inicio-screen");
const quizScreen = document.getElementById("quiz-screen");
const selectionStatus = document.getElementById("selection-status");

function mezclar(array) {
    const copia = [...array];
    for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
    }
    return copia;
}

function prepararPregunta(item) {
    const opciones = item.o.map((texto, indiceOriginal) => ({
        texto: String(texto).replace(/^\s*[A-E]\)\s*/i, ""),
        correcta: indiceOriginal === item.r
    }));
    const mezcladas = mezclar(opciones);
    return {
        ...item,
        o: mezcladas.map(x => x.texto),
        r: mezcladas.findIndex(x => x.correcta)
    };
}

function seleccionarModo(modo) {
    if (iniciado) return;
    modoActual = modo;
    bancoActual = modo === "manual" ? bancoManual : bancoPreguntas;
    modoSinonimos.classList.toggle("active", modo === "sinonimos");
    modoManual.classList.toggle("active", modo === "manual");

    if (modo === "manual") {
        tituloTest.textContent = "📘 Test Manual MD 1-0";
        selectionStatus.innerHTML = "Modalidad seleccionada: <strong>Manual MD 1-0</strong>";
        sourceNote.textContent = "Preguntas basadas en el Manual Directriz MD 1-0, Ejército del Perú, edición 2021.";
        btnIniciar.textContent = "▶️ Comenzar Test del Manual";
    } else {
        tituloTest.textContent = "🔤 Test de Sinónimos";
        selectionStatus.innerHTML = "Modalidad seleccionada: <strong>Sinónimos</strong>";
        sourceNote.textContent = "Banco de 250 preguntas de sinónimos.";
        btnIniciar.textContent = "▶️ Comenzar Test de Sinónimos";
    }
}

function iniciarTest() {
    preguntas = mezclar(bancoActual).slice(0, Math.min(50, bancoActual.length)).map(prepararPregunta);
    idxActual = 0;
    puntaje = 0;
    racha = 0;
    mejorRacha = 0;
    correctas = 0;
    incorrectas = 0;
    bloqueado = false;
    iniciado = true;

    inicioScreen.classList.add("hidden");
    quizScreen.classList.remove("hidden");
    txtPuntaje.textContent = "✨ Puntos: 0";
    txtRacha.textContent = "🔥 Racha: 0";
    btnSiguiente.style.display = "none";
    cargarPregunta();
}

function cargarPregunta() {
    if (!iniciado) return;
    if (idxActual >= preguntas.length) return mostrarResultado();

    bloqueado = false;
    feedbackTexto.className = "feedback";
    feedbackTexto.textContent = "";
    alertaRespuestaCorrecta.style.display = "none";
    contenedorAnalisis.style.display = "none";
    btnSiguiente.style.display = "none";
    btnSiguiente.textContent = "➡️ Siguiente pregunta";
    listaOpciones.innerHTML = "";

    const item = preguntas[idxActual];
    txtProgreso.textContent = `Pregunta: ${idxActual + 1}/${preguntas.length}`;
    barraProgreso.style.width = `${(idxActual / preguntas.length) * 100}%`;

    // No se muestra la numeración original del banco.
    preguntaTexto.textContent = item.p;

    item.o.forEach((opcion, index) => {
        const boton = document.createElement("button");
        boton.className = "option-btn";
        boton.innerHTML = `<strong>${String.fromCharCode(65 + index)})</strong> ${opcion}`;
        boton.onclick = () => verificarRespuesta(index, boton);
        listaOpciones.appendChild(boton);
    });
}

function mostrarResultado() {
    const total = preguntas.length;
    const porcentaje = total ? Math.round((correctas / total) * 100) : 0;
    const nota = total ? ((correctas / total) * 20).toFixed(1) : "0.0";
    const nivel = porcentaje >= 90 ? "🏆 Excelente desempeño" :
                  porcentaje >= 70 ? "👏 Muy buen resultado" :
                  porcentaje >= 50 ? "📚 Buen comienzo, sigue practicando" :
                  "💪 Sigue practicando y mejorarás";

    txtProgreso.textContent = `🏁 Test terminado: ${total}/${total}`;
    barraProgreso.style.width = "100%";
    preguntaTexto.textContent = modoActual === "manual" ? "🎉 ¡Completaste el test del Manual MD 1-0!" : "🎉 ¡Completaste el test de sinónimos!";
    listaOpciones.innerHTML = "";
    contenedorAnalisis.style.display = "none";
    feedbackTexto.className = "feedback success";
    feedbackTexto.innerHTML = `
        <div class="resultado-final">
            <h2>📊 Resultado final</h2>
            <div class="nota-grande">${nota}/20</div>
            <div class="subtitulo">${modoActual === "manual" ? "Manual MD 1-0 • edición 2021" : "Test de Sinónimos"}</div>
            <div class="result-bar"><div style="width:${porcentaje}%"></div></div>
            <p><strong>${porcentaje}% de aciertos</strong></p>
            <div class="result-grid">
                <div class="result-card"><strong>${correctas}</strong><span>✅ Correctas</span></div>
                <div class="result-card"><strong>${incorrectas}</strong><span>❌ Incorrectas</span></div>
                <div class="result-card"><strong>${mejorRacha}</strong><span>🔥 Mejor racha</span></div>
                <div class="result-card"><strong>${puntaje}</strong><span>✨ Puntos</span></div>
            </div>
            <div class="result-message">${nivel}</div>
        </div>`;

    btnSiguiente.style.display = "block";
    btnSiguiente.textContent = "🔄 Hacer otro test";
    btnSiguiente.onclick = reiniciarSeleccion;
}

function reiniciarSeleccion() {
    iniciado = false;
    inicioScreen.classList.remove("hidden");
    quizScreen.classList.add("hidden");
    listaOpciones.innerHTML = "";
    feedbackTexto.textContent = "";
    feedbackTexto.className = "feedback";
    contenedorAnalisis.style.display = "none";
    btnSiguiente.style.display = "none";
    txtProgreso.textContent = "Pregunta: 0/50";
    txtPuntaje.textContent = "✨ Puntos: 0";
    txtRacha.textContent = "🔥 Racha: 0";
    barraProgreso.style.width = "0%";
    seleccionarModo(modoActual);
}

function volverAlInicio() {
    if (confirm("¿Quieres salir del test y volver a elegir la modalidad?")) {
        reiniciarSeleccion();
    }
}

function verificarRespuesta(indiceSeleccionado, botonPresionado) {
    if (bloqueado) return;
    bloqueado = true;

    const item = preguntas[idxActual];
    const botones = Array.from(listaOpciones.getElementsByClassName("option-btn"));
    botones.forEach(boton => boton.disabled = true);

    if (indiceSeleccionado === item.r) {
        botonPresionado.classList.add("correct");
        feedbackTexto.textContent = "✨ ¡Correcto!";
        feedbackTexto.className = "feedback success";
        puntaje += 10;
        correctas++;
        racha++;
        mejorRacha = Math.max(mejorRacha, racha);
        alertaRespuestaCorrecta.style.display = "none";
    } else {
        botonPresionado.classList.add("incorrect");
        if (botones[item.r]) botones[item.r].classList.add("correct");
        feedbackTexto.textContent = "❌ Respuesta incorrecta.";
        feedbackTexto.className = "feedback error";
        incorrectas++;
        racha = 0;
        alertaRespuestaCorrecta.style.display = "inline-block";
        alertaRespuestaCorrecta.textContent = `La respuesta correcta era: ${String.fromCharCode(65 + item.r)}) ${item.o[item.r]}`;
    }

    txtPuntaje.textContent = `✨ Puntos: ${puntaje}`;
    txtRacha.textContent = `🔥 Racha: ${racha}`;
    analisisTexto.textContent = item.a || item.exp || "Respuesta basada en el contenido del banco.";
    contenedorAnalisis.style.display = "block";
    barraProgreso.style.width = `${((idxActual + 1) / preguntas.length) * 100}%`;
    btnSiguiente.style.display = "block";
    btnSiguiente.textContent = idxActual === preguntas.length - 1 ? "📊 Ver resultado" : "➡️ Siguiente pregunta";
    btnSiguiente.onclick = avanzarPregunta;
}

function avanzarPregunta() {
    if (!bloqueado) return;
    idxActual++;
    cargarPregunta();
}

seleccionarModo("sinonimos");
</script>
