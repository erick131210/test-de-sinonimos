<!DOCTYPE html>

<head>

    <title>Ultra-Test Táctil de Sinónimos</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .quiz-container { background: white; width: 100%; max-width: 500px; border-radius: 20px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 8px solid #3b82f6; }
        h1 { font-size: 22px; text-align: center; color: #1e3a8a; margin-top: 0; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #6b7280; font-size: 14px; margin-bottom: 20px; }
        .stats-bar { display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; color: #374151; margin-bottom: 10px; }
        .progress-container { background: #e5e7eb; height: 12px; border-radius: 6px; overflow: hidden; margin-bottom: 25px; }
        .progress-bar { background: #3b82f6; width: 0%; height: 100%; transition: width 0.3s ease; }
        .question-box { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 15px; padding: 20px; font-size: 18px; font-weight: 700; text-align: center; color: #0f172a; margin-bottom: 20px; }
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: white; border: 2px solid #cbd5e1; border-radius: 12px; padding: 16px; font-size: 16px; font-weight: 600; text-align: left; color: #334155; cursor: pointer; transition: all 0.2s ease; -webkit-tap-highlight-color: transparent; }
        .option-btn:active { transform: scale(0.98); }
        .option-btn.correct { background: #d1fae5 !important; border-color: #10b981 !important; color: #065f46 !important; }
        .option-btn.incorrect { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b !important; }
        .feedback { text-align: center; font-weight: bold; font-size: 16px; margin-top: 15px; min-height: 24px; }
        .result-screen { text-align: center; display: none; }
        .result-title { font-size: 26px; font-weight: bold; color: #10b981; margin-bottom: 15px; }
        .rango-box { background: #eff6ff; border: 2px dashed #3b82f6; padding: 15px; border-radius: 12px; font-size: 18px; font-weight: bold; color: #1d4ed8; margin: 20px 0; }
        .retry-btn { background: #3b82f6; color: white; border: none; border-radius: 12px; padding: 15px 30px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="game-screen">
        <h1>🚀 Ultra-Test Táctil</h1>
        <div class="subtitle">Toca una opción para marcar tu respuesta</div>
        
        <div class="stats-bar">
            <span id="txt-progreso">Pregunta: 1/50</span>
            <span id="txt-puntaje">✨ Puntos: 0</span>
            <span id="txt-racha">🔥 Racha: 0</span>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar" id="barra-progreso"></div>
        </div>
        
        <div class="question-box" id="pregunta-texto">PREMISA</div>
        
        <div class="options-list" id="lista-opciones"></div>
        
        <div class="feedback" id="feedback-texto"></div>
    </div>

    <div id="result-screen" class="result-screen">
        <div class="result-title">🎉 ¡Test Completado! 🎉</div>
        <p style="font-size: 16px; color: #4b5563;">Has terminado las 50 preguntas de Aptitud Verbal.</p>
        <div class="rango-box" id="rango-final">RANGO</div>
        <p style="font-size: 16px; text-align: left; padding: 0 10px;">
            🎯 <b>Aciertos totales:</b> <span id="res-aciertos" style="float:right; color:#10b981; font-weight:bold;">0</span><br><br>
            🔥 <b>Máxima racha:</b> <span id="res-racha" style="float:right; color:#f59e0b; font-weight:bold;">0</span><br><br>
            📈 <b>Porcentaje de éxito:</b> <span id="res-porcentaje" style="float:right; color:#3b82f6; font-weight:bold;">0%</span>
        </p>
        <button class="retry-btn" onclick="reiniciarJuego()">🔄 Intentar de Nuevo</button>
    </div>
</div>
