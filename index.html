<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Táctil de Sinónimos</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #0f172a; margin: 0; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #f8fafc; }
        .quiz-container { background: #1e293b; width: 100%; max-width: 450px; border-radius: 20px; padding: 20px; border: 1px solid #334155; }
        h1 { font-size: 22px; text-align: center; color: #3b82f6; margin: 0 0 15px 0; }
        .stats { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 15px; background: #0f172a; padding: 10px; border-radius: 10px; }
        .question-box { background: #0f172a; border-radius: 12px; padding: 20px; font-size: 18px; font-weight: bold; text-align: center; margin-bottom: 20px; border: 1px solid #334155; }
        .options-list { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: #334155; border: 1px solid #475569; border-radius: 12px; padding: 16px; font-size: 15px; color: #f1f5f9; text-align: left; cursor: pointer; font-weight: 600; -webkit-tap-highlight-color: transparent; }
        .option-btn.correct { background: #065f46 !important; border-color: #10b981 !important; }
        .option-btn.incorrect { background: #991b1b !important; border-color: #ef4444 !important; }
        .feedback { text-align: center; font-weight: bold; margin-top: 15px; min-height: 20px; }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>🚀 Test Táctil de Sinónimos</h1>
    
    <div class="stats">
        <span id="txt-progreso">Pregunta: 1/50</span>
        <span id="txt-puntaje">✨ Puntos: 0</span>
        <span id="txt-racha">🔥 Racha: 0</span>
    </div>
    
    <div class="question-box" id="pregunta-texto">Cargando preguntas interactiva...</div>
    
    <div class="options-list" id="lista-opciones">
        <!-- Aquí aparecerán los botones presionables -->
    </div>
    
    <div class="feedback" id="feedback-texto"></div>
</div>

    {n: 45, p: "CÚMULO", o: ["A) cantidad", "B) reunión", "C) montón", "D) variedad", "E) aglomeración"], r: 2},
    {n: 46, p: "HÁLITO", o: ["A) vida", "B) agony", "C) espíritu", "D) ánimo", "E) soplo"], r: 4},
    {n: 47, p: "BADULAQUE", o: ["A) engañado", "B) cándido", "C) camorrero", "D) osado", "E) embustero"], r: 1},
    {n: 48, p: "CÁUSTICO", o: ["A) prudent", "B) mordaz", "C) agresivo", "D) A y B", "E) B y C"], r: 1},
    {n: 49, p: "CHOTEAR", o: ["A) expulsar", "B) mofar", "C) arrogar", "D) temer", "E) atacar"], r: 0},
    {n: 50, p: "FAROLEAR", o: ["A) engreír", "B) mostrar", "C) iluminar", "D) suponer", "E) presumir"], r: 0}
];

let idxActual = 0;
let puntaje = 0;
let racha = 0;
let bloqueado = false;

function cargarPregunta() {
    if (idxActual >= bancoPreguntas.length) {
        document.getElementById("game-screen").innerHTML = "<h2 style='text-align:center;'>🎉 ¡Test completado con éxito!</h2>";
        return;
    }
    bloqueado = false;
    const q = bancoPreguntas[idxActual];
    
    document.getElementById("txt-progreso").innerText = `Pregunta: ${idxActual + 1}/50`;
    document.getElementById("txt-puntaje").innerText = `✨ Puntos: ${puntaje}`;
    document.getElementById("txt-racha").innerText = `🔥 Racha: ${racha}`;
    document.getElementById("feedback-texto").innerText = "";
    
    document.getElementById("pregunta-texto").innerText = `¿Cuál es el sinónimo de ${q.p}?`;
    
    const contenedor = document.getElementById("lista-opciones");
    contenedor.innerHTML = "";
    
    q.o.forEach((opcion, index) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opcion;
        btn.onclick = () => verificarRespuesta(index, btn);
        contenedor.appendChild(btn);
    });
}

function verificarRespuesta(indiceSel, btnTocado) {
    if (bloqueado) return;
    bloqueado = true;
    const q = bancoPreguntas[idxActual];
    
    if (indiceSel === q.r) {
        btnTocado.classList.add("correct");
        puntaje++;
        racha++;
        document.getElementById("feedback-texto").innerText = "✅ ¡Correcto!";
        document.getElementById("feedback-texto").style.color = "#10b981";
    } else {
        btnTocado.classList.add("incorrect");
        racha = 0;
        document.getElementById("feedback-texto").innerText = "❌ Incorrecto";
        document.getElementById("feedback-texto").style.color = "#ef4444";
    }
    
    setTimeout(() => {
        idxActual++;
        cargarPregunta();
    }, 1000);
}

// Inicialización forzada inmediata y segura
cargarPregunta();
</script>
</body>
</html>
