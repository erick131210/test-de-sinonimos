let idxActual = 0; let puntaje = 0; let racha = 0; let bloqueado = false;
const txtProgreso = document.getElementById("txt-progreso");
const txtPuntaje = document.getElementById("txt-puntaje");
const txtRacha = document.getElementById("txt-racha");
const preguntaTexto = document.getElementById("pregunta-texto");
const listaOpciones = document.getElementById("lista-opciones");
const feedbackTexto = document.getElementById("feedback-texto");
const contenedorAnalisis = document.getElementById("contenedor-analisis");
const alertaRespuestaCorrecta = document.getElementById("alerta-respuesta-correcta");
const analisisTexto = document.getElementById("analisis-texto");
const btnSiguiente = document.getElementById("btn-siguiente");
function cargarPregunta() {
if (idxActual >= bancoPreguntas.length) {
preguntaTexto.innerHTML = "🎉 ¡Magnífico! Completaste las 100 preguntas con éxito.";
listaOpciones.innerHTML = ""; feedbackTexto.innerHTML = "";
contenedorAnalisis.style.display = "none"; btnSiguiente.style.display = "none";
txtProgreso.innerHTML = "¡Test de Élite Completado!"; return;
}
bloqueado = false; feedbackTexto.className = "feedback"; feedbackTexto.innerHTML = "";
contenedorAnalisis.style.display = "none"; btnSiguiente.style.display = "none"; listaOpciones.innerHTML = "";
const item = bancoPreguntas[idxActual];
txtProgreso.innerHTML = Pregunta: ${idxActual + 1}/${bancoPreguntas.length};
preguntaTexto.innerHTML = ${item.n}. ${item.p};
item.o.forEach((opcion, index) => {
const boton = document.createElement("button");
boton.className = "option-btn"; boton.innerHTML = opcion;
boton.onclick = () => verificarRespuesta(index, boton);
listaOpciones.appendChild(boton);
});
}
function verificarRespuesta(indiceSeleccionado, botonPresionado) {
if (bloqueado) return; bloqueado = true;
const item = bancoPreguntas[idxActual];
const botones = listaOpciones.getElementsByClassName("option-btn");
if (indiceSeleccionado === item.r) {
botonPresionado.classList.add("correct");
feedbackTexto.innerHTML = "✨ ¡Correcto! Buen análisis semántico.";
feedbackTexto.className = "feedback success";
puntaje += 10; racha += 1; alertaRespuestaCorrecta.style.display = "none";
} else {
botonPresionado.classList.add("incorrect");
botones[item.r].classList.add("correct");
feedbackTexto.innerHTML = "❌ Respuesta Incorrecta.";
feedbackTexto.className = "feedback error"; racha = 0;
alertaRespuestaCorrecta.style.display = "inline-block";
alertaRespuestaCorrecta.innerHTML = La respuesta correcta era: ${item.o[item.r]};
}
txtPuntaje.innerHTML = ✨ Puntos: ${puntaje};
txtRacha.innerHTML = 🔥 Racha: ${racha};
analisisTexto.innerHTML = item.a;
contenedorAnalisis.style.display = "block"; btnSiguiente.style.display = "block";
}
function avanzarPregunta() { idxActual++; cargarPregunta(); }
window.onload = cargarPregunta;
